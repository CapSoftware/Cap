# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
# Every target desktop-release.yml ships. Leaving a target out here leaves its
# platform-specific deps (windows-sys, libc, ...) un-unified, so the sidecar
# `cargo build -p cap` and Tauri's `cargo build -p cap-desktop` resolve
# different feature sets and recompile ~500 shared crates in the same job.
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# --- cap release-build tuning ---
# cap-muxer is ~55 crates; letting it depend on the hack would drag the whole
# unified tree into every `cargo build -p cap-muxer`. Any drift it causes is
# bounded by its own tiny graph.
[traversal-excludes]
workspace-members = ["cap-muxer", "cap-muxer-protocol"]

# hakari unifies dev-dependencies as well, so left alone it pins tauri with its
# `test` feature and tokio `test-util` into every release binary and pulls the
# Tauri/WebKit stack into the standalone GPUI workspace. Only crates whose
# feature drift actually cascades through the sidecar and desktop builds stay
# in the hack; everything else keeps its natural per-binary resolution.
[final-excludes]
third-party = [
    { name = "softbuffer" },
    { name = "aho-corasick" },
    { name = "block2" },
    { name = "cookie" },
    { name = "core-foundation" },
    { name = "core-foundation-sys" },
    { name = "coreaudio-rs" },
    { name = "coreaudio-sys" },
    { name = "crossbeam-utils" },

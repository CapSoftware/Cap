    { name = "fastrand" },
    { name = "futures-lite" },
    { name = "getrandom" },
    { name = "half" },
    { name = "hashbrown" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "image" },
    { name = "indexmap" },

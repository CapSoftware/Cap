[package]
name = "cap-rendering"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
web-editor-camera-removal = ["cap-project/web-editor-camera-removal"]

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1.7", features = ["derive"] }
cap-camera-effects = { path = "../camera-effects" }
cap-flags = { path = "../flags" }
cap-project = { path = "../project" }
cap-cursor-info = { path = "../cursor-info" }
futures = { workspace = true }
futures-intrusive = "0.5.0"
log = "0.4"
serde = { workspace = true }
serde_json = "1.0"
specta.workspace = true
thiserror.workspace = true
wgpu.workspace = true
bezier_easing = "0.1.1"
reactive_graph = "0.1.5"
glyphon = "0.9.0"
tracing.workspace = true
resvg = "0.45"
tiny-skia = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = "0.25.2"
cap-enc-ffmpeg = { path = "../enc-ffmpeg" }
cap-video-decode = { path = "../video-decode" }
ffmpeg-hw-device = { path = "../ffmpeg-hw-device" }
tokio.workspace = true
ffmpeg.workspace = true
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tokio = { version = "1.39.3", default-features = false, features = ["macros", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "ImageBitmap", "HtmlVideoElement", "HtmlCanvasElement", "OffscreenCanvas", "VideoFrame"] }
web-time = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cidre.workspace = true
metal = "0.31"
objc2 = "0.6"
wgpu-hal = { workspace = true, features = ["metal"] }
wgpu-core.workspace = true
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu-hal = { workspace = true, features = ["dx12"] }
wgpu-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
windows_0_58 = { package = "windows", version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }

[dev-dependencies]
cap-media-info = { path = "../media-info" }
tempfile = "3"
pollster = "0.4.0"
pretty_assertions = "1.4.1"

[build-dependencies]
build-time = "0.1"

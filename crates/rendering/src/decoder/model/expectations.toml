case = "decoder-model/ffmpeg/camera-fast/random-seeks/playback"
class = "grid-rounding"
seeds = "2 12 20 26"
reason = "The FFmpeg decoder seeks to the exact request time, so after a reset it answers with the frame on screen at that time. Sequential reads show the same frame through the handle's next-index check (request_next_frame), except right after a hold of two cells or more, where the handle skips that check so reads past the end of a stream stay as they were; there the grid answer is the frame before"

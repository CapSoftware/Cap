[package]
name = "cap-editor"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[example]]
name = "decode-benchmark"
path = "examples/decode-benchmark.rs"

[[example]]
name = "playback-pipeline-benchmark"
path = "examples/playback-pipeline-benchmark.rs"

[[example]]
name = "editor-playback-benchmark"
path = "examples/editor-playback-benchmark.rs"

[[example]]
name = "audio-output-idle-benchmark"
path = "examples/audio-output-idle-benchmark.rs"

[[example]]
name = "editor-startup-benchmark"
path = "examples/editor-startup-benchmark.rs"

[features]
# Offline audio output for the cap-verify suite. Never enabled by the app.
test-hooks = []

[dependencies]
cap-utils = { path = "../utils" }
cap-media = { path = "../media" }
cap-project = { path = "../project" }
cap-rendering = { path = "../rendering" }
cap-audio = { path = "../audio" }
cap-media-info = { path = "../media-info" }

tokio = { workspace = true, features = ["macros", "process", "fs"] }
cpal.workspace = true
axum = { version = "0.7.5", features = ["ws"] }
ffmpeg.workspace = true
specta.workspace = true
serde = { workspace = true }
serde_json = "1.0"
image = { version = "0.25.2", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
tempfile = "3"
sentry.workspace = true
futures = { workspace = true }
tracing.workspace = true
flume.workspace = true
tokio-util = { version = "0.7.15", features = ["rt"] }
ringbuf = "0.4.8"
lru = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
cap-audio = { path = "../audio", features = ["test-support"] }
cap-enc-ffmpeg = { path = "../enc-ffmpeg" }

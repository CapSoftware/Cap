# Real-capture recording oracle (tests/recording.rs): ScreenCaptureKit +
# VideoToolbox through the real Studio and Instant pipelines. Measured on the
# hosted macos-15 and macos-26 runners (display capture, 5 runs each) and on a
# developer Mac (window capture, 5 runs). Root cause for every Instant entry
# below: each Instant track takes its own first admitted frame as zero
# (screen: first encoded frame; audio: AudioAnchor::FirstFrame, the mixer's
# first output) and finalize_instant_output muxes both at pts 0, so any
# difference in first-frame times becomes a permanent A/V offset. Confirms the
# CORE track's fixture findings with real capture.

[[xfail]]
case = "recording/instant/screen-mic-system"
class = "sync"
platforms = ["macos"]
reason = "NEW: the Instant screen track starts at its first encoded frame (the VideoToolbox encoder starts after the audio pipeline), so the screen plays early against mic and system audio: runners 34 to 92 ms (10 of 10 runs), developer Mac 340 to 570 ms (8 of 8)"
link = ""

[[xfail]]
case = "recording/instant/long-holds"
class = "sync"
platforms = ["macos"]
reason = "NEW: same as recording/instant/screen-mic-system on a 30 s recording with screen holds (developer Mac: screen 375 ms early)"
link = ""

[[xfail]]
case = "recording/instant/late-mic"

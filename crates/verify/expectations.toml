# Strict expected failures for the engine verification suite
# (`cargo test -p cap-verify`), in the shared format of crates/verify-expect
# (also used by crates/rendering/src/decoder/model/expectations.toml):
#
#   [[xfail]]
#   case = "<case id as printed by the suite, * globs allowed>"
#   class = "<stale | future | wrong-segment | unreadable | missing | unexpected
#             | frame-count | timestamps | nondeterministic | error
#             | mapping | coverage | duration | caption-track | caption-frame
#             | caption-words | caption-segments | caption-migration
#             | caption-roundtrip>"
#   reason = "<what is wrong>"
#   link = "<PR or issue that fixes it; empty when no fix exists yet>"
#   platforms = ["macos"]   (optional; absent = every platform)
#   flaky = true            (optional; timing-dependent, may pass. State the
#                            measured rate in the reason.)
#
# A listed class that no longer occurs fails the run with "remove this
# xfail", so fixes stay locked in. A class that occurs and is not listed
# fails the run. scripts/verify/bless.sh rewrites this file from a local run
# or from a CI run's report artifacts (`--run <id>`, every platform), keeping
# reasons and links; new entries get a TODO reason. Review the diff.
#
# Recorded on origin/main 5705ee851. "NEW:" marks bugs the suite found that
# no open PR fixes.

[[xfail]]
case = "*/jitter-camera-*/full/*60*/avf"
class = "future"
platforms = ["macos"]
reason = "Camera runaway: with a jittery ~12 fps camera at 30 fps nominal exported at 60 fps, the pts-hole map evicts the hole it just recorded once 64 wider ones are tracked, and the reader drifts ahead (40 s fixture: 531 camera frames ahead, up to 298 source frames; full tier 120 s: 5146 frames, up to 2232 source frames = 74 s ahead; offline playback of the 120 s fixture: 2618 frames, up to 1726 ahead). Export and playback of the 120 s fixture pass with #2595's decoder changes (measured on Apple silicon)"
link = "https://github.com/CapSoftware/Cap/pull/2595"

[[xfail]]
case = "playback/jitter-camera-120s/full/seq60-from0/avf"
class = "stale"
platforms = ["macos"]
flaky = true
reason = "The last screen frame of the 120 s offline playback (output 7199, 119.983 s) shows source 3598 for 3599 in 1 of 3 full runs (38763192776). Mechanism: when the request stream pauses for 250 ms or more, the AVAssetReader decoder's idle timeout (IDLE_READER_TIMEOUT, crates/rendering/src/decoder/avassetreader.rs) clears its cache and reader state, and the final request is then answered with the newest frame before it. Reproduced on Apple silicon by pausing 300 ms before the last request (1 of 1); a 100 ms pause does not reproduce it"
link = ""

[[xfail]]
case = "export/jitter-camera-120s/full/mp460/avf"
class = "nondeterministic"
platforms = ["macos"]
flaky = true
reason = "Two exports of the 120 s jitter-camera project can differ (4001 of 7200 frames, first at frame 3163, in 1 of 3 runs on blacksmith-6vcpu-macos-15, 38838622145) inside the camera runaway of the future entry above. The decoder drains requests in batches with try_recv, so a batch's makeup depends on timing, and the reader's pool position is capped to the batch's newest request (update_decoder_position(decoder_idx, capped)); once the pts-hole map has lost the hold, that decides which reader answers, so the wrong answers themselves vary. Measured on blacksmith-6vcpu-macos-15: alone the case is identical in 16 of 16 runs (5146 wrong frames, probe 38843099696); run beside the rest of the export suite it differs in 3 of 8 (5134 and 5201 wrong frames, probe 38844461913). The IOSurface part of this nondeterminism is gone with #2625 (0 of 3 sol-avf proof runs, 0 of 5 in probe 38784185050); #2595's decoder changes remove the runaway and with it this class (5 of 5 identical exports in that probe's decoder configuration, 2 of 2 on Apple silicon)"
link = "https://github.com/CapSoftware/Cap/pull/2595"


# Crash recovery on the software (libx264) encoder path. Blacksmith macOS VMs
# have no VideoToolbox hardware H.264 encoder (VTCompressionSessionCreate with
# RequireHardwareAcceleratedVideoEncoder returns -12903, probe run
# 38847791287), so h264_videotoolbox fails to open and every recording falls
# back to libx264 (`get_codec_and_options`, crates/enc-ffmpeg/src/video/h264.rs),
# which real Macs also use when the hardware encoder is busy or for targets
# above its estimated capacity (for example 4K at 60 fps). Its GOP is a frame
# count: g = 2 s x nominal fps (keyint 120, keyint_min 61 at 60 fps), scenecut=0,
# and ScreenCaptureKit delivers a variable rate (about 33 fps for this
# stimulus), so the DASH muxer, which cuts only at keyframes, writes 3.68 s
# segments instead of 2 s, and the segment in progress is a 0-byte .tmp at the
# crash (run 38845236912: segment_001 120 frames 3.68 s, segment_002.m4s.tmp
# empty). Recovery keeps only the complete segments. With the hardware encoder
# (hosted runners, real Apple silicon Macs) segments stay near 2 s.

[[xfail]]
case = "recording/studio-recovery/*"
class = "missing"
platforms = ["macos"]
flaky = true
hosts = ["blacksmith"]
bound = { count = 1, screen-lost-s = [3, 5.5] }
reason = "NEW: software (libx264) encoder path: keyframes every 120 frames regardless of the variable capture rate make 3.7 s segments, and the in-progress segment is empty at a crash, so recovery loses 4.5 to 4.8 s against the 3 s budget in 9 of 10 Blacksmith runs (flaky: the loss depends on where the crash falls inside the segment). Bound: at most one 3.7 s segment plus the 1 s since the last presented picture"
link = "https://github.com/CapSoftware/Cap/actions/runs/38845236912"

# First picture after a static screen. During a scripted hold ScreenCaptureKit
# delivers only Idle status buffers; its first Complete frame after the hold
# arrives 70 to 82 ms after the new picture was presented (steady state 23 to
# 31 ms after each present), and it already shows the next picture. Frame-level
# logs (run 38745219281, macos-15: every SCK screen buffer with its
# SCStreamFrameInfoStatus, every Cap send, every mux call) show 0 Complete
# frames between the post-hold picture and the next one, and 1797 Complete
# frames = 1797 Cap sends = 1797 mux calls: the picture never reaches Cap's
# capture callback and Cap drops nothing. The stimulus presents through the
# standard Core Animation path, so a user's first change after a static screen
# is affected the same way: it is recorded ~50 to 80 ms late and anything
# shown for less than that is lost. Whether a given post-hold picture is lost
# depends on whether the 70 to 82 ms resume outlasts that picture, so the
# entries are bounded by the number of holds.


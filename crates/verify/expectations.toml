# Strict expected failures for the engine verification suite
# (`cargo test -p cap-verify`), in the shared format of crates/verify-expect
# (also used by crates/rendering/src/decoder/model/expectations.toml):
#
#   [[xfail]]
#   case = "<case id as printed by the suite, * globs allowed>"
#   class = "<stale | future | wrong-segment | unreadable | missing | unexpected
#             | frame-count | timestamps | nondeterministic | error | coverage
#             | frames-missing | audio-mic | audio-system | sync-mic | sync-system
#             | sync-screen-mic | sync-screen-system | sync-system-mic
#             | sync-camera-mic | start-time | missing-after-hold | colour-level
#             | colour-matrix | caption-* | mapping | duration>"
#   bound = { <metric> = <max> or [<min>, <max>], ... }
#   reason = "<what is wrong>"
#   link = "<PR or issue that fixes it; empty when no fix exists yet>"
#   platforms = ["macos"]   (optional; absent = every platform)
#   flaky = true            (optional; timing-dependent, may pass. State the
#                            measured rate in the reason.)
#   starved = true          (optional, flaky only: excuses the failure only
#                            when the case's starvation sentinel saw the
#                            machine stall during the case)
#
# Every entry carries the bound of its documented mechanism. The suite
# measures each failing class, and an entry excuses a failure only when every
# measurement lies inside its bound; a measured metric the bound does not
# name must be zero. Metrics:
# - frame classes (stale, future, unreadable, missing, ...): <stream>-frames
#   (frames affected per stream), frame (range of output frames or seek
#   positions affected), delta (largest source-frame error);
# - classes from a single check: count (number of problems), plus the
#   check's own measurement: offset-ms (A/V offset, audio minus screen, or
#   screen minus audio for sync-screen-*), spread-ms, missing, unexpected,
#   drift-ms, luma / cb / cr (code values), off-periods (frame periods off
#   the timestamp grid), <stream>-start-late-ms, <stream>-end-lost.
#
# A listed class that no longer occurs fails the run with "remove this
# xfail", so fixes stay locked in. A class that occurs and is not listed, or
# that occurs outside its bound, fails the run. scripts/verify/bless.sh
# rewrites this file from a local run or from a CI run's report artifacts
# (`--run <id>`, every platform), keeping reasons, links and bounds; new
# entries get a TODO reason and their measured range as the bound. Review the
# diff.
#
# "NEW:" marks bugs the suite found that no open PR fixed when they were
# recorded. #2638 fixes the AVAssetReader and pts-hole decoder entries
# (it supersedes #2595 and #2603), #2636 the decode-deadline entries, #2635
# the Windows audio trim entry.

require_bound = true

[[xfail]]
case = "playback/jitter-camera-120s/full/seq60-from0/avf"
class = "stale"
platforms = ["macos"]
flaky = true
bound = { screen-frames = 1, camera-frames = 1, delta = 1, frame = [7199, 7199] }
reason = "The last output frame of the 120 s offline playback (7199, 119.983 s) shows the source frame before the right one in 1 of 3 full runs (38763192776). Mechanism: when the request stream pauses for 250 ms or more, the AVAssetReader decoder's idle timeout (IDLE_READER_TIMEOUT, crates/rendering/src/decoder/avassetreader.rs) clears its cache and reader state, and the final request is then answered with the newest frame before it. Reproduced on Apple silicon by pausing 300 ms before the last request (1 of 1); a 100 ms pause does not reproduce it. Bound: only the final frame, one source frame stale"
link = "https://github.com/CapSoftware/Cap/pull/2638"


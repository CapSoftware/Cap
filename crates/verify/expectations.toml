[[xfail]]
case = "*/basic/transition/*/avf"
class = "future"
platforms = ["macos"]
flaky = true
reason = "AVFoundation cross-fades sometimes show the incoming clip up to 6 source frames ahead on one blend frame (export mp430 frame 74: 121 for 115; export mp460 and playback seq60 frame 148: 120 for 115). Timing dependent on macos-15: 4 of 16 case runs (export mp430/mp460, playback seq30/seq60 in runs 38730081267, 38731626324, 38732325087, 38735816076). Root cause: YuvToRgbaConverter does not keep the decoded CVPixelBuffer alive until its GPU work is submitted, so the AVAssetReader pixel buffer pool recycles the IOSurface and the GPU samples a later frame painted into it; reproduced deterministically by native/rendering/iosurface-source-lifetime/recycled-pool (crates/rendering/tests/expectations.toml). Fixed on fixavf/s2 (8cafa9bfb, 905e0933d): remove this entry with that fix"
link = "https://github.com/CapSoftware/Cap/commit/e60df0ebf244d3a0a77b152135e998406c392af1"


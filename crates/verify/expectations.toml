# Strict expected failures for the engine verification suite
# (`cargo test -p cap-verify`), in the shared format of crates/verify-expect
# (also used by crates/rendering/src/decoder/model/expectations.toml):
#
#   [[xfail]]
#   case = "<case id as printed by the suite, * globs allowed>"
#   class = "<stale | future | wrong-segment | unreadable | missing | unexpected
#             | frame-count | timestamps | nondeterministic | error | coverage
#             | frames-missing | audio-mic | audio-system | sync-mic | sync-system
#             | sync-screen-mic | sync-screen-system | sync-system-mic
#             | sync-camera-mic | start-time | missing-after-hold | colour-level
#             | colour-matrix | caption-* | mapping | duration>"
#   bound = { <metric> = <max> or [<min>, <max>], ... }
#   reason = "<what is wrong>"
#   link = "<PR or issue that fixes it; empty when no fix exists yet>"
#   platforms = ["macos"]   (optional; absent = every platform)
#   flaky = true            (optional; timing-dependent, may pass. State the
#                            measured rate in the reason.)
#   starved = true          (optional, flaky only: excuses the failure only
#                            when the case's starvation sentinel saw the
#                            machine stall during the case)
#
# Every entry carries the bound of its documented mechanism. The suite
# measures each failing class, and an entry excuses a failure only when every
# measurement lies inside its bound; a measured metric the bound does not
# name must be zero. Metrics:
# - frame classes (stale, future, unreadable, missing, ...): <stream>-frames
#   (frames affected per stream), frame (range of output frames or seek
#   positions affected), delta (largest source-frame error);
# - classes from a single check: count (number of problems), plus the
#   check's own measurement: offset-ms (A/V offset, audio minus screen, or
#   screen minus audio for sync-screen-*), spread-ms, missing, unexpected,
#   drift-ms, luma / cb / cr (code values), off-periods (frame periods off
#   the timestamp grid), <stream>-start-late-ms, <stream>-end-lost.
#
# A listed class that no longer occurs fails the run with "remove this
# xfail", so fixes stay locked in. A class that occurs and is not listed, or
# that occurs outside its bound, fails the run. scripts/verify/bless.sh
# rewrites this file from a local run or from a CI run's report artifacts
# (`--run <id>`, every platform), keeping reasons, links and bounds; new
# entries get a TODO reason and their measured range as the bound. Review the
# diff.
#
# "NEW:" marks bugs the suite found that no open PR fixed when they were
# recorded. #2638 fixes the AVAssetReader and pts-hole decoder entries
# (it supersedes #2595 and #2603), #2636 the decode-deadline entries.

require_bound = true

[[xfail]]
case = "export/backward-hold/backward-jumps/mp460/avf"
class = "stale"
platforms = ["macos"]
flaky = true
bound = { camera-frames = 1, delta = 1, frame = [2579, 2579] }
reason = "AVAssetReader serves one camera frame 1 source frame stale after the timeline jumps backward (output frame 2579: source 1048 for 1049): the reader chosen after the jump had already vended past the request and its previous vend was no longer cached, so the nearest older cached frame answered. Every run in probe 38762089521 (42 of 42) and on hosted macOS, but it passed on blacksmith-6vcpu-macos-15 in push run 38846099909: whether the previous vend is still cached depends on the decoder's wall-clock idle timeout, so it is flaky there"
link = "https://github.com/CapSoftware/Cap/pull/2638"

# Decode deadline under machine starvation. These apply only to a case the
# starvation sentinel saw stall (starved = true) and only with the signature
# of the mechanism; the same symptom on a healthy machine is a failure.

[[xfail]]
case = "playback/backward-hold/backward-jumps/seq30-from0/ffmpeg"
class = "error"
platforms = ["windows"]
flaky = true
starved = true
bound = { count = 1 }
reason = "NEW: under load offline playback gets no frame at all: a decode that misses its 2,000 ms deadline (crates/rendering/src/decoder/mod.rs, request_frame returns None) leaves the request unanswered (\"decoders returned no frame for clip 0 at 5.000s\"). Seen once on a starved windows-2022 runner (Engine verify 38841241061, windows shard 1, sentinel longest wake gap 3.1 s, 38 gaps over 100 ms); same deadline as the export frame reorder entry. Bound: one error, only under a sentinel-proven stall"
link = "https://github.com/CapSoftware/Cap/pull/2636"

[[xfail]]
case = "export/early-camera/full/mp430/ffmpeg"
class = "frame-count"
platforms = ["windows"]
flaky = true
starved = true
bound = { count = 1, missing = 1 }
reason = "NEW: under load an offline export loses its first frame: when the first decodes miss their 2,000 ms deadline the render loop advances before any usable frame exists (crates/rendering/src/lib.rs, initial decode failure path; sol-starved-export.md), so the export has 179 of 180 frames. Seen once on a starved windows-2022 runner (Engine verify 38841241061, windows shard 1, sentinel longest wake gap 4.2 s, 133 gaps over 100 ms). Bound: exactly one frame, only under a sentinel-proven stall"
link = "https://github.com/CapSoftware/Cap/pull/2636"

[[xfail]]
case = "export/early-camera/full/mp430/ffmpeg"

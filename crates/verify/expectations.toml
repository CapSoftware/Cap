# Strict expected failures for the engine verification suite
# (`cargo test -p cap-verify`), in the shared format of crates/verify-expect
# (also used by crates/rendering/src/decoder/model/expectations.toml):
#
#   [[xfail]]
#   case = "<case id as printed by the suite, * globs allowed>"
#   class = "<stale | future | wrong-segment | unreadable | missing | unexpected
#             | frame-count | timestamps | nondeterministic | error
#             | mapping | coverage | duration | caption-track | caption-frame
#             | caption-words | caption-segments | caption-migration
#             | caption-roundtrip>"
#   reason = "<what is wrong>"
#   link = "<PR or issue that fixes it; empty when no fix exists yet>"
#   platforms = ["macos"]   (optional; absent = every platform)
#   flaky = true            (optional; timing-dependent, may pass. State the
#                            measured rate in the reason.)
#
# A listed class that no longer occurs fails the run with "remove this
# xfail", so fixes stay locked in. A class that occurs and is not listed
# fails the run. scripts/verify/bless.sh rewrites this file from a local run
# or from a CI run's report artifacts (`--run <id>`, every platform), keeping
# reasons and links; new entries get a TODO reason. Review the diff.
#
# Recorded on origin/main 5705ee851. "NEW:" marks bugs the suite found that
# no open PR fixes.

[[xfail]]
case = "export/jitter-camera-*/full/mp460/avf"
class = "future"
platforms = ["macos"]
reason = "Camera runaway: with a jittery ~12 fps camera at 30 fps nominal exported at 60 fps, the pts-hole map evicts the hole it just recorded once 64 wider ones are tracked, and the reader drifts ahead (40 s fixture: 531 camera frames ahead, up to 298 source frames; full tier 120 s: 5146 frames, up to 2232 source frames = 74 s ahead)"
link = "https://github.com/CapSoftware/Cap/pull/2595"

[[xfail]]
case = "export/jitter-camera-120s/full/mp460/ffmpeg"
class = "stale"
reason = "Same pts-hole eviction on the FFmpeg decoder (full tier, 120 s): 1551 of 7199 camera frames stale, up to 90 source frames"
link = "https://github.com/CapSoftware/Cap/pull/2595"

[[xfail]]
case = "export/backward-hold/backward-jumps/mp460/avf"
class = "stale"
platforms = ["macos"]
reason = "AVAssetReader serves one camera frame 1 source frame stale after the timeline jumps backward (output frame 2579)"
link = "https://github.com/CapSoftware/Cap/pull/2595"

[[xfail]]
case = "export/early-camera/full/*"
class = "future"
reason = "NEW: the auto-calculated clip camera offset repeats the decoder's start-time alignment, so a camera that started before the latest track plays (latest - camera.start) ahead (1.0 s here). Real when the mic is slow to start"
link = ""

[[xfail]]
case = "export/camera-pts-late/full/mp430/avf"
class = "future"
platforms = ["macos"]
reason = "A camera file whose pts start 2 s in runs ahead from the first output frame instead of holding its first frame"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "export/camera-pts-late/full/mp430/ffmpeg"
class = "future"
reason = "NEW: FFmpeg decoder, same as the AVAssetReader case: a camera file whose pts start 2 s in runs ahead from the first output frame (178 of 179 frames)"
link = ""

[[xfail]]
case = "seek/seek-*/keyframes60/avf"
class = "stale"
platforms = ["macos"]
reason = "Wrong-GOP seek: the reader starts on the keyframe time rounded to 10 ms, decodes the previous GOP and shows its last frame under the keyframe's number (requests between the keyframe pts and the next slot show keyframe - 1)"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "seek/seek-*/storm30/avf"
class = "stale"
platforms = ["macos"]
reason = "A reused AVAssetReader answers from a frame cached by an earlier, unrelated seek (frame 349 shows 237)"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "seek/vfr-holds/storm60/avf"
class = "future"
platforms = ["macos"]
reason = "Seek storm over long VFR holds: AVAssetReader shows a frame from the far side of a hold (expected 60, got 217)"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "seek/vfr-holds/storm60/avf"
class = "stale"
platforms = ["macos"]
flaky = true
reason = "Same storm, an additional stale answer in 3 of 4 runs on main (timing-dependent reader reuse)"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "seek/vfr-holds/into-holds60/avf"
class = "stale"
platforms = ["macos"]
flaky = true
reason = "NEW: AVAssetReader camera answers one frame stale when a region is revisited after other seeks (see seek/vfr-holds/revisit60/avf for the deterministic sequence). This longer sequence fails 12 of 13 runs on main; it passed once under parallel load, probably because the decoder's wall-clock paths (250 ms idle reader drop, 100 ms scrub cooldown) change which branch answers"
link = ""

[[xfail]]
case = "seek/vfr-holds/revisit60/avf"
class = "stale"
platforms = ["macos"]
reason = "NEW: seeks to 2.0 s, 3.5 s, 1.2 s, 2.3 s (each + 29 playback frames, 60 fps): the camera request at 2.483 s (slot 74, CFR camera) is answered with slot 73. Deterministic: 3 of 3 on main and 3 of 3 with #2603; FFmpeg is correct. Repro: CAP_VERIFY_SEEK_SCRIPT='vfr-holds@60:2.0+29,3.5+29,1.2+29,2.3+29' cargo test -p cap-verify --test seek script -- --nocapture"
link = ""

[[xfail]]
case = "seek/*/storm*/ffmpeg"
class = "stale"
reason = "NEW: FFmpeg decoder seeks answer stale frames: the backward-seek lookback tolerance serves a cached frame 1-4 source frames old, and seeks near the start show frame 0 (up to 67 source frames stale)"
link = ""

# Instant mode (fixtures recorded through the real Instant muxers and
# finalize_instant_output). Needs confirmation with real capture devices
# (recording track); the product anchors the Instant audio track at the
# recording epoch on Linux only.

[[xfail]]
case = "export/instant-ungated-mic-late/output/mp4/native"
class = "sync"
platforms = ["macos", "windows"]
reason = "NEW: the Instant audio track is anchored at its first sample (AudioAnchor::FirstFrame) and nothing aligns it to the screen afterwards: a mic that becomes ready 0.2 s after the screen plays 200 ms early in output.mp4"
link = ""

[[xfail]]
case = "export/instant-ungated-system-loopback/output/mp4/native"
class = "sync"
platforms = ["macos", "windows"]
reason = "NEW: same anchor, loopback-style system audio (WASAPI delivers packets only while sound plays): the first sound becomes audio zero, so all audio is early by the time to first sound (260 ms here)"
link = ""

[[xfail]]
case = "export/instant-gated-*/output/mp4/native"
class = "sync"
reason = "NEW: after the start gate opens, the screen and audio pipelines each take their own first admitted frame as zero, so audio is late by up to one video frame (13 ms with the gate opening between frames; 30-33 ms when it opens on a frame)"
link = ""

[[xfail]]
case = "export/instant-gated-system-only/output/mp4/native"
class = "audio"
flaky = true
reason = "NEW: gated loopback-only system audio sometimes loses markers (2 of 11 lost in 1 of 2 fresh recordings, with the track 958 ms early)"
link = ""

[[xfail]]
case = "export/instant/output/mp4/native"
class = "audio"
reason = "NEW: mic plus loopback system audio mixed into the Instant audio track behind the start gate: every system-audio marker is missing from output.mp4 (11 of 11, 3 of 3 recordings)"
link = ""

[[xfail]]
case = "export/instant/output/mp4/native"
class = "sync"
reason = "NEW: see instant-gated-*: audio up to one frame late after the start gate"
link = ""

[[xfail]]
case = "*/basic/transition/*60*/avf"
class = "stale"
platforms = ["macos"]
reason = "NEW: during a cross-fade both clips read the same AVAssetReader decoder at two positions; at 60 fps the incoming side of output frame 149 (2.483 s) shows source frame 115 instead of 116. Same frame in export and in offline playback, deterministic (3 of 3)"
link = ""

[[xfail]]
case = "seek/seek-native/keyframes60/avf"
class = "future"
platforms = ["macos"]
flaky = true
reason = "On the macos-15 runner (paravirtual VideoToolbox) the wrong-GOP seek also produced one answer a frame ahead (1 of 66); not seen on Apple silicon hardware"
link = "https://github.com/CapSoftware/Cap/pull/2603"

[[xfail]]
case = "seek/seek-*/keyframes60/ffmpeg"
class = "stale"
platforms = ["linux", "windows"]
reason = "NEW: FFmpeg decoder seeks near the start show frame 0 (frame 124 at 60 fps shows source 0 instead of 61) and one keyframe seek answers one frame stale (linux runner; the x264 fallback fixture)"
[[xfail]]
case = "editing/mapping/duration-covered"
class = "coverage"
reason = "NEW: a fullscreen text segment (a hold) left past the end of the clips (place a text card near the end, then trim or delete clips; clip edits do not ripple text segments) still adds its length to TimelineConfiguration::duration(), but get_frame_mapping returns None from the content end on, so the hold and the time before it have no source frame. Minimal repro: Hold at 0.92 of a 7 s clip, then trim the clip end"
link = ""

[[xfail]]
case = "editing/export/hold-past-end"
class = "frame-count"
reason = "NEW: same as editing/mapping/duration-covered, end to end: a 1 s fullscreen text at 5.4 s and the clip trimmed to 3.2 s give a 4.2 s timeline, but the export stops at the first unmapped frame: 96 frames instead of 126, and the text card is never rendered"
link = ""

[[xfail]]
case = "captions/app/segmentation/unicode"
class = "caption-segments"
reason = "NEW (minor): caption chunking decides that a boundary word is a weak one-letter word with String::len() (bytes), so a one-letter word outside ASCII such as the French preposition 'à' is not weak and a caption can end on it (apps/desktop-gpui/src/transcription.rs caption_boundary_word_is_weak). Repro: cargo test --manifest-path apps/desktop-gpui/Cargo.toml --bin cap-gpui segmentation_matches_reference_unicode -- --nocapture"
# Real-capture recording oracle (tests/recording.rs). Measured on hosted
# macos-15/macos-26 runners (display capture) and a developer Mac (window
# capture); every run of every case failed with this class.

[[xfail]]
case = "recording/instant/*"
class = "sync"
platforms = ["macos"]
reason = "NEW: Instant mode starts the video track at its first encoded frame but the audio track at the recording start, and finalize muxes both at pts 0, so the screen plays early by the video start-up delay (runners: screen 24 to 68 ms ahead of mic and system audio; developer Mac, window capture: 360 to 430 ms)"
link = ""

[[xfail]]
case = "recording/studio-recovery/*"
class = "sync"
platforms = ["macos"]
reason = "NEW: crash recovery rewrites recording-meta.json without any track start_time, so the editor aligns screen, mic and system audio at 0 and the screen plays early by its start-up delay (runners: 83 to 104 ms; developer Mac: ~440 ms)"
link = ""

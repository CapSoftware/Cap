# Instant mode (fixtures recorded through the real Instant muxers and
# finalize_instant_output). Needs confirmation with real capture devices
# (recording track); the product anchors the Instant audio track at the
# recording epoch on Linux only.

[[xfail]]
case = "export/instant*/output/mp4/native"
class = "timestamps"
platforms = ["macos"]
flaky = true
reason = "On macOS the Instant video timestamps follow the muxer's processing clock, not the capture timestamps: after the 2 s warmup VideoDriftTracker::calculate_timestamp (crates/recording/src/output_pipeline/core.rs) returns anchor_source + (wall clock when the frame is processed - anchor wall clock), and the anchor is the first frame processed after the first 2 s segment rollover. Any delay between capture and processing (late delivery, a muxer stall) moves frames by that delay, and a stall at the anchor shifts every later frame (860 ms in one fresh recording, frames 62-75 compressed into 35 ms). Linux uses CaptureInstantTimeline (capture cadence bounded by the wall clock) and is not affected. Fresh fixtures: 22 of 105 case runs on macos-15/26 (instant probe run 38735811849, every Instant variant), 1 of 7 in run 38735816076; spread 17-860 ms against the 16.7 ms limit"
link = ""

[[xfail]]
case = "export/instant-ungated-mic-late/output/mp4/native"
class = "sync"
platforms = ["macos", "windows"]
reason = "NEW: the Instant audio track is anchored at its first sample (AudioAnchor::FirstFrame) and nothing aligns it to the screen afterwards: a mic that becomes ready 0.2 s after the screen plays 200 ms early in output.mp4"
link = ""

[[xfail]]
case = "export/instant-ungated-system-loopback/output/mp4/native"
class = "sync"
platforms = ["macos", "windows"]
reason = "NEW: same anchor, loopback-style system audio (WASAPI delivers packets only while sound plays): the first sound becomes audio zero, so all audio is early by the time to first sound (260 ms here)"
link = ""

[[xfail]]
case = "export/instant-gated-*/output/mp4/native"
class = "sync"
reason = "NEW: after the start gate opens, the screen and audio pipelines each take their own first admitted frame as zero, so audio is late by up to one video frame (13 ms with the gate opening between frames; 30-33 ms when it opens on a frame)"
link = ""

[[xfail]]
case = "export/instant-gated-system-only/output/mp4/native"
class = "audio"
flaky = true
reason = "NEW: gated loopback-only system audio sometimes loses markers (2 of 11 lost in 1 of 2 fresh recordings, with the track 958 ms early)"
link = ""

[[xfail]]
case = "export/instant/output/mp4/native"
class = "audio"
platforms = ["macos", "windows"]
reason = "NEW: mic plus loopback system audio mixed into the Instant audio track behind the start gate: every system-audio marker is missing from output.mp4 (11 of 11, 3 of 3 recordings; same on windows-2022). On macOS the mic markers are damaged too: in 8 of 15 fresh recordings (probe run 38735811849) the last 20-35 ms of every mic marker is replaced by the tail of a system-audio marker, so no mic payload decodes (the chirps are intact and are identified by their timing pattern, which keeps sync measured), and once a decoded mic marker sat 68 ms early. Linux, whose Instant audio pipeline anchors at the recording epoch (AudioAnchor::PipelineEpoch), keeps all 11 system markers (3 of 3 CI runs), which points at the FirstFrame anchor path"
link = ""

[[xfail]]
case = "export/instant/output/mp4/native"
class = "sync"
reason = "NEW: see instant-gated-*: audio up to one frame late after the start gate"
link = ""


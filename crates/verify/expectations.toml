platforms = ["windows"]
flaky = true
starved = true
bound = { screen-frames = 179, camera-frames = 179, delta = 2, frame = [0, 179] }
reason = "NEW: same initial decode-deadline loss as the frame-count entry: with the first frame gone every later frame shows the source one or two frames ahead (146 of 178 screen frames). Seen once on a starved windows-2022 runner (Engine verify 38841241061). Bound: at most two source frames ahead, only under a sentinel-proven stall"
link = "https://github.com/CapSoftware/Cap/pull/2636"


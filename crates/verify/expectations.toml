class = "audio"
reason = "NEW: mic plus loopback system audio mixed into the Instant audio track behind the start gate: every system-audio marker is missing from output.mp4 (11 of 11, 3 of 3 recordings)"
link = ""

[[xfail]]
case = "export/instant/output/mp4/native"

[package]
name = "cap-verify"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
cap-media-info = { path = "../media-info" }
cap-project = { path = "../project" }
cap-recording = { path = "../recording" }
cap-timestamp = { path = "../timestamp" }

anyhow = { workspace = true }
ffmpeg = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
relative-path = "1.9.3"
rustfft = "6.4.1"
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
toml = "0.8"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
cap-enc-avfoundation = { path = "../enc-avfoundation" }
cidre = { workspace = true }
cpal = { workspace = true }
futures = { workspace = true }
objc2-foundation = "0.3.1"
scap-screencapturekit = { path = "../scap-screencapturekit" }
softbuffer = "0.4"
winit = "0.30"

[dev-dependencies]
cap-recording = { path = "../recording", features = ["test-utils"] }
cap-editor = { path = "../editor" }
cap-export = { path = "../export" }
cap-rendering = { path = "../rendering" }
tempfile = "3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
scap-targets = { path = "../scap-targets" }

[[bin]]
name = "cap-verify-stimulus"
path = "src/bin/stimulus.rs"
test = false

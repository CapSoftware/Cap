[package]
name = "cap-editor-browser-renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cap-project = { path = "../../../crates/project" }
futures-channel = "0.3"
js-sys = "=0.3.80"
serde_json = "1"
wasm-bindgen = "=0.2.103"
wasm-bindgen-futures = "=0.4.53"
wgpu = { version = "25.0.2", features = ["webgl", "webgpu"] }
web-sys = { version = "=0.3.80", features = ["console", "HtmlCanvasElement", "HtmlVideoElement", "WebGl2RenderingContext", "Window"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[package]
name = "cap-editor-browser-renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
console_error_panic_hook = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
cap-project = { path = "../../../crates/project" }
cap-rnnoise = { path = "../../../crates/rnnoise", optional = true }
tracing = { version = "0.1", optional = true }
cap-rendering = { path = "../../../crates/rendering" }
futures-channel = "0.3"
js-sys = "=0.3.80"
serde_json = "1"
wasm-bindgen = "=0.2.103"
wasm-bindgen-futures = "=0.4.53"
wgpu = { version = "25.0.2", features = ["webgl", "webgpu"] }
web-sys = { version = "=0.3.80", features = ["console", "HtmlCanvasElement", "HtmlVideoElement", "OffscreenCanvas", "VideoFrame", "WebGl2RenderingContext", "Window"] }

[features]
# Local export's audio mix and Studio Sound (RNNoise and its model); only the
# export worker loads this build.
export-audio = ["dep:cap-rnnoise", "dep:tracing"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

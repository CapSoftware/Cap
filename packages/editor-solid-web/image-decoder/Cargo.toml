[package]
name = "cap-editor-image-decoder"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
wasm-bindgen = "=0.2.103"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

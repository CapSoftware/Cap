# This is meant for local development only. Do not use this in production.
name: cap-so-dev

services:
  postgres:
    container_name: postgres-primary-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cap-media-server:
    container_name: cap-media-server-dev
    build:
      context: ../..
      dockerfile: apps/media-server/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:-local-media-server-secret}

  # Local S3 Strorage
  minio:
    container_name: minio-storage
    image: "pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: capS3root
      MINIO_ROOT_PASSWORD: capS3root
    volumes:
      - ~/minio/data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    container_name: minio-bucket-creation
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 capS3root capS3root;
      /usr/bin/mc mb myminio/capso;
      echo '{\"Version\": \"2012-10-17\",\"Statement\": [{\"Effect\": \"Allow\",\"Principal\": {\"AWS\": [\"*\"]},\"Action\": [\"s3:GetObject\"],\"Resource\": [\"arn:aws:s3:::capso/*\"]}]}' > /tmp/policy.json;
      /usr/bin/mc anonymous set-json /tmp/policy.json myminio/capso;
      exit 0;
      "
volumes:
  postgres-data:
  minio-data:
  minio-certs:

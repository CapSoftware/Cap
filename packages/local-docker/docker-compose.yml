# This is meant for local development only. Do not use this in production.
name: cap-so-dev

services:
  ps-mysql:
    container_name: mysql-primary-db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: planetscale
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      [
        "--max_connections=1000",
        "--default-authentication-plugin=mysql_native_password",
      ]
    ports:
      - 3306:3306
    volumes:
      - ps-mysql:/var/lib/mysql

  cap-media-server:
    container_name: cap-media-server-dev
    build:
      context: ../..
      dockerfile: apps/media-server/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:-local-media-server-secret}

  # Local S3 storage
  rustfs:
    container_name: rustfs-storage
    image: "rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: capS3root
      RUSTFS_SECRET_KEY: capS3root
      RUSTFS_CONSOLE_ENABLE: "true"
      # Presigned uploads also originate from desktop and embedded SDK clients.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - rustfs-data:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  createbuckets:
    container_name: rustfs-bucket-creation
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set caprustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb caprustfs/capso --ignore-existing
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::capso/*"]}]}' > /tmp/policy.json
        mc anonymous set-json /tmp/policy.json caprustfs/capso
    environment:
      RUSTFS_ACCESS_KEY: capS3root
      RUSTFS_SECRET_KEY: capS3root
volumes:
  ps-mysql:
  rustfs-data:

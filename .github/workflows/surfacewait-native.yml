name: Surface wait native proof
on:
  workflow_dispatch:
  push:
    branches: [ci/fixproof-surfacewait-control, ci/fixproof-surfacewait]
    paths: [.github/workflows/surfacewait-native.yml]
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/engine-verify-os.yml
    with:
      platform: macos
      runner: macos-15
      target: aarch64-apple-darwin
      tier: full
      suites: export,audio

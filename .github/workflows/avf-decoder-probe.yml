name: AVF decoder fix probe (scratch)

# Scratch proof for fix/avf-decoder-requests, not for merge. Repeats the AVF
# cases the decoder fix targets, plus the rec-studio across-segments case,
# on base (product diff reverted) and fix, with no flaky reruns.
# [probe2]: one job per runner builds both variants and interleaves them.

on:
  push:
    branches: [ci/fixproof-avf-decoder]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CAP_VERIFY_CARGO_PROFILE: ci-verify
  CAP_VERIFY_LOCKED: "1"

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe2]')
    name: interleaved ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-15, blacksmith-6vcpu-macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: full
      - name: Build both variants
        run: |
          set -euo pipefail
          keep() {
            mkdir -p "$RUNNER_TEMP/bin/$1/deps"
            ln -sfn "$GITHUB_WORKSPACE/target/native-deps" "$RUNNER_TEMP/bin/$1/Frameworks"
            for t in seek playback export; do
              p=$(grep -o "Executable tests/$t.rs ([^)]*)" "$RUNNER_TEMP/build-$1.log" | sed 's/.*(\(.*\))/\1/')
              cp "$p" "$RUNNER_TEMP/bin/$1/deps/$t"
            done
          }
          CARGO_TERM_COLOR=never cargo test --profile ci-verify --locked -p cap-verify --test seek --test playback --test export --no-run 2>&1 | tee "$RUNNER_TEMP/build-fix.log"
          keep fix
          git apply -R probe/product.patch
          CARGO_TERM_COLOR=never cargo test --profile ci-verify --locked -p cap-verify --test seek --test playback --test export --no-run 2>&1 | tee "$RUNNER_TEMP/build-base.log"
          keep base
          git apply probe/product.patch
          ls -la "$RUNNER_TEMP"/bin/*/deps
      - name: Interleaved repeats
        run: |
          set +e
          out="$RUNNER_TEMP/probe"
          mkdir -p "$out"
          one() {
            local cfg="$1" name="$2" test="$3" case="$4" tier="$5" r="$6"
            local dir="$out/$name-$cfg-$r"
            mkdir -p "$dir"
            local t0=$(python3 -c 'import time; print(time.time())')
            (cd crates/verify && CAP_VERIFY_REPORT_DIR="$dir" CAP_VERIFY_CASE="$case" CAP_VERIFY_TIER="$tier" \
              "$RUNNER_TEMP/bin/$cfg/deps/$test" --test-threads 1 > "$dir.log" 2>&1)
            local t1=$(python3 -c 'import time; print(time.time())')
            echo "TIME $name $cfg $r $(python3 -c "print(round($t1 - $t0, 2))")"
            cat "$dir"/*.jsonl 2>/dev/null | python3 -c '
          import sys, json
          for l in sys.stdin:
              r = json.loads(l)
              print("   ", r["outcome"], r["case"], sorted(r["failures"]), "|", r["summary"][:160].replace("\n", " "))'
          }
          for r in 1 2 3 4; do
            if [ $((r % 2)) = 1 ]; then order="base fix"; else order="fix base"; fi
            for cfg in $order; do
              one $cfg storm30 seek 'seek/seek-*/storm30/*' full $r
              one $cfg vfrstorm seek 'seek/vfr-holds/storm60/*' full $r
              one $cfg exports export 'export/basic/*' fast $r
              one $cfg jitter120 export 'export/jitter-camera-120s/full/mp460/*' full $r
            done
          done
          for i in 1 2 3; do
            CAP_VERIFY_REPORT_DIR="$out/model-$i" scripts/verify/run.sh full --suites decoder-model-avf > "$out/model-$i.log" 2>&1
            echo "model rep $i: exit $?"
            grep -E 'UNEXPECTED|^FAIL |avf decoder model' "$out/model-$i.log" | cut -c1-220
          done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: avf-decoder-interleaved-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/probe/**/*.jsonl
            ${{ runner.temp }}/probe/*.log
          retention-days: 7

name: Verify timed Studio fragments

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Empty runs the full engine matrix"
        type: string
        default: ""
      tier:
        description: Tier
        type: choice
        options: [fast, full]
        default: full

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - platform: linux
            runner: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/engine-verify-os.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      tier: ${{ inputs.tier || 'full' }}
      suites: ${{ inputs.suites }}

name: Scratch seek-gop replay

on:
  push:
    branches:
      - ci/decoder-seek-gop-replay2

permissions:
  contents: read

jobs:
  replay:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: fast
      - name: Replay
        run: |
          set +e
          mkdir -p target/ci-verify
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks" target/ci-verify/Frameworks
          export CAP_VERIFY_TIER=fast
          git fetch -q origin main
          for i in 1 2 3; do
            for variant in base head; do
              if [[ $variant == base ]]; then git checkout -q FETCH_HEAD -- crates/rendering/src/decoder/avassetreader.rs; else git checkout -q HEAD -- crates/rendering/src/decoder/avassetreader.rs; fi
              cargo nextest run --cargo-profile ci-verify -p cap-verify --test seek --no-fail-fast --failure-output final > "$RUNNER_TEMP/replay-$variant-$i.log" 2>&1
              echo "round $i $variant exit=$?"
              grep -n "FAIL seek" "$RUNNER_TEMP/replay-$variant-$i.log" | head -8
            done
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay
          path: ${{ runner.temp }}/replay-*.log

name: Verify keyframe cadence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyframes:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: full
      - name: Matched VideoToolbox crash and encoder proof
        run: python3 scripts/verify/keyframe-hosted.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyframe-videotoolbox
          path: ${{ runner.temp }}/keyframe-proof
          if-no-files-found: error
          retention-days: 14

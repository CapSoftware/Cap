name: DXC fallback proof (temporary)

on:
  push:
    branches:
      - fix/windows-dxc-fxc-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-sync
          save-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js

      - name: Add FFmpeg DLLs to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\\target\\ffmpeg\\bin"

      - name: Bundled DXC is staged next to the test binaries
        shell: bash
        run: ls -la target/debug/dxcompiler.dll target/debug/dxil.dll

      - name: After (this branch)
        shell: bash
        run: |
          cargo test --locked -p cap-rendering --lib dx12_compiler_fallback_tests -- --nocapture 2>&1 | tee after-unit.txt
          cargo test --locked -p cap-rendering --test dxc_fallback_e2e -- --nocapture 2>&1 | tee after.txt
          echo "----- summary -----"
          grep -h "PROOF RESULT\|retrying with FXC\|dx12 init error\|device created on FXC\|no bundled DXC\|test result\|^test " after-unit.txt after.txt

      - name: Before (main's crates/rendering/src/lib.rs)
        shell: bash
        run: |
          git show origin/main:crates/rendering/src/lib.rs > crates/rendering/src/lib.rs
          git diff --stat
          if cargo test --locked -p cap-rendering --test dxc_fallback_e2e -- --nocapture > before.txt 2>&1; then
            cat before.txt
            echo "::error::main unexpectedly created a device with an unloadable DXC"
            exit 1
          fi
          echo "----- summary -----"
          grep -h "PROOF RESULT\|test result\|panicked\|^test " before.txt
          grep -q "PROOF RESULT: Err(No GPU adapter found)" before.txt

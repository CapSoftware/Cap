name: Scratch CK editor draw, own patch stacks

on:
  merge_group:
  pull_request:
    paths:
      - "apps/desktop-gpui/patches/**"
      - "scripts/gpui-app-bench.py"
      - ".github/workflows/gpui-app-bench.yml"
  push:
    branches:
      - "ci/ck-gpuibench*"
  workflow_dispatch:
    inputs:
      base:
        description: "Ref whose patch stack is the baseline (default: the merge base with main)"
        default: ""
      rounds:
        description: "Interleaved rounds per side"
        default: "5"

concurrency:
  group: gpui-app-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub ignores paths filters in the merge queue, so the queue run applies
  # this workflow's pull_request paths to the queued change itself.
  scope:
    name: Scope
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Merge queue scope
        id: queue
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/merge_queue.py scope --workflow .github/workflows/gpui-app-bench.yml --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  editor:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Editor draw benchmark (macOS)
    # Benchmarks build GPUI twice and run for up to two hours, so pull requests
    # from forks do not start them; maintainers can run them with workflow_dispatch.
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the reference recording
        uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Prepare head and base GPUI checkouts
        shell: bash
        env:
          BASE_INPUT: 3519358233729fcf297bbdad0de5d91fcc3547a1
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
          base="${BASE_INPUT:-}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base HEAD "${PR_BASE:-origin/main}")"
          fi
          echo "Head $(git rev-parse --short HEAD), base patch stack from $(git rev-parse --short "$base")" | tee -a "$GITHUB_STEP_SUMMARY"
          git worktree add --detach "$RUNNER_TEMP/base/cap" "$base"
          (cd "$RUNNER_TEMP/base/cap" && node scripts/setup.js && node scripts/sync-desktop-versions.mjs && ./scripts/prepare-gpui-dependency.sh)

      - name: Build head and base
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/debug"
          # Head: this tree's app with its own patch stack (../zed-cap).
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked \
            --target "$TARGET" --bin cap-gpui
          cp "$bin_dir/cap-gpui" "$bin_dir/cap-gpui-head"
          # Base: main's app with main's own patch stack ($RUNNER_TEMP/base/zed-cap),
          # built from its own worktree and config.
          base_bin="$RUNNER_TEMP/base/cap/apps/desktop-gpui/target/$TARGET/debug"
          (cd "$RUNNER_TEMP/base/cap" && cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked \
            --target "$TARGET" --bin cap-gpui)
          cp "$base_bin/cap-gpui" "$bin_dir/cap-gpui-base"
          echo "head $(git rev-parse --short HEAD) app + patches vs base $(git -C "$RUNNER_TEMP/base/cap" rev-parse --short HEAD) app + patches" | tee -a "$GITHUB_STEP_SUMMARY"
          for frameworks in "$bin_dir/Frameworks" "$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/Frameworks"; do
            mkdir -p "$frameworks"
            ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$frameworks/Spacedrive.framework"
          done
          cmp -s "$GITHUB_WORKSPACE/target/native-deps/lib/libavcodec.dylib" "$RUNNER_TEMP/base/cap/target/native-deps/lib/libavcodec.dylib" \
            && echo "native deps identical on both arms" | tee -a "$GITHUB_STEP_SUMMARY" || echo "native deps differ" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the display awake
        run: |
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2

      - name: Measure
        shell: bash
        env:
          ROUNDS: '10'
        run: |
          bin_dir="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/debug"
          python3 scripts/gpui-app-bench.py \
            --base "$bin_dir/cap-gpui-base" \
            --head "$bin_dir/cap-gpui-head" \
            --fixture "$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/app-bench" \
            --rounds "$ROUNDS" \
            --label macOS \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ck-gpuibench-macos
          path: ${{ runner.temp }}/app-bench
          if-no-files-found: ignore

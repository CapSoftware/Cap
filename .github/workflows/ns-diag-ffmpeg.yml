name: ns diag ffmpeg extract
on:
  push:
    branches: [scratch/ns-diag-ffmpeg-head]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install desktop dependencies
        uses: ./.github/actions/install-desktop-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup from pwsh
        shell: pwsh
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js; if ($LASTEXITCODE -ne 0) { exit 1 }; Get-ChildItem target\ffmpeg\bin | Select-Object -First 3
      - name: Reset
        shell: bash
        run: rm -r target/ffmpeg target/ffmpeg-7.1.zip
      - name: Setup from bash
        shell: bash
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js && ls target/ffmpeg/bin | head -3
      - name: Reset again
        shell: bash
        run: rm -r target/ffmpeg target/ffmpeg-7.1.zip
      - name: Setup from cmd
        shell: cmd
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/setup.js && dir target\ffmpeg\bin

name: RC 0.6.3 real app (scratch)

# Temporary, lives only on scratch/rc-063-realapp. Runs the real GPUI app on
# CI runners against fixes merged for 0.6.3. `.github/rc-063/plan.txt` names
# the jobs a push runs. The app is built once per runner type and source
# revision and kept in the cache, so later pushes only run scenarios.
on:
  push:
    branches:
      - scratch/rc-063-realapp

permissions:
  contents: read

# Superseded runs are cancelled by hand, so a push that only changes a
# scenario does not kill a build another job is still doing.
concurrency:
  group: rc-063-realapp-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  MAIN_REVISION: 79bf7dd032fab4aed8c438935cfe5c16416a1f22
  PACKAGE_VERSION: v1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      pr_revision: ${{ steps.plan.outputs.pr_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/rc-063
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          jobs=$(sed -n 's/^jobs=//p' .github/rc-063/plan.txt)
          echo "jobs=,$jobs," >> "$GITHUB_OUTPUT"
          revision=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/fix/parakeet-q8-encoder | cut -f1)
          test -n "$revision"
          echo "pr_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "jobs: $jobs; #3908 head: $revision" | tee -a "$GITHUB_STEP_SUMMARY"

  win-main:
    name: Windows, main (items 1, 2, 3)
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',win-main,')
    runs-on: windows-2022
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/rc-063/build
        with:
          target: x86_64-pc-windows-msvc
          key: rc063-windows-2022-main-${{ env.MAIN_REVISION }}-${{ env.PACKAGE_VERSION }}

      - name: Scenario tools
        shell: bash
        run: |
          python -m pip install --quiet pillow
          choco install tesseract --no-progress -y > "$RUNNER_TEMP/choco.log" 2>&1 || tail -n 20 "$RUNNER_TEMP/choco.log"
          ls "/c/Program Files/Tesseract-OCR/tesseract.exe"

      - name: Item 1, recording metadata save (#3975)
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item1,') }}
        shell: bash
        env:
          PYTHONPATH: .github/rc-063
          RC_REC_BASE: ${{ runner.temp }}\rc1
        run: python .github/rc-063/win_meta.py rc-pkg "$RUNNER_TEMP/rc-out/item1"

      - name: Item 2, deleting the recording in progress (#3969)
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item2,') }}
        shell: bash
        env:
          PYTHONPATH: .github/rc-063
        run: |
          status=0
          python .github/rc-063/win_delete.py rc-pkg "$RUNNER_TEMP/rc-out/item2-editor-closed" editor-closed || status=1
          python .github/rc-063/win_delete.py rc-pkg "$RUNNER_TEMP/rc-out/item2-editor-open" editor-open || status=1
          exit $status

      # Hosted Windows runners have no audio endpoint, and without one the
      # editor never builds a playback audio buffer. This installs a virtual
      # output device (no sound card is emulated beyond that) after items 1
      # and 2 have run on the stock image.
      - name: Virtual audio output device
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item3,') }}
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf

      - name: Audio service
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item3,') }}
        shell: pwsh
        run: |
          Start-Service audiosrv -ErrorAction SilentlyContinue
          Get-Service audiosrv, AudioEndpointBuilder | Format-Table Name, Status
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status

      - name: Restore the long recording with audio
        id: audio
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item3,') }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rc-fix/audio
          key: rc063-win-audio-recording-${{ env.MAIN_REVISION }}-v2

      - name: Item 3, playback when the audio buffer cannot be allocated (#3971)
        id: audiorun
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item3,') }}
        shell: bash
        env:
          PYTHONPATH: .github/rc-063
        run: |
          status=0
          python .github/rc-063/win_audio.py rc-pkg "$RUNNER_TEMP/rc-out/item3" "$RUNNER_TEMP/rc-fix/audio" || status=$?
          if [[ -f "$RUNNER_TEMP/rc-fix/audio/recorded.txt" ]]; then echo "recorded=true" >> "$GITHUB_OUTPUT"; fi
          exit $status

      - name: Keep the long recording with audio
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item3,') && steps.audio.outputs.cache-hit != 'true' && steps.audiorun.outputs.recorded == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rc-fix/audio
          key: rc063-win-audio-recording-${{ env.MAIN_REVISION }}-v2

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-win-main
          path: ${{ runner.temp }}/rc-out
          retention-days: 7

  linux-main:
    name: Linux, main (item 4)
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',linux-main,')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/rc-063/build
        with:
          target: x86_64-unknown-linux-gnu
          key: rc063-blacksmith-ubuntu-2404-main-${{ env.MAIN_REVISION }}-${{ env.PACKAGE_VERSION }}

      - name: Runtime libraries
        uses: ./.github/actions/install-desktop-deps

      - name: Scenario tools
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb x11-utils xdotool xterm openbox imagemagick tesseract-ocr python3-pil fonts-dejavu-core \
            dbus pulseaudio pulseaudio-utils mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri >/dev/null
          LD_LIBRARY_PATH="$PWD/rc-pkg/libs" ldd rc-pkg/bin/cap-gpui | grep 'not found' || true

      - name: Item 4, a short recording through the same steps
        id: short
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item4-short,') }}
        env:
          PYTHONPATH: .github/rc-063
        run: bash .github/rc-063/linux_session.sh python3 .github/rc-063/linux_long.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item4-short" short 30

      - name: Restore the long recording
        id: long
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item4-long,') }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rc-out/item4-long
          key: rc063-item4-long-${{ env.MAIN_REVISION }}-v2

      - name: Item 4, a 53 minute recording past 1000 fragments (#3974)
        id: longrun
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item4-long,') && steps.short.outcome != 'failure' }}
        env:
          PYTHONPATH: .github/rc-063
          HAVE_RECORDING: ${{ steps.long.outputs.cache-hit }}
        run: |
          phase=long
          if [[ "$HAVE_RECORDING" == true && -s "$RUNNER_TEMP/rc-out/item4-long/state.json" ]]; then phase=open; fi
          status=0
          bash .github/rc-063/linux_session.sh python3 .github/rc-063/linux_long.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item4-long" "$phase" 3200 || status=$?
          if [[ -s "$RUNNER_TEMP/rc-out/item4-long/state.json" ]]; then echo "recorded=true" >> "$GITHUB_OUTPUT"; fi
          exit $status

      - name: Keep the long recording
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item4-long,') && steps.long.outputs.cache-hit != 'true' && steps.longrun.outputs.recorded == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rc-out/item4-long
          key: rc063-item4-long-${{ env.MAIN_REVISION }}-v2

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-linux-main
          path: |
            ${{ runner.temp }}/rc-out/**/*.log
            ${{ runner.temp }}/rc-out/**/*.txt
            ${{ runner.temp }}/rc-out/**/*.json
            ${{ runner.temp }}/rc-out/**/*.png
          retention-days: 7

  mac-main:
    name: macOS, main (item 2 library card)
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',mac-main,')
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/rc-063/build
        with:
          target: aarch64-apple-darwin
          key: rc063-blacksmith-macos-15-main-${{ env.MAIN_REVISION }}-v2

      # As in instant-reliability.yml: wake the display, add an audio device
      # for the start cue, and grant Screen Recording to the app and to the
      # runner processes the scenario's screenshots are taken under.
      - name: Capture permissions, display and audio device
        run: bash .github/rc-063/mac_permissions.sh "$GITHUB_WORKSPACE/rc-pkg/bin/cap-gpui"

      - name: Item 2, main window library card during a recording (#3969)
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: .github/rc-063
        run: python3 .github/rc-063/mac_library.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item2-mac"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-mac-main
          path: |
            ${{ runner.temp }}/rc-out/**/*.log
            ${{ runner.temp }}/rc-out/**/*.txt
            ${{ runner.temp }}/rc-out/**/*.png
          retention-days: 7

  clippy:
    name: Linux, clippy on the patched gpui (item 5)
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',clippy,')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Prepare GPUI dependency
        run: ./scripts/prepare-gpui-dependency.sh

      # The device-lost patch changes gpui_wgpu and gpui_linux. Clippy runs on
      # them with every Cap patch applied, then again with only the device-lost
      # patch taken back out, so what it adds is told apart from what the
      # pinned upstream revision already carries.
      - name: Clippy on the patched gpui
        working-directory: ../zed-cap
        run: |
          set +e
          out="$RUNNER_TEMP/clippy"
          patch="$GITHUB_WORKSPACE/apps/desktop-gpui/patches/zed-device-lost.patch"
          mkdir -p "$out"
          cargo +1.95.0 --version | tee "$out/toolchain.txt"
          cargo +1.95.0 clippy --version | tee -a "$out/toolchain.txt"
          echo "gpui base $(git rev-parse HEAD)" | tee -a "$out/toolchain.txt"
          git status --short > "$out/patched-files.txt"
          run_clippy() {
            cargo +1.95.0 clippy -p gpui_wgpu -p gpui_linux --all-targets --message-format=json "${@:2}" > "$out/$1.json" 2> "$out/$1.stderr"
            echo "$1: clippy exit $?" | tee -a "$out/summary.txt"
          }
          run_clippy strict
          # gpui itself stops clippy on a deny-by-default lint in a file an
          # earlier Cap patch changed. Allowing that one lint lets clippy
          # reach the two crates the device-lost patch changes.
          run_clippy patched -- -A clippy::eq_op
          run_clippy patched-deny -- -A clippy::eq_op -D warnings
          git apply --reverse --unidiff-zero "$patch"
          run_clippy base -- -A clippy::eq_op
          git apply --unidiff-zero "$patch"
          : > "$out/empty.json"
          python3 "$GITHUB_WORKSPACE/.github/rc-063/clippy_diff.py" "$out/strict.json" "$out/empty.json" | sed 's/^/strict: /' | tee -a "$out/summary.txt"
          python3 "$GITHUB_WORKSPACE/.github/rc-063/clippy_diff.py" "$out/patched.json" "$out/base.json" | tee -a "$out/summary.txt"
          new=${PIPESTATUS[0]}
          { echo '### Item 5: clippy on the patched gpui (#3979)'; echo '```'; cat "$out/toolchain.txt" "$out/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          strict=$(sed -n 's/^strict: clippy exit //p' "$out/summary.txt")
          [[ "$new" == 0 && "$strict" == 0 ]]

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-clippy
          path: ${{ runner.temp }}/clippy
          retention-days: 7

  win-pr:
    name: "Windows, PR 3908 head (item 6)"
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',win-pr,')
    runs-on: windows-2022
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.pr_revision }}

      - uses: actions/checkout@v4
        with:
          path: rc
          sparse-checkout: .github/rc-063

      - name: Build
        uses: ./rc/.github/rc-063/build
        with:
          target: x86_64-pc-windows-msvc
          key: rc063-windows-2022-pr3908-${{ needs.plan.outputs.pr_revision }}-${{ env.PACKAGE_VERSION }}

      - name: Scenario tools
        shell: bash
        run: |
          python -m pip install --quiet pillow
          choco install tesseract --no-progress -y > "$RUNNER_TEMP/choco.log" 2>&1 || tail -n 20 "$RUNNER_TEMP/choco.log"
          ls "/c/Program Files/Tesseract-OCR/tesseract.exe"
          ls rc-pkg/bin/ffmpeg.exe || choco install ffmpeg --no-progress -y >> "$RUNNER_TEMP/choco.log" 2>&1

      # Hosted Windows runners have no audio endpoint. A virtual audio cable
      # gives the app an output device, so a clip another program plays is
      # recorded as system audio. It is not a microphone or a sound card.
      - name: Virtual audio output device
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf

      - name: Audio service
        shell: pwsh
        run: |
          Start-Service audiosrv -ErrorAction SilentlyContinue
          Get-Service audiosrv, AudioEndpointBuilder | Format-Table Name, Status
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status

      - name: Restore the old-layout Recommended model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rc-models/old
          key: rc063-parakeet-old-layout-v1
          enableCrossOsArchive: true

      - name: Model files and the fixture clip
        shell: bash
        run: |
          ffmpeg=rc-pkg/bin/ffmpeg.exe
          [[ -f $ffmpeg ]] || ffmpeg=ffmpeg
          bash rc/.github/rc-063/model_setup.sh "$RUNNER_TEMP/rc-models" \
            apps/desktop-gpui/tests/data/transcription/audio/splice-13-am_fenrir.ogg "$ffmpeg"
          echo "RC_NOTE_DESCRIPTION=$(sed -n 's/^model_updated_description = "\(.*\)"$/\1/p' apps/desktop-gpui/locales/en.toml)" >> "$GITHUB_ENV"
          git log -1 --format='PR head %H %s'

      - name: Item 6, old layout, update note, download, Generate
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item6-old,') }}
        shell: bash
        env:
          PYTHONPATH: rc/.github/rc-063
          RC_PROJECT_DIR: ${{ runner.temp }}\rc-fix\clip
          RC_OLD_MODEL: ${{ runner.temp }}\rc-models\old
        run: |
          python rc/.github/rc-063/model.py rc-pkg "$RUNNER_TEMP/rc-out/item6-old" old "$RUNNER_TEMP/rc-models/clip.wav" \
            "The new editor has, er, a lot of, you know, small improvements."

      - name: Item 6, fresh install, download, Generate
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item6-fresh,') }}
        shell: bash
        env:
          PYTHONPATH: rc/.github/rc-063
          RC_PROJECT_DIR: ${{ runner.temp }}\rc-fix\clip
        run: |
          python rc/.github/rc-063/model.py rc-pkg "$RUNNER_TEMP/rc-out/item6-fresh" fresh "$RUNNER_TEMP/rc-models/clip.wav" \
            "The new editor has, er, a lot of, you know, small improvements."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-win-pr
          path: |
            ${{ runner.temp }}/rc-out/**/*.log
            ${{ runner.temp }}/rc-out/**/*.txt
            ${{ runner.temp }}/rc-out/**/*.json
            ${{ runner.temp }}/rc-out/**/*.png
            ${{ runner.temp }}/rc-fix/clip/**/*.m4a
            ${{ runner.temp }}/rc-fix/clip/**/*.ogg
            ${{ runner.temp }}/rc-fix/clip/**/recording-meta.json
            !${{ runner.temp }}/rc-out/**/data-home/**
          retention-days: 7

  linux-pr:
    name: "Linux, PR 3908 head (item 6)"
    needs: plan
    if: contains(needs.plan.outputs.jobs, ',linux-pr,')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.pr_revision }}

      - uses: actions/checkout@v4
        with:
          path: rc
          sparse-checkout: .github/rc-063

      - name: Build
        uses: ./rc/.github/rc-063/build
        with:
          target: x86_64-unknown-linux-gnu
          key: rc063-blacksmith-ubuntu-2404-pr3908-${{ needs.plan.outputs.pr_revision }}-${{ env.PACKAGE_VERSION }}

      - name: Runtime libraries
        uses: ./.github/actions/install-desktop-deps

      - name: Scenario tools
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb x11-utils xdotool xterm openbox imagemagick tesseract-ocr python3-pil fonts-dejavu-core \
            dbus pulseaudio pulseaudio-utils mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri ffmpeg >/dev/null
          LD_LIBRARY_PATH="$PWD/rc-pkg/libs" ldd rc-pkg/bin/cap-gpui | grep 'not found' || true

      - name: Restore the old-layout Recommended model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rc-models/old
          key: rc063-parakeet-old-layout-v1

      - name: Restore the High Accuracy model
        if: ${{ contains(needs.plan.outputs.jobs, ',item6-full,') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rc-models/full
          key: rc063-parakeet-high-accuracy-v1

      - name: Model files and the fixture clip
        env:
          WANT_FULL: ${{ contains(needs.plan.outputs.jobs, ',item6-full,') && 'full' || '' }}
        run: |
          bash rc/.github/rc-063/model_setup.sh "$RUNNER_TEMP/rc-models" \
            apps/desktop-gpui/tests/data/transcription/audio/splice-13-am_fenrir.ogg ffmpeg $WANT_FULL
          echo "RC_NOTE_DESCRIPTION=$(sed -n 's/^model_updated_description = "\(.*\)"$/\1/p' apps/desktop-gpui/locales/en.toml)" >> "$GITHUB_ENV"
          git log -1 --format='PR head %H %s'

      - name: Item 6, old layout, update note, download, Generate
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item6-old,') }}
        env:
          PYTHONPATH: rc/.github/rc-063
          RC_PROJECT_DIR: ${{ runner.temp }}/rc-fix/clip
          RC_OLD_MODEL: ${{ runner.temp }}/rc-models/old
        run: |
          bash rc/.github/rc-063/linux_session.sh python3 rc/.github/rc-063/model.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item6-old" old \
            "$RUNNER_TEMP/rc-models/clip.wav" "The new editor has, er, a lot of, you know, small improvements."

      - name: Item 6, fresh install, download, Generate
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item6-fresh,') }}
        env:
          PYTHONPATH: rc/.github/rc-063
          RC_PROJECT_DIR: ${{ runner.temp }}/rc-fix/clip
        run: |
          bash rc/.github/rc-063/linux_session.sh python3 rc/.github/rc-063/model.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item6-fresh" fresh \
            "$RUNNER_TEMP/rc-models/clip.wav" "The new editor has, er, a lot of, you know, small improvements."

      - name: Item 6, High Accuracy, Generate
        if: ${{ !cancelled() && contains(needs.plan.outputs.jobs, ',item6-full,') }}
        env:
          PYTHONPATH: rc/.github/rc-063
          RC_PROJECT_DIR: ${{ runner.temp }}/rc-fix/clip
          RC_FULL_MODEL: ${{ runner.temp }}/rc-models/full
        run: |
          bash rc/.github/rc-063/linux_session.sh python3 rc/.github/rc-063/model.py "$PWD/rc-pkg" "$RUNNER_TEMP/rc-out/item6-full" full \
            "$RUNNER_TEMP/rc-models/clip.wav" "The new editor has, er, a lot of, you know, small improvements."

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc063-linux-pr
          path: |
            ${{ runner.temp }}/rc-out/**/*.log
            ${{ runner.temp }}/rc-out/**/*.txt
            ${{ runner.temp }}/rc-out/**/*.json
            ${{ runner.temp }}/rc-out/**/*.png
            ${{ runner.temp }}/rc-fix/clip/**/*.m4a
            ${{ runner.temp }}/rc-fix/clip/**/*.ogg
            ${{ runner.temp }}/rc-fix/clip/**/recording-meta.json
            !${{ runner.temp }}/rc-out/**/data-home/**
          retention-days: 7

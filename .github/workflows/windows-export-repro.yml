name: Windows export crash repro

# Runs the camera blur and captions export cases one at a time on Windows with
# Windows Error Reporting writing full dumps, then prints each crash's stack.

on:
  push:
    branches: [ci/windows-export-blur-captions]
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated test names in cap-verify's export test"
        type: string
        default: "camera_blur_export captions_export camera_blur_and_captions_export"

jobs:
  repro:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-pc-windows-msvc
          tier: fast

      - name: Build
        shell: bash
        run: cargo test --profile ci-verify -p cap-verify --test export --no-run

      - name: Crash dumps
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP dumps
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Force $key | Out-Null
          Set-ItemProperty $key DumpFolder $dumps
          Set-ItemProperty $key DumpType 2 -Type DWord
          Set-ItemProperty $key DumpCount 10 -Type DWord
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' DontShowUI 1 -Type DWord

      - name: Run cases under cdb
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) { winget install --id Microsoft.WindowsSDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements | Out-Null }
          $exe = Get-ChildItem target\ci-verify\deps\export-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $symbols = "srv*$env:RUNNER_TEMP\symcache*https://msdl.microsoft.com/download/symbols;$($exe.DirectoryName)"
          $tests = "${{ inputs.tests || 'camera_blur_ffmpeg_once_export camera_blur_twice_default_export camera_blur_twice_ffmpeg_export captions_export' }}".Split(' ')
          foreach ($test in $tests) {
            Write-Output "::group::$test"
            $log = Join-Path $env:RUNNER_TEMP "dumps\cdb-$test.log"
            & $cdb -g -G -lines -y $symbols -c "sxd av; sxd -c `"`" eh; g; .echo CRASH_STACK; .lastevent; .ecxr; kn 80; .echo END_CRASH_STACK; ~*kn 25; q" $exe.FullName $test --exact --nocapture --test-threads=1 *> $log
            $lines = Get-Content $log
            $lines | Select-String -Pattern 'test result|panicked|^test |Last event|exit code' | ForEach-Object { $_.Line }
            $start = ($lines | Select-String -Pattern 'CRASH_STACK' | Select-Object -First 1).LineNumber
            $end = ($lines | Select-String -Pattern 'END_CRASH_STACK' | Select-Object -First 1).LineNumber
            if ($start -and $end) { $lines[($start - 1)..($end - 1)] }
            Write-Output "::endgroup::"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-export-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
          retention-days: 3

name: scratch avfilter exit crash

on:
  push:
    branches: [scratch/avfilter-exit-crash]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-8vcpu-windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scratch-avfilter-exit

      - name: Keep crash dumps
        run: |
          foreach ($exe in @("cap-gpui.exe", "cap-cli.exe")) {
            $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\loopdumps" -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -Value 1000 -PropertyType DWord -Force | Out-Null
          }
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
          Start-Service WerSvc

      - name: Binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest "https://cdn.crabnebula.app/download/cap/cap/latest/platform/nsis-x86_64" -OutFile "$env:RUNNER_TEMP\cap-setup.exe"
          & 7z x -y "-o$env:RUNNER_TEMP\cap" "$env:RUNNER_TEMP\cap-setup.exe" | Out-Null
          gh api repos/${{ github.repository }}/actions/artifacts/14358936506/zip > "$env:RUNNER_TEMP\gpui.zip"
          & 7z x -y "-o$env:RUNNER_TEMP\cap" "$env:RUNNER_TEMP\gpui.zip" cap-gpui.exe | Out-Null
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.zip" -OutFile "$env:RUNNER_TEMP\ff.zip"
          Expand-Archive "$env:RUNNER_TEMP\ff.zip" -DestinationPath "$env:RUNNER_TEMP\ff"
          Get-FileHash "$env:RUNNER_TEMP\cap\avfilter-10.dll", "$env:RUNNER_TEMP\ff\ffmpeg-7.1-full_build-shared\bin\avfilter-10.dll" | Format-Table -AutoSize
          $proj = "$env:RUNNER_TEMP\project.cap"
          New-Item -ItemType Directory -Force $proj | Out-Null
          & "$env:RUNNER_TEMP\ff\ffmpeg-7.1-full_build-shared\bin\ffmpeg.exe" -v error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=2" -f lavfi -i "sine=frequency=440:duration=2" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest "$proj\display.mp4"
          '{"pretty_name":"Exit crash probe","display":{"path":"display.mp4","fps":30}}' | Set-Content -Encoding ascii "$proj\recording-meta.json"
          & "$env:RUNNER_TEMP\cap\cap-cli.exe" export $proj -o "$env:RUNNER_TEMP\probe.mp4" --force-ffmpeg-decoder
          "probe export exit $LASTEXITCODE"
          Get-Item "$env:RUNNER_TEMP\probe.mp4" -ErrorAction SilentlyContinue | Format-List Length

      - name: Count crashes (product processes)
        run: |
          "| runner | process | runs | exit code (and self-test verdict) counts | time |" | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|" | Add-Content $env:GITHUB_STEP_SUMMARY
          $loop = "$env:GITHUB_WORKSPACE\scripts\scratch-avfilter-exit\productloop.ps1"
          $cap = "$env:RUNNER_TEMP\cap"
          $mf = '{"codec":"h264_mf","options":[],"pixel_format":"nv12","width":1920,"height":1080,"time_base":[1,30],"frame_rate":[30,1],"output_width":1920,"output_height":1080,"bpp":0.1,"crf":null}'
          $x264 = '{"codec":"libx264","options":[],"pixel_format":"nv12","width":1920,"height":1080,"time_base":[1,30],"frame_rate":[30,1],"output_width":1920,"output_height":1080,"bpp":0.1,"crf":null}'
          & $loop "$cap\cap-gpui.exe" "" 300 "cap-gpui.exe (main build) h264_mf self-test child" $mf
          & $loop "$cap\cap-gpui.exe" "" 300 "cap-gpui.exe (main build) libx264 self-test child (not a product path)" $x264
          $proj = "$env:RUNNER_TEMP\project.cap"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          & $loop "$cap\cap-cli.exe" "export `"$proj`" -o `"$env:RUNNER_TEMP\out\o{i}.mp4`" --force-ffmpeg-decoder" 150 "cap-cli.exe 0.6.3 export --force-ffmpeg-decoder (2 s 720p)"
          & $loop "$cap\cap-cli.exe" "export `"$proj`" -o `"$env:RUNNER_TEMP\out\p{i}.mp4`"" 150 "cap-cli.exe 0.6.3 export (2 s 720p)"

      - name: Dump stacks
        if: always()
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "no cdb"; exit 0 }
          $sym = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          foreach ($d in Get-ChildItem "$env:RUNNER_TEMP\keep" -Filter *.dmp -ErrorAction SilentlyContinue) {
            "=== $($d.Name)"
            & $cdb -z $d.FullName -y $sym -c ".ecxr; r rax,rip; kn 22; !gle; q" 2>&1 | Select-String "^\s*[0-9a-f]{2} [0-9a-f]{8}|code [0-9a-f]{8}|LastStatusValue|rax=" | Select-Object -First 30
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/results.md
          if-no-files-found: ignore

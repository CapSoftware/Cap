name: scratch avfilter exit crash

on:
  push:
    branches: [scratch/avfilter-exit-crash]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-8vcpu-windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scratch-avfilter-exit

      - name: Keep crash dumps
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ffexit.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\loopdumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 1000 -PropertyType DWord -Force | Out-Null
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
          Start-Service WerSvc

      - name: FFmpeg 7.1 and input
        run: |
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.zip" -OutFile "$env:RUNNER_TEMP\ff.zip"
          Expand-Archive "$env:RUNNER_TEMP\ff.zip" -DestinationPath "$env:RUNNER_TEMP"
          $ff = "$env:RUNNER_TEMP\ffmpeg-7.1-full_build-shared"
          & "$ff\bin\ffmpeg.exe" -v error -f lavfi -i "testsrc2=size=1920x1080:rate=30:duration=3" -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$env:RUNNER_TEMP\in.mp4"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $src = "$env:GITHUB_WORKSPACE\scripts\scratch-avfilter-exit\ffexit.c"
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /O2 /I`"$ff\include`" /Fe:$ff\bin\ffexit.exe $src /link /LIBPATH:`"$ff\lib`" avformat.lib avcodec.lib avfilter.lib avutil.lib"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Count crashes (FFmpeg decoders running at exit)
        run: |
          "| runner | program | decoder threads | exit | runs | crashed | rate | exit codes | time |" | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|---|---|" | Add-Content $env:GITHUB_STEP_SUMMARY
          $loop = "$env:GITHUB_WORKSPACE\scripts\scratch-avfilter-exit\ffloop.ps1"
          $exe = "$env:RUNNER_TEMP\ffmpeg-7.1-full_build-shared\bin\ffexit.exe"
          $in = "$env:RUNNER_TEMP\in.mp4"
          & $loop $exe $in 0 return 150 300 "ffexit 7.1"
          & $loop $exe $in 4 return 150 300 "ffexit 7.1"
          & $loop $exe $in 4 join 150 300 "ffexit 7.1"
          & $loop $exe $in 4 terminate 150 300 "ffexit 7.1"

      - name: Dump stacks
        if: always()
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { "no cdb"; exit 0 }
          $sym = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          foreach ($d in Get-ChildItem "$env:RUNNER_TEMP\keep" -Filter *.dmp -ErrorAction SilentlyContinue) {
            "=== $($d.Name)"
            & $cdb -z $d.FullName -y $sym -c ".ecxr; r rax,rip; kn 22; !gle; q" 2>&1 | Select-String "^\s*[0-9a-f]{2} [0-9a-f]{8}|code [0-9a-f]{8}|LastStatusValue|rax=" | Select-Object -First 30
          }

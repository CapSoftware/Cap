name: Scratch stop-time A/B

on:
  push:
    branches: ["ci/stoptime-ab", "ci/stoptime-ab-mac"]

concurrency:
  group: scratch-stoptime-ab-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: ./.github/actions/install-desktop-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
        run: node scripts/setup.js
      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Build fix and base
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bins/fix" "$RUNNER_TEMP/bins/base"
          cargo build --locked --release -p cap --bin cap
          cp target/release/cap "$RUNNER_TEMP/bins/fix/cap"
          git checkout -q "$(cat ci-stoptime/base.txt)"
          cargo build --locked --release -p cap --bin cap
          cp target/release/cap "$RUNNER_TEMP/bins/base/cap"
          git checkout -q -
          FW=$(find target -maxdepth 3 -type d -name Spacedrive.framework | head -1)
          echo "framework: $FW"
          mkdir -p "$RUNNER_TEMP/bins/Frameworks"
          cp -R "$FW" "$RUNNER_TEMP/bins/Frameworks/"
          "$RUNNER_TEMP/bins/base/cap" --version || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stimulus deps
        run: python3 -m pip install pygame psutil av
      - name: Screens
        run: |
          "$RUNNER_TEMP/bins/base/cap" targets screens --format json
      - name: A/B 20 s
        run: |
          S=$("$RUNNER_TEMP/bins/base/cap" targets screens --format json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          python3 ci-stoptime/run.py --stim ci-stoptime/stim.py --screen "$S" --out "$RUNNER_TEMP/ab20" --dur 20 --reps 12 --keep \
            --arm "base=$RUNNER_TEMP/bins/base/cap" --arm "fix=$RUNNER_TEMP/bins/fix/cap"
      - name: A/B 60 s
        run: |
          S=$("$RUNNER_TEMP/bins/base/cap" targets screens --format json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          python3 ci-stoptime/run.py --stim ci-stoptime/stim.py --screen "$S" --out "$RUNNER_TEMP/ab60" --dur 60 --reps 3 --keep \
            --arm "base=$RUNNER_TEMP/bins/base/cap" --arm "fix=$RUNNER_TEMP/bins/fix/cap"
      - name: Files
        if: always()
        run: python3 ci-stoptime/files.py "$RUNNER_TEMP/ab20" "$RUNNER_TEMP/ab60" || true
      - name: Open bench
        if: always()
        run: python3 ci-stoptime/openbench.py "$RUNNER_TEMP/ab20" "$RUNNER_TEMP/ab60" | tee "$RUNNER_TEMP/openbench.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stoptime-macos
          path: |
            ${{ runner.temp }}/ab20/results.jsonl
            ${{ runner.temp }}/ab60/results.jsonl
            ${{ runner.temp }}/ab*/*/stderr.log
            ${{ runner.temp }}/files.txt
            ${{ runner.temp }}/openbench.txt

  windows:
    if: github.ref_name == 'ci/stoptime-ab'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-pc-windows-msvc
          tier: fast
      - name: Build fix and base
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bins/fix" "$RUNNER_TEMP/bins/base"
          cargo build --locked --release -p cap --bin cap
          cp target/release/cap.exe "$RUNNER_TEMP/bins/fix/cap.exe"
          git checkout -q "$(cat ci-stoptime/base.txt)"
          cargo build --locked --release -p cap --bin cap
          cp target/release/cap.exe "$RUNNER_TEMP/bins/base/cap.exe"
          git checkout -q -
      - name: Stimulus deps
        shell: bash
        run: python -m pip install pygame psutil av
      - name: A/B 20 s
        shell: bash
        run: |
          S=$("$RUNNER_TEMP/bins/base/cap.exe" targets screens --format json | python -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          python ci-stoptime/run.py --stim ci-stoptime/stim.py --screen "$S" --out "$RUNNER_TEMP/ab20" --dur 20 --reps 6 --keep \
            --arm "base=$RUNNER_TEMP/bins/base/cap.exe" --arm "fix=$RUNNER_TEMP/bins/fix/cap.exe"
      - name: A/B 60 s
        shell: bash
        run: |
          S=$("$RUNNER_TEMP/bins/base/cap.exe" targets screens --format json | python -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          python ci-stoptime/run.py --stim ci-stoptime/stim.py --screen "$S" --out "$RUNNER_TEMP/ab60" --dur 60 --reps 3 --keep \
            --arm "base=$RUNNER_TEMP/bins/base/cap.exe" --arm "fix=$RUNNER_TEMP/bins/fix/cap.exe"
      - name: Files
        if: always()
        shell: bash
        run: python ci-stoptime/files.py "$RUNNER_TEMP/ab20" "$RUNNER_TEMP/ab60" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stoptime-windows
          path: |
            ${{ runner.temp }}/ab20/results.jsonl
            ${{ runner.temp }}/ab60/results.jsonl
            ${{ runner.temp }}/ab*/*/stderr.log
            ${{ runner.temp }}/files.txt

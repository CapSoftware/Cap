name: Studio Sound music investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CAP_VERIFY_TIER: fast
      SSMUSIC_ARTIFACTS: ${{ runner.temp }}/ssmusic
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ matrix.target }}
          tier: fast
      - run: cargo fmt --all --check
      - run: cargo check --profile ci-verify -p cap-verify --test ssmusic
      - run: cargo test --profile ci-verify -p cap-verify --test ssmusic -- --nocapture > "$RUNNER_TEMP/ssmusic-test.log" 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssmusic-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/ssmusic
            ${{ runner.temp }}/ssmusic-test.log

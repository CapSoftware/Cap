name: Verify fragment durability design
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [blacksmith, vt]
        default: blacksmith
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner == 'vt' && 'macos-15' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      FRAGMENT_PROBE_BENCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ inputs.runner == 'vt' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
          tier: full
      - name: Decoder CLI
        shell: bash
        run: |
          echo "FRAGMENT_PROBE_OUT=$RUNNER_TEMP/fragment-probe" >> "$GITHUB_ENV"
          if ! command -v ffmpeg >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get install -y -qq ffmpeg
            else
              brew install ffmpeg
            fi
          fi
      - name: Compile diagnostic only
        run: |
          rustup component add rustfmt
          cargo fmt --all --check
          cargo check --locked -p cap-enc-ffmpeg --example sol-fragment-proof
          cargo build --locked --profile ci-verify -p cap-enc-ffmpeg --example sol-fragment-proof
      - name: Preserve encoder packets and probe muxer policies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p target/ci-verify/Frameworks
            cp -R target/Frameworks/Spacedrive.framework target/ci-verify/Frameworks/
          fi
          codec=libx264
          if [ '${{ inputs.runner }}' = vt ]; then codec=h264_videotoolbox; fi
          mkdir -p "$FRAGMENT_PROBE_OUT"
          target/ci-verify/examples/sol-fragment-proof "$FRAGMENT_PROBE_OUT" "$codec" > "$FRAGMENT_PROBE_OUT/probe.log" 2>&1
          python3 scripts/verify/fragment-probe.py
      - name: Upload design evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fragment-design-${{ inputs.runner }}
          path: ${{ runner.temp }}/fragment-probe
          if-no-files-found: warn
          retention-days: 14

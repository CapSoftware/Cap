name: Verify timed Studio fragments

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Empty runs the full engine matrix"
        type: string
        default: ""
      tier:
        description: Tier
        type: choice
        options: [fast, full]
        default: full

permissions:
  contents: read

jobs:
  verify:
    if: inputs.suites != 'payload' && inputs.suites != 'payload-vt' && inputs.suites != 'perf-build' && inputs.suites != 'vt-crash' && inputs.suites != 'instant-repeat'
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - platform: linux
            runner: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/engine-verify-os.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      tier: ${{ inputs.tier || 'full' }}
      suites: ${{ inputs.suites }}

  payload:
    if: inputs.suites == 'payload' || inputs.suites == 'payload-vt'
    runs-on: ${{ inputs.suites == 'payload-vt' && 'macos-15' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ inputs.suites == 'payload-vt' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
          tier: full
      - name: Prepare decoder
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq ffmpeg exfatprogs
          elif ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
      - name: Validate and build
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo check --locked -p cap-verify --test crash
          cargo clippy --locked --no-deps -p cap-enc-ffmpeg -p cap-recording --lib -- -D warnings
          cargo clippy --locked --no-deps -p cap-recording --example timed-fragment-proof -- -D warnings
          cargo test --locked --profile ci-verify -p cap-enc-ffmpeg --lib
          cargo test --locked --profile ci-verify -p cap-recording --lib timed_fragment_tests
          cargo build --locked --profile ci-verify -p cap-recording --example timed-fragment-proof
      - name: Verify prefix publication on exFAT
        if: runner.os == 'Linux'
        shell: bash
        run: |
          volume="$RUNNER_TEMP/timed-fragment-exfat"
          image="$RUNNER_TEMP/timed-fragment-exfat.img"
          mkdir -p "$volume"
          truncate -s 64M "$image"
          mkfs.exfat "$image"
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$image" "$volume"
          trap 'sudo umount "$volume"' EXIT
          printf source > "$volume/link-source"
          if ln "$volume/link-source" "$volume/link-destination"; then
            echo "::error::exFAT unexpectedly allowed hard links"
            exit 1
          fi
          TMPDIR="$volume" cargo test --locked --profile ci-verify -p cap-recording --lib recovery::prefix
          TMPDIR="$volume" cargo test --locked --profile ci-verify -p cap-recording --lib timed_fragment_tests
      - name: Run production writer and recovery
        run: |
          mkdir -p "$RUNNER_TEMP/timed-fragments"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p target/ci-verify/Frameworks
            cp -R target/Frameworks/Spacedrive.framework target/ci-verify/Frameworks/
          fi
          target/ci-verify/examples/timed-fragment-proof "$RUNNER_TEMP/timed-fragments" > "$RUNNER_TEMP/timed-fragments/run.log" 2>&1
          python3 scripts/verify/timed-fragment-proof.py "$RUNNER_TEMP/timed-fragments" > "$RUNNER_TEMP/timed-fragments/summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-timed-fragments
          path: ${{ runner.temp }}/timed-fragments
          retention-days: 7

  perf-build:
    if: inputs.suites == 'perf-build'
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: control
            ref: ci/proof-timedfrag-base
          - arm: candidate
            ref: ci/proof-timedfrag
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: full
      - name: Build optimized recording benchmark
        shell: bash
        run: |
          cargo test --locked -p cap-verify --test crash --no-run --profile perf --config 'profile.perf.inherits="release"' --config 'profile.perf.lto=false' --config 'profile.perf.debug=0' --config 'profile.perf.codegen-units=16' --message-format=json > "$RUNNER_TEMP/build.jsonl"
          mkdir -p "$RUNNER_TEMP/perf-package/${{ matrix.arm }}" "$RUNNER_TEMP/perf-package/Frameworks"
          python3 - "$RUNNER_TEMP/build.jsonl" "$RUNNER_TEMP/perf-package/${{ matrix.arm }}/crash" <<'PYTHON'
          import json, shutil, sys
          for line in open(sys.argv[1]):
              row = json.loads(line)
              if row.get("reason") == "compiler-artifact" and row.get("executable") and row["target"]["name"] == "crash":
                  shutil.copy2(row["executable"], sys.argv[2])
          PYTHON
          cp -R target/Frameworks/Spacedrive.framework "$RUNNER_TEMP/perf-package/Frameworks/"
          git rev-parse HEAD > "$RUNNER_TEMP/perf-package/${{ matrix.arm }}/head.txt"
          tar -czf "$RUNNER_TEMP/perf-${{ matrix.arm }}.tgz" -C "$RUNNER_TEMP/perf-package" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timed-fragment-perf-${{ matrix.arm }}
          path: ${{ runner.temp }}/perf-${{ matrix.arm }}.tgz
          retention-days: 7

  vt-crash:
    if: inputs.suites == 'vt-crash'
    uses: ./.github/workflows/engine-verify-os.yml
    with:
      platform: macos
      runner: macos-15
      target: aarch64-apple-darwin
      tier: full
      suites: crash

  instant-repeat:
    if: inputs.suites == 'instant-repeat'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: control
            ref: ci/proof-timedfrag-base
          - arm: candidate
            ref: ci/proof-timedfrag
    env:
      CARGO_INCREMENTAL: "0"
      CAP_VERIFY_HOST: blacksmith
      CAP_VERIFY_TIER: full
      CAP_VERIFY_CASE: export/instant-gated-mic-only/output/mp4/native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-unknown-linux-gnu
          tier: full
      - name: Build focused fixture probe
        run: cargo test --locked --profile ci-verify -p cap-verify --test export --no-run
      - name: Three fresh gate phase samples
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/instant-repeat"
          git rev-parse HEAD > "$RUNNER_TEMP/instant-repeat/head.txt"
          result=0
          for repeat in 1 2 3; do
            mkdir -p "$RUNNER_TEMP/instant-repeat/$repeat"
            CAP_VERIFY_FIXTURE_DIR="$RUNNER_TEMP/instant-fixtures-$repeat" CAP_VERIFY_REPORT_DIR="$RUNNER_TEMP/instant-repeat/$repeat" cargo test --locked --profile ci-verify -p cap-verify --test export instant_output -- --nocapture --test-threads=1 > "$RUNNER_TEMP/instant-repeat/$repeat/run.log" 2>&1 || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instant-phase-${{ matrix.arm }}
          path: ${{ runner.temp }}/instant-repeat
          retention-days: 7

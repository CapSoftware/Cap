name: Verify timed Studio fragments

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Empty runs the full engine matrix"
        type: string
        default: ""
      tier:
        description: Tier
        type: choice
        options: [fast, full]
        default: full

permissions:
  contents: read

jobs:
  verify:
    if: inputs.suites != 'payload' && inputs.suites != 'perf-build'
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - platform: linux
            runner: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - platform: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/engine-verify-os.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      tier: ${{ inputs.tier || 'full' }}
      suites: ${{ inputs.suites }}

  payload:
    if: inputs.suites == 'payload'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-unknown-linux-gnu
          tier: full
      - name: Prepare decoder
        run: sudo apt-get install -y -qq ffmpeg
      - name: Validate and build
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --locked --no-deps -p cap-enc-ffmpeg -p cap-recording --all-targets -- -D warnings
          cargo test --locked --profile ci-verify -p cap-enc-ffmpeg --lib
          cargo test --locked --profile ci-verify -p cap-recording --lib timed_fragment_tests
          cargo build --locked --profile ci-verify -p cap-recording --example timed-fragment-proof
      - name: Run production writer and recovery
        run: |
          mkdir -p "$RUNNER_TEMP/timed-fragments"
          target/ci-verify/examples/timed-fragment-proof "$RUNNER_TEMP/timed-fragments" > "$RUNNER_TEMP/timed-fragments/run.log" 2>&1
          python3 scripts/verify/timed-fragment-proof.py "$RUNNER_TEMP/timed-fragments" > "$RUNNER_TEMP/timed-fragments/summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-timed-fragments
          path: ${{ runner.temp }}/timed-fragments
          retention-days: 7

  perf-build:
    if: inputs.suites == 'perf-build'
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: control
            ref: ci/proof-timedfrag-base
          - arm: candidate
            ref: ci/proof-timedfrag
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: full
      - name: Build optimized recording benchmark
        shell: bash
        run: |
          cargo test --locked -p cap-verify --test crash --no-run --profile perf --config 'profile.perf.inherits="release"' --config 'profile.perf.lto=false' --config 'profile.perf.debug=0' --config 'profile.perf.codegen-units=16' --message-format=json > "$RUNNER_TEMP/build.jsonl"
          mkdir -p "$RUNNER_TEMP/perf-package/${{ matrix.arm }}" "$RUNNER_TEMP/perf-package/Frameworks"
          python3 - "$RUNNER_TEMP/build.jsonl" "$RUNNER_TEMP/perf-package/${{ matrix.arm }}/crash" <<'PYTHON'
          import json, shutil, sys
          for line in open(sys.argv[1]):
              row = json.loads(line)
              if row.get("reason") == "compiler-artifact" and row.get("executable") and row["target"]["name"] == "crash":
                  shutil.copy2(row["executable"], sys.argv[2])
          PYTHON
          cp -R target/Frameworks/Spacedrive.framework "$RUNNER_TEMP/perf-package/Frameworks/"
          git rev-parse HEAD > "$RUNNER_TEMP/perf-package/${{ matrix.arm }}/head.txt"
          tar -czf "$RUNNER_TEMP/perf-${{ matrix.arm }}.tgz" -C "$RUNNER_TEMP/perf-package" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timed-fragment-perf-${{ matrix.arm }}
          path: ${{ runner.temp }}/perf-${{ matrix.arm }}.tgz
          retention-days: 7

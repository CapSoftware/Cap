name: Instant audio overlap probe (scratch)

on:
  push:
    branches: [ci/fixproof-audio-overlap, scratch/fixproof-audio-overlap-base]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CAP_VERIFY_CARGO_PROFILE: ci-verify
  CAP_VERIFY_LOCKED: "1"

jobs:
  probe:
    name: probe ${{ matrix.runner }} ${{ matrix.copy }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, copy: wb, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, copy: wc, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, copy: wd, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, copy: we, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, copy: wf, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: windows-2022, copy: wg, gens: 5, target: x86_64-pc-windows-msvc }
          - { runner: macos-15, copy: ma, gens: 10, target: aarch64-apple-darwin }
          - { runner: macos-15, copy: mb, gens: 10, target: aarch64-apple-darwin }
          - { runner: macos-26, copy: mc, gens: 10, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ matrix.target }}
          tier: fast
      - name: Build
        shell: bash
        run: scripts/verify/run.sh fast --suites export --no-run
      - name: Fresh Instant fixtures, one process per variant
        shell: bash
        env:
          CAP_VERIFY_TIER: fast
          CAP_VERIFY_LOG: cap_recording::output_pipeline=debug
          GENS: ${{ matrix.gens }}
        run: |
          set +e
          PY=$(command -v python3 || command -v python)
          mkdir -p "$RUNNER_TEMP/probe/reports" "$RUNNER_TEMP/probe/fixtures"
          variants="instant instant-ungated-mic-late instant-ungated-system-loopback instant-ungated-system-continuous-mic-late instant-gated-system-only instant-gated-system-continuous-mic-late instant-gated-mic-only"
          for i in $(seq 1 "$GENS"); do
            for v in $variants; do
              export CAP_VERIFY_CASE="export/$v/output/mp4/native"
              export CAP_VERIFY_FIXTURE_DIR="$RUNNER_TEMP/probe/fixtures/fx-$i"
              export CAP_VERIFY_REPORT_DIR="$RUNNER_TEMP/probe/reports/report-$i-$v"
              log="$RUNNER_TEMP/probe/reports/log-$i-$v.txt"
              cargo nextest run --cargo-profile ci-verify --locked -p cap-verify --test export --no-fail-fast --no-capture \
                -E 'binary_id(cap-verify::export) and test(=instant_output)' > "$log" 2>&1
              code=$?
              trims=$(grep -c "Trimmed overlapping audio frame" "$log")
              drops=$(grep -c "Dropping overlapping audio frame" "$log")
              gaps=$(grep -c "Audio gap detected, inserting silence" "$log")
              echo "OVERLAP gen=$i variant=$v exit=$code trims=$trims drops=$drops gap_logs=$gaps"
              grep -h "overlapping audio frame" "$log" | sed -E 's/\x1b\[[0-9;]*m//g' | grep -oE "frame_count=[0-9]+ overlap_ms=[0-9]+ frame_samples=[0-9]+ trim_samples=[0-9]+" | sed "s/^/OVERLAP_EVENT gen=$i variant=$v /" | head -20
              cat "$CAP_VERIFY_REPORT_DIR"/*.jsonl 2>/dev/null | "$PY" -c '
          import sys, json
          for l in sys.stdin:
              if "\"case\"" not in l: continue
              r = json.loads(l)
              print("PROBE", r["outcome"], r["case"], sorted(r["failures"]), "|", "; ".join(r.get("notes", [])))'
            done
          done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: aoverlap-probe-reports-${{ matrix.runner }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/probe/reports
          retention-days: 7

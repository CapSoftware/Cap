name: Linux export crash stress

on:
  push:
    branches:
      - "ci-stress/**"

permissions:
  contents: read

jobs:
  stress:
    name: Export stress (${{ matrix.gpui }}, shard ${{ matrix.shard }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gpui: [perf-no-wgpu-debug]
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu

      - name: Drop the perf patch
        if: matrix.gpui == 'main'
        run: |
          sed -i '/zed-perf.patch/d' scripts/prepare-gpui-dependency.sh
          ! grep -q zed-perf scripts/prepare-gpui-dependency.sh

      - name: Prepare GPUI dependency
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh

      - name: Build cap-gpui
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui --config 'profile.dev.package.wgpu-types.debug-assertions=false'

      - name: Fetch the Cap package for desktop integration
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/cap.deb" https://cdn.crabnebula.app/asset/01M5CHFS77QM2HSZ69KT784SAV
          echo "bb03dddc5268f64d3e6eb4c11534462e5b7a8a5c1c7bb5bca5f5bdaa99d11c56  $RUNNER_TEMP/cap.deb" | sha256sum --check

      - name: Harness image with gdb
        run: |
          docker build -q -f scripts/linux-desktop-harness/gnome.Dockerfile -t cap-harness-gnome scripts/linux-desktop-harness
          printf 'FROM cap-harness-gnome\nRUN apt-get update && apt-get install -y --no-install-recommends gdb debuginfod && apt-get clean\n' |
            docker build -q -t cap-harness-gnome-gdb -
          sudo sysctl -w kernel.core_pattern=/out/cores/core.%p

      - name: Export repeatedly
        env:
          DEV_BIN: ${{ github.workspace }}/apps/desktop-gpui/target/debug/cap-gpui
          DEV_LIBS: ${{ github.workspace }}/target/native-deps/lib
          SCENARIO: export-stress
          HARNESS_IMAGE: cap-harness-gnome-gdb
          DOCKER_EXTRA: --ulimit core=-1
        run: |
          mkdir -p "$RUNNER_TEMP/out/stress"
          sudo -E bash scripts/linux-desktop-harness/run-desktop.sh gnome "$RUNNER_TEMP/cap.deb" \
            "$RUNNER_TEMP/out/stress" LAUNCH=dock APPROVE_SHORTCUT_AFTER=6 ROUNDS=120 || true
          sudo mkdir -p "$RUNNER_TEMP/out/stress/cores"
          sudo chmod -R a+r "$RUNNER_TEMP/out/stress"
          cat "$RUNNER_TEMP/out/stress/result.txt"
          {
            echo "### ${{ matrix.gpui }} shard ${{ matrix.shard }}"
            echo '```'
            cat "$RUNNER_TEMP/out/stress/result.txt"
            echo '```'
            for bt in "$RUNNER_TEMP"/out/stress/cores/*.bt.txt; do
              [[ -f $bt ]] || continue
              echo "#### $(basename "$bt")"
              echo '```'
              sed -n '1,60p' "$bt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-stress-${{ matrix.gpui }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/stress
          retention-days: 7

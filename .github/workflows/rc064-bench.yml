name: gate064 bench

# Temporary release-candidate comparison harness. Runs on ci/rc064-* branches
# only; each branch is a release ref plus this workflow.

on:
  push:
    branches:
      - "ci/gate064-**"

permissions:
  contents: read

jobs:
  export-bench:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - blacksmith-6vcpu-macos-15
          - windows-2022
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || runner.os == 'macOS' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
          prefix-key: v1-rust-rc064-bench-${{ matrix.runner }}
      - uses: ./.github/actions/install-desktop-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
        run: node scripts/setup.js
      - name: FFmpeg DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\target\ffmpeg\bin"
      - name: FFmpeg libraries on the loader path (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/target/native-deps/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      # A standalone ffmpeg CLI for the benchmark's synthetic source only; it
      # lives outside the linker paths so the build still links native-deps.
      - name: ffmpeg CLI for the source video
        shell: bash
        run: |
          python -m pip install --quiet imageio-ffmpeg==0.6.0 psutil==7.0.0
          exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffcli"
          if [[ "$RUNNER_OS" == Windows ]]; then cp "$exe" "$RUNNER_TEMP/ffcli/ffmpeg.exe"; else cp "$exe" "$RUNNER_TEMP/ffcli/ffmpeg"; chmod +x "$RUNNER_TEMP/ffcli/ffmpeg"; fi
          echo "$RUNNER_TEMP/ffcli" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --locked --release -p cap-export --example export-benchmark-runner
          echo "build seconds: $(( $(date +%s) - start ))"
      - name: FFmpeg framework next to the example binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          fw="$(find "$GITHUB_WORKSPACE/target" -maxdepth 4 -type d -name Spacedrive.framework -not -path '*/release/*' | head -1)"
          echo "framework: $fw"
          test -n "$fw"
          mkdir -p target/release/Frameworks
          ln -sfn "$fw" target/release/Frameworks/Spacedrive.framework
          ls target/release/Frameworks/Spacedrive.framework/Libraries | head -3
      - name: Sampler
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sample.py" <<'PY'
          import json, subprocess, sys, time
          import psutil
          out = sys.argv[1]
          cmd = sys.argv[2:]
          start = time.monotonic()
          p = subprocess.Popen(cmd)
          ps = psutil.Process(p.pid)
          peak = 0
          cpu = 0.0
          while p.poll() is None:
              try:
                  procs = [ps] + ps.children(recursive=True)
                  rss = 0
                  c = 0.0
                  for q in procs:
                      try:
                          m = q.memory_info().rss
                          t = q.cpu_times()
                          rss += m
                          c += t.user + t.system
                      except psutil.Error:
                          pass
                  peak = max(peak, rss)
                  cpu = max(cpu, c)
              except psutil.Error:
                  pass
              time.sleep(0.2)
          wall = time.monotonic() - start
          json.dump({"cmd": cmd, "exit": p.returncode, "wall_s": round(wall, 2), "cpu_s": round(cpu, 2), "peak_rss_mb": round(peak / 1048576, 1)}, open(out, "w"))
          print("SAMPLE", json.dumps({"exit": p.returncode, "wall_s": round(wall, 2), "cpu_s": round(cpu, 2), "peak_rss_mb": round(peak / 1048576, 1)}))
          sys.exit(p.returncode)
          PY
      - name: Export benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p bench-out
          bin=target/release/examples/export-benchmark-runner
          for i in 1 2; do
            python "$RUNNER_TEMP/sample.py" "bench-out/quick-$i.json" "$bin" --duration 30 quick 2>&1 | tee "bench-out/quick-$i.log" || true
            python "$RUNNER_TEMP/sample.py" "bench-out/gif-$i.json" "$bin" --duration 10 gif-only 2>&1 | tee "bench-out/gif-$i.log" || true
          done
      - name: Results
        if: always()
        shell: bash
        run: grep -h -E '^--- |Wall|Render|Effective|FPS|Frames|Output size|Status|SAMPLE' bench-out/*.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc064-export-${{ matrix.runner }}
          path: bench-out

  recording-bench:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith-6vcpu-macos-15
          - windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
          prefix-key: v1-rust-rc064-rec-${{ matrix.runner }}
      - uses: ./.github/actions/install-desktop-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
        run: node scripts/setup.js
      - name: FFmpeg DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\target\ffmpeg\bin"
      - name: Build
        shell: bash
        run: |
          python -m pip install --quiet psutil==7.0.0
          cargo build --locked --release -p cap-recording --example instant-mode-profile --example recording-benchmark
      - name: Capture permissions, display and BlackHole microphone (Blacksmith)
        if: startsWith(matrix.runner, 'blacksmith-')
        run: |
          set -euo pipefail
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          caffeinate -u -t 2
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for _ in $(seq 1 30); do
            SwitchAudioSource -a -t input | grep -qx "BlackHole 2ch" && break
            sleep 1
          done
          SwitchAudioSource -s "BlackHole 2ch" -t output
          SwitchAudioSource -s "BlackHole 2ch" -t input
          {
            echo "$GITHUB_WORKSPACE/target/release/examples/instant-mode-profile"
            echo "$GITHUB_WORKSPACE/target/release/examples/recording-benchmark"
            p=$$
            while [ "$p" -gt 1 ]; do ps -o comm= -p "$p"; p=$(ps -o ppid= -p "$p" | tr -d ' '); done
            command -v python3; command -v python; readlink -f "$(command -v python3)" || true
          } > "$RUNNER_TEMP/capture-binaries"
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          user_db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          sort -u "$RUNNER_TEMP/capture-binaries" | grep '^/' | while read -r client; do
            for service in kTCCServiceScreenCapture kTCCServiceMicrophone; do
              row="INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$service','$client',1,2,4,1,'UNUSED',0,$now);"
              sudo sqlite3 "$db" "$row"
              sqlite3 "$user_db" "$row"
            done
            echo "granted $client"
          done
          killall tccd || true
          sudo killall tccd || true
          sleep 2
      - name: FFmpeg framework next to the example binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          fw="$(find "$GITHUB_WORKSPACE/target" -maxdepth 4 -type d -name Spacedrive.framework -not -path '*/release/*' | head -1)"
          echo "framework: $fw"
          test -n "$fw"
          mkdir -p target/release/Frameworks
          ln -sfn "$fw" target/release/Frameworks/Spacedrive.framework
          ls target/release/Frameworks/Spacedrive.framework/Libraries | head -3
      - name: Install virtual audio device (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip -OutFile Scream3.6.zip
          $expected = "25ea5e778b4e6995a98d448b9b5f6d321f681663f1aeeec69d8e63183d008b19"
          $actual = (Get-FileHash -Algorithm SHA256 Scream3.6.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Scream3.6.zip SHA-256 mismatch: got $actual, expected $expected" }
          Expand-Archive -Path Scream3.6.zip -DestinationPath Scream
          $cert = (Get-AuthenticodeSignature Scream\Install\driver\Scream.sys).SignerCertificate
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Scream\Install\helpers\devcon.exe install Scream\Install\driver\Scream.inf *Scream
          if ($LASTEXITCODE -gt 1) { throw "devcon install failed with exit code $LASTEXITCODE" }
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
      - name: Sampler
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sample.py" <<'PY'
          import json, subprocess, sys, time
          import psutil
          out = sys.argv[1]
          cmd = sys.argv[2:]
          start = time.monotonic()
          p = subprocess.Popen(cmd)
          ps = psutil.Process(p.pid)
          peak = 0
          cpu = 0.0
          while p.poll() is None:
              try:
                  rss = ps.memory_info().rss
                  t = ps.cpu_times()
                  peak = max(peak, rss)
                  cpu = max(cpu, t.user + t.system)
              except psutil.Error:
                  pass
              time.sleep(0.2)
          wall = time.monotonic() - start
          r = {"exit": p.returncode, "wall_s": round(wall, 2), "cpu_s": round(cpu, 2), "cpu_pct": round(100 * cpu / wall, 1), "peak_rss_mb": round(peak / 1048576, 1)}
          json.dump(dict(r, cmd=cmd), open(out, "w"))
          print("SAMPLE", json.dumps(r))
          sys.exit(p.returncode)
          PY
      - name: Recording benchmarks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p rec-out
          ex=target/release/examples
          mic=""
          [[ "$RUNNER_OS" == Windows ]] && mic="--no-mic"
          mode=screen-mic
          [[ "$RUNNER_OS" == Windows ]] && mode=screen-only
          for i in 1 2; do
            python "$RUNNER_TEMP/sample.py" "rec-out/instant-$i.json" "$ex/instant-mode-profile" --mode "$mode" --duration 30 --no-camera $mic 2>&1 | tee "rec-out/instant-$i.log" || true
            python "$RUNNER_TEMP/sample.py" "rec-out/studio-$i.json" "$ex/recording-benchmark" --mode screen --duration 30 2>&1 | tee "rec-out/studio-$i.log" || true
          done
      - name: Results
        if: always()
        shell: bash
        run: grep -h -i -E 'microphone:|frames|dropped|fps|output size|health|stop took|SAMPLE|error|panick' rec-out/*.log | grep -v -E '^\S+Z\s+(DEBUG|TRACE)' | head -200 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rc064-rec-${{ matrix.runner }}
          path: rec-out

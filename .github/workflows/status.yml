name: Status app

on:
  merge_group:
  pull_request:
    paths:
      - "apps/status/**"
      - "bun.lock"
      - ".github/workflows/status.yml"
  push:
    branches: [main]
    paths:
      - "apps/status/**"
      - "bun.lock"
      - ".github/workflows/status.yml"

permissions:
  contents: read

jobs:
  # GitHub ignores paths filters in the merge queue, so the queue run applies
  # this workflow's pull_request paths to the queued change itself.
  scope:
    name: Scope
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Merge queue scope
        id: queue
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/merge_queue.py scope --workflow .github/workflows/status.yml --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  verify:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/status test
      - run: bun run --cwd apps/status build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

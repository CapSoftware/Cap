name: Scratch AVF seek proof

on:
  push:
    branches:
      - ci/avf-seek-stale-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: aarch64-apple-darwin
          tier: fast
      - name: Proof
        run: |
          set +e
          mkdir -p target/ci-verify
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks" target/ci-verify/Frameworks
          export CAP_VERIFY_TIER=fast
          for i in 1 2 3 4 5; do
            cargo nextest run --cargo-profile ci-verify -p cap-verify --test seek --no-fail-fast --failure-output final --success-output final > "$RUNNER_TEMP/proof-seek-head-$i.log" 2>&1
            echo "== seek round $i head exit=$?"
            grep -a "FAIL seek\|got 0:\|fallback reason" "$RUNNER_TEMP/proof-seek-head-$i.log" | sed 's/^ *//' | sort -u | head -12
            grep -a "case seek\|avf-proof" "$RUNNER_TEMP/proof-seek-head-$i.log" | grep -a -B1 "avf-proof" | sed 's/^ *//' | cut -c1-330 | head -40
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: ${{ runner.temp }}/proof-*.log

name: Instant fixture probe (scratch)

on:
  push:
    branches: [ci/fixproof-video-timestamps, scratch/fixproof-video-timestamps-base]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CAP_VERIFY_CARGO_PROFILE: ci-verify
  CAP_VERIFY_LOCKED: "1"

jobs:
  probe:
    name: probe ${{ matrix.runner }} ${{ matrix.copy }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, copy: a, target: aarch64-apple-darwin }
          - { runner: macos-15, copy: b, target: aarch64-apple-darwin }
          - { runner: macos-26, copy: a, target: aarch64-apple-darwin }
          - { runner: windows-2022, copy: a, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ matrix.target }}
          tier: fast
      - name: Build
        shell: bash
        run: scripts/verify/run.sh fast --suites export --no-run
      - name: Fresh Instant fixtures, one process each
        shell: bash
        env:
          CAP_VERIFY_TIER: fast
          CAP_VERIFY_CASE: export/instant*
        run: |
          set +e
          PY=$(command -v python3 || command -v python)
          mkdir -p "$RUNNER_TEMP/probe/reports" "$RUNNER_TEMP/probe/fixtures"
          for i in 1 2 3 4 5; do
            export CAP_VERIFY_FIXTURE_DIR="$RUNNER_TEMP/probe/fixtures/fx-$i"
            export CAP_VERIFY_REPORT_DIR="$RUNNER_TEMP/probe/reports/report-$i"
            if [[ $i == 5 ]]; then export CAP_VERIFY_LOG="cap_recording::output_pipeline=debug"; fi
            cargo nextest run --cargo-profile ci-verify --locked -p cap-verify --test export --no-fail-fast \
              -E 'binary_id(cap-verify::export) and test(=instant_output)' > "$RUNNER_TEMP/probe/reports/log-$i.txt" 2>&1
            echo "iteration $i exit $?"
            cat "$CAP_VERIFY_REPORT_DIR"/*.jsonl | "$PY" -c '
          import sys, json
          for l in sys.stdin:
              if "\"case\"" not in l: continue
              r = json.loads(l)
              print("PROBE", r["outcome"], r["case"], sorted(r["failures"]), "|", "; ".join(r.get("notes", [])[:3]))'
          done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instant-probe-reports-${{ matrix.runner }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/probe/reports
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instant-probe-fixtures-${{ matrix.runner }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/probe/fixtures
          retention-days: 7

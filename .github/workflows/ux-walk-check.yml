name: ux-walk native checks

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Build an isolated macOS preview after checks pass
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/desktop-gpui/**
      - apps/cli/**
      - apps/cloud/**
      - crates/cloud-sharing/**
      - crates/fork-brand/**
      - crates/fork-cli-shim/**
      - crates/recording/**
      - scripts/bundle-gpui*
      - scripts/fork-brand*
      - scripts/build-desktop-binaries*
      - scripts/build-macos-packages*
      - scripts/bundle-ux-walk*
      - vendor/ux-walk/**
      - .github/workflows/ux-walk-*.yml
  push:
    branches: [main, feat/walkthrough-entry]
    paths:
      - apps/desktop-gpui/**
      - apps/cli/**
      - apps/cloud/**
      - crates/cloud-sharing/**
      - crates/fork-brand/**
      - crates/fork-cli-shim/**
      - crates/recording/**
      - scripts/bundle-gpui*
      - scripts/fork-brand*
      - scripts/build-desktop-binaries*
      - scripts/build-macos-packages*
      - scripts/bundle-ux-walk.mjs
      - vendor/ux-walk/**

permissions:
  contents: read

concurrency:
  group: ux-walk-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud:
    if: github.repository == 'CantrellJax/ux-walk-cap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix apps/cloud
      - run: npm run check --prefix apps/cloud
  library-contract:
    if: github.repository == 'CantrellJax/ux-walk-cap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Exercise existing journal and library contracts without desktop dependencies
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, tomllib
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ux-walk-library-contract'
          (out / 'src').mkdir(parents=True)
          (out / 'tests').mkdir()
          versions = {item['name']: item['version'] for item in tomllib.loads((root / 'Cargo.lock').read_text())['package']}
          manifest = '[package]\nname = "cap-walk-library-contract"\nversion = "0.0.0"\nedition = "2024"\n\n[dependencies]\n'
          manifest += 'serde = { version = ' + json.dumps('=' + versions['serde']) + ', features = ["derive"] }\n'
          manifest += 'serde_json = ' + json.dumps('=' + versions['serde_json']) + '\n'
          manifest += 'libc = ' + json.dumps('=' + versions['libc']) + '\n'
          (out / 'Cargo.toml').write_text(manifest)
          (out / 'src/lib.rs').write_text('')
          for name in ['ux_walk_library.rs', 'ux_walk_journal.rs']:
              shutil.copyfile(root / 'apps/desktop-gpui/src' / name, out / 'src' / name)
          shutil.copyfile(root / 'apps/desktop-gpui/tests/ux_walk_library_contract.rs', out / 'tests/ux_walk_library_contract.rs')
          PY
          cargo test --manifest-path "$RUNNER_TEMP/ux-walk-library-contract/Cargo.toml" --test ux_walk_library_contract -- --test-threads=1
      - name: Format advisory ownership surfaces
        run: |
          rustfmt +1.95.0 --edition 2024 --config skip_children=true apps/desktop-gpui/src/ux_walk_library.rs apps/desktop-gpui/src/ux_walk_window.rs apps/desktop-gpui/tests/ux_walk_library_contract.rs
          git diff > "$RUNNER_TEMP/library-rustfmt.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: library-rustfmt-corrections
          path: ${{ runner.temp }}/library-rustfmt.patch
      - run: git diff --exit-code
  native:
    needs: library-contract
    if: github.repository == 'CantrellJax/ux-walk-cap'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check packaging profiles and staging
        run: node --test scripts/fork-brand.test.mjs scripts/fork-branding.test.mjs scripts/bundle-gpui.test.mjs scripts/bundle-ux-walk.test.mjs scripts/build-desktop-binaries-cache.test.mjs scripts/build-macos-packages.test.mjs
      - name: Check the cross-app audio hardware smoke runner
        run: python3 -m py_compile scripts/test-independent-audio.py
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cap-ux-xcode26
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target
      - name: Format changed Rust surfaces
        run: |
          rustfmt +1.95.0 --edition 2024 --config skip_children=true apps/desktop-gpui/src/fork.rs apps/desktop-gpui/src/fork_titles.rs apps/cli/src/fork_cli.rs crates/fork-cli-shim/src/lib.rs apps/desktop-gpui/src/ux_walk_checkpoints.rs apps/cli/src/recovery.rs crates/cloud-sharing/src/recovery.rs apps/desktop-gpui/src/assets.rs apps/desktop-gpui/src/platform.rs apps/desktop-gpui/src/permission_guide.rs apps/desktop-gpui/src/camera_window.rs apps/desktop-gpui/src/target_overlay.rs apps/desktop-gpui/src/ux_walk_browser.rs apps/desktop-gpui/src/ux_walk_browser_target.rs apps/desktop-gpui/tests/ux_walk_browser_contract.rs apps/desktop-gpui/src/tray.rs apps/desktop-gpui/src/tray/ux_walk.rs apps/desktop-gpui/src/tray/mac_mode_picker.rs apps/desktop-gpui/src/updates.rs apps/desktop-gpui/src/installer.rs apps/desktop-gpui/src/ux_walk.rs apps/desktop-gpui/src/ux_walk/assets.rs apps/desktop-gpui/src/ux_walk/external.rs apps/cli/src/walk.rs apps/desktop-gpui/src/ux_walk_journal.rs apps/desktop-gpui/src/ux_walk_library.rs apps/desktop-gpui/src/library.rs apps/desktop-gpui/src/library/ux_walk.rs apps/desktop-gpui/tests/ux_walk_library_contract.rs apps/desktop-gpui/src/ux_walk_window.rs apps/desktop-gpui/src/ux_walk_window/filing.rs apps/desktop-gpui/src/ux_walk_filing.rs apps/desktop-gpui/src/session.rs apps/desktop-gpui/src/session/ux_walk.rs apps/desktop-gpui/src/controls_window.rs apps/desktop-gpui/src/recording.rs apps/desktop-gpui/src/recording/local_instant.rs apps/desktop-gpui/src/deeplink.rs apps/desktop-gpui/src/menus.rs apps/desktop-gpui/src/menus/fork.rs apps/desktop-gpui/src/hotkeys.rs apps/desktop-gpui/tests/ux_walk_journal_contract.rs apps/desktop-gpui/src/ux_walk_preferences.rs apps/desktop-gpui/src/ux_walk_projects.rs apps/desktop-gpui/src/settings_ux_walk.rs apps/desktop-gpui/src/settings_ux_walk_projects.rs apps/desktop-gpui/src/settings_window.rs apps/desktop-gpui/src/settings_window/fork.rs apps/desktop-gpui/src/fork_policy.rs apps/desktop-gpui/src/settings_pages.rs apps/desktop-gpui/src/settings_pages/fork.rs apps/desktop-gpui/src/store.rs apps/desktop-gpui/src/diagnostics.rs apps/desktop-gpui/src/transcription.rs apps/desktop-gpui/src/mode_choice.rs apps/desktop-gpui/src/mode_select_window.rs apps/desktop-gpui/src/main_window.rs apps/desktop-gpui/src/main_window/ux_walk.rs apps/desktop-gpui/src/onboarding_window.rs apps/desktop-gpui/src/onboarding_window/ux_walk.rs apps/desktop-gpui/src/onboarding_doodles.rs apps/desktop-gpui/src/app_windows.rs apps/cli/src/credentials.rs apps/cli/src/automation.rs apps/cli/src/recordings.rs apps/cli/src/update.rs apps/cli/src/upload.rs apps/cli/src/sharing.rs apps/cli/src/main.rs apps/cli/src/guide.rs apps/cli/src/agents.rs apps/desktop-gpui/src/settings_sharing.rs apps/desktop-gpui/src/auth.rs apps/desktop-gpui/src/sign_in.rs apps/desktop-gpui/src/upload.rs apps/desktop-gpui/src/upload/queue.rs apps/desktop-gpui/src/editor_export.rs apps/desktop-gpui/src/editor_window/frame.rs apps/desktop-gpui/src/screenshot_editor.rs crates/cloud-sharing/src/lib.rs
          rustfmt +1.95.0 --edition 2024 --config skip_children=true crates/recording/src/sources/screen_capture/mod.rs crates/recording/src/sources/screen_capture/macos.rs crates/recording/src/sources/screen_capture/window_target.rs crates/recording/src/studio_recording.rs crates/recording/src/instant_recording.rs crates/recording/tests/macos_window_target_contract.rs
          rustfmt +1.95.0 --edition 2024 --config skip_children=true apps/desktop-gpui/src/onboarding_window/stage.rs apps/desktop-gpui/src/permissions.rs
          rustfmt +1.95.0 --edition 2024 --config skip_children=true apps/cli/src/agents.rs
          rustfmt +1.95.0 --edition 2024 --config skip_children=true crates/fork-brand/src/lib.rs crates/fork-brand/build.rs apps/desktop-gpui/brand_build.rs apps/desktop-gpui/src/fork_identity_tests.rs apps/desktop-gpui/src/fork_link_tests.rs apps/desktop-gpui/src/fork_catalog_tests.rs apps/desktop-gpui/src/i18n_shipped.rs apps/cli/tests/fork_update_refusal.rs
          rustfmt +1.95.0 --edition 2024 --config skip_children=true crates/recording/src/sources/screen_capture/macos/system_audio.rs
          git diff > "$RUNNER_TEMP/rustfmt.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustfmt-corrections
          path: ${{ runner.temp }}/rustfmt.patch
      - name: Verify Rust formatting before native build
        run: git diff --exit-code
      - name: Prepare native dependencies
        run: |
          node scripts/setup.js
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Check desktop and CLI
        run: |
          cargo +1.95.0 check --manifest-path apps/desktop-gpui/Cargo.toml --locked -p cap-desktop-gpui
          cargo +1.95.0 check --locked -p cap
          cargo +1.95.0 test --locked -p cap-cloud-sharing
          cargo +1.95.0 test --locked -p fork-brand
          cargo +1.95.0 test --locked -p fork-cli-shim
          cargo +1.95.0 test --locked -p cap --bin cap walk::tests
      - name: Exercise the native walk processor
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          node --test apps/desktop-gpui/ux-walk/browser-evidence.test.mjs apps/desktop-gpui/ux-walk/native-walk.test.mjs apps/desktop-gpui/ux-walk/native-walk-projects.test.mjs apps/desktop-gpui/ux-walk/native-audio.test.mjs apps/desktop-gpui/ux-walk/walk-chrome-launcher.test.mjs apps/desktop-gpui/ux-walk/checkpoint-*.test.mjs apps/desktop-gpui/ux-walk/fragmented-audio.test.mjs apps/desktop-gpui/ux-walk/restore-checkpoint.test.mjs vendor/ux-walk/test/unit/transcript-only.test.mjs vendor/ux-walk/test/unit/transcript-words.test.mjs vendor/ux-walk/test/unit/tracker-run.test.mjs
      - name: Exercise portable production projects
        run: node --test apps/cli/skill/cap-demo/lib/production.test.mjs
      - name: Exercise isolated window selection
        run: |
          rustc +1.95.0 --edition 2024 --test crates/recording/tests/macos_window_target_contract.rs -o "$RUNNER_TEMP/window-capture-contract"
          "$RUNNER_TEMP/window-capture-contract"
      - name: Exercise requested meeting audio failure reporting
        run: |
          mkdir -p target/debug/Frameworks
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" target/debug/Frameworks/Spacedrive.framework
          cargo +1.95.0 test --locked -p cap-recording requested_system_audio_failure_reaches_recording_watcher
      - name: Exercise menu and fork update protection
        run: |
          task_frameworks="apps/desktop-gpui/target/debug/Frameworks"
          mkdir -p "$task_frameworks"
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$task_frameworks/Spacedrive.framework"
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui owned_sharing_tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui tray::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui tray::ux_walk::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --test ux_walk_journal_contract
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --test ux_walk_browser_contract
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --test ux_walk_library_contract
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_browser::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui hotkeys::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui settings_window::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui settings_window::fork::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui settings_pages::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui entitlement::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui assets::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui target_overlay::tests::mode_menu_matches_menu_modes
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui menus::tests::menu_bar_includes_native_and_cap_destinations
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_preferences::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_projects::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_filing::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk_items::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui ux_walk::external::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui deeplink::tests::parses_outside_walk_actions
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui session::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui app_windows::tests::defaults_exclude_our_windows_with_the_instant_camera_carve_out
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui app_windows::tests::default_exclusion_titles_line_up_with_the_table
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui main_window::mode_hover_tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui onboarding_window::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui onboarding_window::ux_walk::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui fork_identity_tests::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui fork_link_tests::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui fork_catalog_tests::
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui menus::fork::tests
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui i18n::
          cargo +1.95.0 test --locked -p cap --test fork_update_refusal
      - name: Verify formatting
        if: always()
        run: git diff --exit-code
      - name: Set up preview packaging tools
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install only the existing bundler's tools
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          task_tools="$RUNNER_TEMP/ux-walk-packaging-tools"
          mkdir -p "$task_tools"
          cd "$task_tools"
          printf '{"private":true}\n' > package.json
          bun add --exact @tauri-apps/cli@2.8.4 dotenv-cli@11.0.0
          printf '%s\n' "$task_tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare an isolated preview configuration
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          brand = json.loads((root / 'crates/fork-brand/brand.json').read_text())
          preview_name = brand['display_name'] + ' Preview'
          preview_id = brand['bundle_id'] + '.preview'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PREVIEW_APP=apps/desktop-gpui/target/debug/bundle/macos/' + preview_name + '.app\n')
              env.write('PREVIEW_ID=' + preview_id + '\n')
              env.write('BRAND_NAME=' + brand['display_name'] + '\n')
              env.write('BRAND_MACOS=' + brand['macos']['minimum_system_version'] + '\n')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ux-walk-preview'
          out.mkdir(parents=True, exist_ok=True)
          sha = os.environ['GITHUB_SHA']
          profile = '/tmp/ux-walk-cap-preview-' + sha[:12]
          info = plistlib.loads((root / 'apps/desktop-gpui/Info.plist').read_bytes())
          info['CFBundleDocumentTypes'] = []
          info['CFBundleURLTypes'] = []
          info['UXWalkBuildSHA'] = sha
          info['UXWalkSourceURL'] = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/tree/' + sha
          info['LSEnvironment'] = {
              'CAP_GPUI_APP_DATA_DIR': profile + '/data',
              'CAP_GPUI_LOG_DIR': profile + '/logs',
              'CAP_GPUI_RECORDINGS_DIR': profile + '/recordings',
              'CAP_UX_WALK_CONFIG_DIR': profile + '/ux-walk',
              'CAP_UX_SHARING_CONFIG': profile + '/sharing.json',
          }
          plist = out / 'Preview.plist'
          plist.write_bytes(plistlib.dumps(info))
          (root / 'apps/desktop-gpui/Info.plist').write_bytes(plist.read_bytes())
          config = {
              'productName': preview_name,
              'mainBinaryName': 'Cap',
              'identifier': preview_id,
              'bundle': {
                  'createUpdaterArtifacts': False,
                  'fileAssociations': [],
                  'macOS': {'signingIdentity': '-', 'minimumSystemVersion': brand['macos']['minimum_system_version']},
              },
          }
          (out / 'preview.json').write_text(json.dumps(config, indent=2) + '\n')
          (out / 'source.json').write_text(json.dumps({
              'sourceRevision': sha, 'sourceURL': info['UXWalkSourceURL'],
              'profile': 'debug', 'isolatedProfile': profile,
              'purpose': 'local menu validation; not a signed public release',
          }, indent=2) + '\n')
          PY
      - name: Build a genuine debug preview through the existing pipeline
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: |
          task_target="$(rustc -vV | sed -n 's/host: //p')"
          node scripts/build-desktop-binaries.mjs "$task_target" --debug
          node scripts/bundle-gpui.mjs "$task_target" --debug --bundles app --config "$RUNNER_TEMP/ux-walk-preview/preview.json"
      - name: Bundle the walk engine and native controls
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          npm ci --ignore-scripts --prefix vendor/ux-walk
          CAP_UX_BROWSER_SMOKE=1 node --test apps/desktop-gpui/ux-walk/native-browser.test.mjs
          node --test vendor/ux-walk/test/unit/embedded-config.test.mjs vendor/ux-walk/test/unit/cap-editor-handoff.test.mjs
          node scripts/bundle-ux-walk.mjs "$PREVIEW_APP"
      - name: Verify and retain the preview
        if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        run: |
          task_app="$PREVIEW_APP"
          test -d "$task_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$task_app/Contents/Info.plist")" = "$PREVIEW_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UXWalkBuildSHA' "$task_app/Contents/Info.plist")" = "$GITHUB_SHA"
          codesign --verify --deep --strict "$task_app"
          test "$(env -i "$task_app/Contents/Resources/ux-walk/bin/node" -p 'process.versions.node.split(".")[0]')" = 22
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ['PREVIEW_APP'])
          name = os.environ['BRAND_NAME']
          minimum = os.environ['BRAND_MACOS']
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          profile = '/tmp/ux-walk-cap-preview-' + os.environ['GITHUB_SHA'][:12]
          assert not info.get('CFBundleDocumentTypes'), 'Preview must not claim recordings'
          assert not info.get('CFBundleURLTypes'), 'Preview must not claim URL schemes'
          assert info['CFBundleDisplayName'] == name, 'Dock branding must be ' + name
          assert info['CFBundleName'] == name, 'App menu branding must be ' + name
          assert name in info['NSMicrophoneUsageDescription'], 'Permission prompts must name ' + name
          assert not info.get('CFBundleLocalizations'), 'The fork ships English permission text'
          assert not list((app / 'Contents/Resources').glob('*.lproj/InfoPlist.strings')), 'Upstream permission text must not ship'
          icon = info.get('CFBundleIconFile', 'icon.icns')
          icon = icon if icon.endswith('.icns') else icon + '.icns'
          assert (app / 'Contents/Resources' / icon).read_bytes() == pathlib.Path('apps/desktop-gpui/assets/branding/app/icon.icns').read_bytes(), 'The app icon must be the fork art'
          assert not (app / 'Contents/Helpers/UX Walk.app').exists(), 'Do not ship a second menu bar app'
          assert (app / 'Contents/Resources/ux-walk/native-walk.mjs').is_file(), 'Bundle the native walk processor'
          assert (app / 'Contents/Resources/ux-walk/brand.json').is_file(), 'Bundle the brand door for the walk mode name'
          assert info['LSMinimumSystemVersion'] == minimum, f"{name} requires macOS {minimum}; bundled value was {info['LSMinimumSystemVersion']}"
          assert info['LSEnvironment'] == {
              'CAP_GPUI_APP_DATA_DIR': profile + '/data',
              'CAP_GPUI_LOG_DIR': profile + '/logs',
              'CAP_GPUI_RECORDINGS_DIR': profile + '/recordings',
              'CAP_UX_WALK_CONFIG_DIR': profile + '/ux-walk',
              'CAP_UX_SHARING_CONFIG': profile + '/sharing.json',
          }, 'Preview profile isolation was not retained by the bundler'
          print('Bundled preview associations and isolated profile verified')
          PY
          file "$task_app/Contents/MacOS/Cap" > "$RUNNER_TEMP/ux-walk-preview/executable.txt"
          ditto -c -k --sequesterRsrc --keepParent "$task_app" "$RUNNER_TEMP/ux-walk-preview/preview.zip"
          cp LICENSE UX-WALK.md "$RUNNER_TEMP/ux-walk-preview/"
          shasum -a 256 "$RUNNER_TEMP/ux-walk-preview/preview.zip" > "$RUNNER_TEMP/ux-walk-preview/SHA256.txt"
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview))
        with:
          name: cap-walkthrough-preview
          path: ${{ runner.temp }}/ux-walk-preview/
          retention-days: 14

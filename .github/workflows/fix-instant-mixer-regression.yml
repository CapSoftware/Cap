name: Instant mixer sparse and PCM identity proof
on:
  push:
    branches: [ci/fixproof-instant-mixer]
    paths: [.github/workflows/fix-instant-mixer-regression.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - os: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: ${{ matrix.target }}
          tier: fast
      - name: Link native framework
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/ci-verify/Frameworks
          ln -s "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" target/ci-verify/Frameworks/Spacedrive.framework
      - name: Preserve same strict PCM probe on both product versions
        run: |
          mkdir -p "$RUNNER_TEMP/mixer-regression"
          cp crates/recording/src/sources/audio_mixer.rs "$RUNNER_TEMP/mixer-regression/candidate.rs"
          git fetch origin 94923f8918b064f8c8714d963f17833289793dc6 --depth=1
          git show 94923f8918b064f8c8714d963f17833289793dc6:crates/recording/src/sources/audio_mixer.rs > "$RUNNER_TEMP/mixer-regression/main.rs"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mixer-regression"
          candidate = (root / "candidate.rs").read_text()
          start = candidate.index("    struct PcmProbe {")
          end = candidate.index("    #[tokio::test]\n    async fn mix_sources()", start)
          tests = candidate[start:end]
          for name in ["pcm_first_input_after_grace_drops_and_counts_only_committed_samples", "pcm_watermark_limits_commitment_to_the_shortest_input", "pcm_watermark_splits_do_not_accumulate_timestamp_rounding"]:
              begin = tests.index("    #[test]\n    fn " + name)
              finish = tests.index("    #[test]", begin + 1)
              tests = tests[:begin] + tests[finish:]
          main = (root / "main.rs").read_text()
          at = main.index("    #[tokio::test]\n    async fn mix_sources()")
          (root / "main.rs").write_text(main[:at] + tests + main[at:])
          for arm in ["main", "candidate"]:
              path = root / f"{arm}.rs"
              source = path.read_text().replace(
                  "        assert_eq!(\n            probe.peaks(0),\n            [14_400, 28_800, 43_200],",
                  '        eprintln!("SPARSE output_samples={} peaks={:?}", probe.pcm.len(), probe.peaks(0));\n        assert_eq!(\n            probe.peaks(0),\n            [14_400, 28_800, 43_200],'
              )
              path.write_text(source)
          PY
      - name: Compare strict sparse probe and single-source recordings
        run: |
          set -o pipefail
          root="$RUNNER_TEMP/mixer-regression"
          for arm in main candidate; do
            cp "$root/$arm.rs" crates/recording/src/sources/audio_mixer.rs
            status=0
            cargo test -p cap-recording --lib --profile ci-verify --locked pcm_sparse_system_and_pause_resume_preserve_later_gaps -- --nocapture 2>&1 | tee "$root/$arm.log" || status=$?
            if [[ "$arm" == main ]]; then test "$status" = 101; else test "$status" = 0; fi
            status=0
            cargo test -p cap-recording --lib --profile ci-verify --locked pcm_delayed_first_delivery_retains_captured_samples -- --nocapture 2>&1 | tee "$root/$arm-delayed.log" || status=$?
            echo "DELAYED_ARM=$arm EXIT=$status"
            if [[ "$arm" == main ]]; then test "$status" = 101; else test "$status" = 0; fi
            cargo run -p cap-verify --example mixer-pcm-identity --profile ci-verify --locked -- "$root/$arm-recordings" > "$root/$arm-recordings.log" 2>&1
          done
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mixer-regression"
          assert "peaks=[14401, 28802, 43203]" in (root / "main.log").read_text()
          assert "peaks=[14400, 28800, 43200]" in (root / "candidate.log").read_text()
          assert "peaks=[12001]" in (root / "main-delayed.log").read_text()
          candidate_delayed = (root / "candidate-delayed.log").read_text()
          for delivery in [400, 800, 1000]:
              assert f"delivery_ms={delivery} peaks=[12000]" in candidate_delayed
          results = {}
          for source in ["mic", "system"]:
              files = [root / f"{arm}-recordings/{source}.pcm" for arm in ["main", "candidate"]]
              data = [file.read_bytes() for file in files]
              assert data[0] == data[1] and data[0], (source, [len(value) for value in data])
              metadata = [json.loads((root / f"{arm}-recordings/{source}.json").read_text()) for arm in ["main", "candidate"]]
              assert metadata[0] == metadata[1], (source, metadata)
              results[source] = {"bytes": len(data[0]), "sha256": hashlib.sha256(data[0]).hexdigest(), "metadata": metadata[0]}
          (root / "identity.json").write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mixer-sparse-comparison-${{ matrix.os }}
          path: ${{ runner.temp }}/mixer-regression
          retention-days: 7

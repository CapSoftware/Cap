name: Verify recording (real capture)

# Records a marker stimulus through Cap's real Studio and Instant pipelines
# (ScreenCaptureKit + VideoToolbox) on macOS runners and checks every
# frame and audio marker against the host-clock truth. See
# crates/verify/tests/recording.rs.
#
# Runners: Blacksmith macOS (M4 Pro VM, 6 vCPU, logged-in GUI session, no
# concurrency cap) by default; GitHub-hosted macOS (5 concurrent jobs for the
# whole org) on dispatch with runners=hosted or both. Blacksmith needs Screen
# Recording granted in TCC to the binaries that capture and their runner
# ancestry, and an audio device (BlackHole), which also makes system audio
# capturable there.

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs of each case"
        default: "1"
      tier:
        description: "fast or full"
        default: "fast"
      case_filter:
        description: "Case globs, comma-separated (empty runs all)"
        default: ""
      keep_artifacts:
        description: "Preserve recordings and raw crash snapshots for passing cases"
        type: boolean
        default: false
      runners:
        description: "blacksmith (default), hosted (GitHub macOS, fallback) or both"
        type: choice
        options: [blacksmith, hosted, both]
        default: blacksmith
  push:
    branches:
      - ci/verify-recording
    paths:
      - "crates/verify/**"
      - "crates/recording/**"
      - ".github/workflows/verify-recording.yml"

concurrency:
  group: verify-recording-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-capture:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners == 'hosted' && '["macos-15","macos-26"]' || inputs.runners == 'both' && '["blacksmith-6vcpu-macos-15","blacksmith-6vcpu-macos-26","macos-15","macos-26"]' || '["blacksmith-6vcpu-macos-15","blacksmith-6vcpu-macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CAP_VERIFY_CAPTURE: display
      CAP_VERIFY_REQUIRE_CAPTURE: "1"
      CAP_VERIFY_TIER: ${{ inputs.tier || 'fast' }}
      CAP_VERIFY_REPEAT: ${{ inputs.repeat || '5' }}
      CAP_VERIFY_CASE: ${{ inputs.case_filter || '' }}
      CAP_VERIFY_KEEP: ${{ inputs.keep_artifacts && '1' || '' }}
      CAP_VERIFY_SCRATCH: ${{ github.workspace }}/verify-scratch
      CAP_VERIFY_REPORT_DIR: ${{ github.workspace }}/verify-report
      CAP_VERIFY_DUMP: ${{ github.workspace }}/verify-dump
      # Hosted macos-26 has a virtual output device that gives
      # ScreenCaptureKit only silence, so system audio is not required
      # there; Blacksmith gets BlackHole (set up below), which carries the
      # stimulus's audio to ScreenCaptureKit, so system audio is required
      # and the system-only case runs.
      CAP_VERIFY_AUDIO_OUTPUT: ${{ startsWith(matrix.runner, 'blacksmith-') && 'BlackHole 2ch' || matrix.runner == 'macos-26' && 'Null Audio Device' || '' }}
      CAP_VERIFY_REQUIRE_SYSTEM_AUDIO: ${{ startsWith(matrix.runner, 'blacksmith-') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin
          prefix-key: v1-rust-verify-recording-${{ matrix.runner }}
          save-cache: "true"

      - uses: ./.github/actions/install-desktop-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
        run: node scripts/setup.js

      - name: Runner devices
        run: |
          sw_vers
          system_profiler SPDisplaysDataType SPAudioDataType 2>/dev/null | sed -n 1,80p
          sysctl hw.memsize hw.ncpu

      # Spotlight indexes the build and every recording the suite writes:
      # mds (priority 50) plus a dozen mdworkers averaged 1 to 1.8 of the 3
      # cores during the tests (ps samples, run 38736744971).
      - name: Disable Spotlight indexing
        run: |
          sudo mdutil -a -i off || true
          sudo mdutil -as || true

      - name: Build
        run: |
          start=$(date +%s)
          cargo test --locked -p cap-verify --test recording --no-run
          echo "build seconds: $(( $(date +%s) - start ))"

      # Blacksmith runs a logged-in GUI session with SIP disabled, but:
      # - ScreenCaptureKit is denied until TCC grants the responsible process
      #   (Runner.Worker), so Screen Recording and Microphone are granted to
      #   every binary that captures plus the whole runner ancestry, in the
      #   system and the user TCC database (Microphone is a per-user
      #   service: without it CoreAudio blocks the stimulus forever in
      #   AudioDeviceCreateIOProcID waiting for coreaudiod), then tccd
      #   restarts;
      # - the display starts asleep (CGDisplayIsAsleep, no active display),
      #   so ScreenCaptureKit lists windows but no display: wake it and keep
      #   it awake for the job;
      # - there is no audio device: BlackHole provides input and output.
      - name: Blacksmith capture permissions and audio device
        if: startsWith(matrix.runner, 'blacksmith-')
        run: |
          set -euo pipefail
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          caffeinate -u -t 2
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for i in $(seq 1 30); do
            SwitchAudioSource -a -t output | grep -qx "BlackHole 2ch" && break
            sleep 1
          done
          SwitchAudioSource -s "BlackHole 2ch" -t output
          SwitchAudioSource -s "BlackHole 2ch" -t input
          echo "outputs:"; SwitchAudioSource -a -t output
          echo "default output: $(SwitchAudioSource -c -t output)"

          cargo test --locked -p cap-verify --test recording --no-run --message-format=json 2>/dev/null \
            | python3 -c 'import json, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] in ("recording", "cap-verify-stimulus"):
                  print(m["executable"])' > "$RUNNER_TEMP/capture-binaries"
          test "$(wc -l < "$RUNNER_TEMP/capture-binaries")" -ge 2
          p=$$
          while [ "$p" -gt 1 ]; do
            ps -o comm= -p "$p"
            p=$(ps -o ppid= -p "$p" | tr -d ' ')
          done >> "$RUNNER_TEMP/capture-binaries"
          for c in "$(rustup which cargo)" "$HOME/.cargo/bin/cargo"; do echo "$c"; done >> "$RUNNER_TEMP/capture-binaries"

          db="/Library/Application Support/com.apple.TCC/TCC.db"
          user_db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          approvals="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          mkdir -p "$(dirname "$approvals")"
          now=$(date +%s)
          until=$(date -u -v+1y '+%a %b %d %H:%M:%S GMT %Y')
          sort -u "$RUNNER_TEMP/capture-binaries" | grep '^/' | while read -r client; do
            for service in kTCCServiceScreenCapture kTCCServiceMicrophone; do
              row="INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$service','$client',1,2,4,1,'UNUSED',0,$now);"
              sudo sqlite3 "$db" "$row"
              sqlite3 "$user_db" "$row"
            done
            /usr/libexec/PlistBuddy -c "Add :$client date $until" "$approvals" >/dev/null 2>&1 || true
            echo "granted $client"
          done
          killall tccd || true
          sudo killall tccd || true
          sleep 2
          cat > "$RUNNER_TEMP/display.swift" <<'SWIFT'
          import CoreGraphics
          let main = CGMainDisplayID()
          print("display \(main): asleep \(CGDisplayIsAsleep(main)), active \(CGDisplayIsActive(main)), \(CGDisplayBounds(main)), screen capture \(CGPreflightScreenCaptureAccess())")
          SWIFT
          swiftc "$RUNNER_TEMP/display.swift" -o "$RUNNER_TEMP/display"
          "$RUNNER_TEMP/display"

      - name: Real-capture recording oracle
        run: |
          mkdir -p "$CAP_VERIFY_DUMP"
          # One-second process samples (CPU, scheduler priority) so an
          # environment failure can be attributed.
          (while sleep 1; do
            date -u +%H:%M:%S
            ps -A -o pid,pri,%cpu,comm -r | head -14
            for p in $(pgrep -f cap-verify-stimulus | head -1) $(pgrep -f 'deps/recording-' | head -1); do
              ps -M -p "$p" | awk 'NR == 1 || $4 > 0.5 || NR < 4' | cut -c1-90
            done
          done) > "$CAP_VERIFY_DUMP/ps.log" 2>&1 &
          top_pid=$!
          start=$(date +%s)
          set +e
          cargo test --locked -p cap-verify --test recording -- --nocapture
          status=$?
          set -e
          kill "$top_pid" || true
          echo "test seconds: $(( $(date +%s) - start ))"
          exit "$status"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-recording-${{ matrix.runner }}
          path: |
            ${{ github.workspace }}/verify-report
            ${{ github.workspace }}/verify-dump
            ${{ github.workspace }}/verify-scratch
          if-no-files-found: ignore

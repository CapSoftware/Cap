name: Scratch upgrade regression from released Cap (temporary)

on:
  push:
    branches: [ci/bm-regress]

permissions:
  contents: read

concurrency:
  group: bm-regress
  cancel-in-progress: true

env:
  BASE_SHA: 031ad14ec6f3024a193d95c517d06210d9368c92
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  releases:
    name: Fetch released installers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .bm
      - run: bash .bm/fetch.sh "$RUNNER_TEMP/releases"
      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: ${{ runner.temp }}/releases
          retention-days: 3

  build:
    name: Build ${{ matrix.os }} ${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, tag: base, runner: blacksmith-8vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
          - { os: linux, tag: head, runner: blacksmith-8vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
          - { os: windows, tag: base, runner: blacksmith-8vcpu-windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows, tag: head, runner: blacksmith-8vcpu-windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos, tag: base, runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin }
          - { os: macos, tag: head, runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag == 'base' && env.BASE_SHA || github.sha }}
          persist-credentials: false
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}
          prefix-key: v1-rust-bm-release-${{ matrix.tag }}
          save-cache: "true"
          workspaces: apps/desktop-gpui -> target
      - shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
      - shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - shell: bash
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --target ${{ matrix.target }} --bin cap-gpui
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage/${{ matrix.tag }}"
          mkdir -p "$stage/resources/assets"
          bin=apps/desktop-gpui/target/${{ matrix.target }}/release/cap-gpui
          cp -R apps/desktop-gpui/assets/backgrounds "$stage/resources/assets/"
          cp -R apps/desktop-gpui/assets/music "$stage/resources/assets/" || true
          case "${{ matrix.os }}" in
            linux)
              cp "$bin" "$stage/cap-gpui"
              mkdir -p "$stage/libs" && cp -a target/native-deps/lib/. "$stage/libs/"
              ;;
            macos)
              cp "$bin" "$stage/cap-gpui"
              mkdir -p "$stage/Frameworks"
              cp -R target/Frameworks/Spacedrive.framework "$stage/Frameworks/"
              ;;
            windows)
              cp "$bin.exe" "$stage/cap-gpui.exe"
              mkdir -p "$stage/gpui-windows-shaders"
              cp ../zed-cap/crates/gpui_windows/src/*.hlsl "$stage/gpui-windows-shaders/"
              cp target/ffmpeg/bin/*.dll "$stage/" 2>/dev/null || true
              cp target/native-deps/dxc/*.dll "$stage/" 2>/dev/null || true
              printf '%s' "$GITHUB_WORKSPACE" > "$stage/build-workspace.txt"
              printf '%s' "$(cd ../zed-cap && pwd -W)" > "$stage/build-zed.txt"
              ;;
          esac
          git rev-parse HEAD > "$stage/sha.txt"
          cd "$RUNNER_TEMP/stage" && tar -cf "../app-${{ matrix.os }}-${{ matrix.tag }}.tar" "${{ matrix.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/app-${{ matrix.os }}-${{ matrix.tag }}.tar
          retention-days: 3

  build-old:
    name: Build ${{ matrix.os }} ${{ matrix.ver }} from its tag
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        ver: ["0.6.1", "0.6.2"]
        include:
          - { os: linux, runner: blacksmith-8vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
          - { os: windows, runner: blacksmith-8vcpu-windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos, runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cap-v${{ matrix.ver }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup from the 0.6.4 gate (ONNX Runtime from NuGet; GitHub archives are gone)
        shell: bash
        run: |
          git fetch -q origin 62a826479204f6aaf8d18b7767f3382ad2384401
          git show 62a826479204f6aaf8d18b7767f3382ad2384401:scripts/setup.js > scripts/setup.js
          git show 62a826479204f6aaf8d18b7767f3382ad2384401:scripts/linux-bundle-config.mjs > scripts/linux-bundle-config.mjs
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}
          prefix-key: v1-rust-bm-release-${{ matrix.ver }}
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
      - shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - shell: bash
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --target ${{ matrix.target }} --bin cap-gpui
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          tag=old
          stage="$RUNNER_TEMP/stage/$tag"
          mkdir -p "$stage/resources/assets"
          bin=apps/desktop-gpui/target/${{ matrix.target }}/release/cap-gpui
          cp -R apps/desktop-gpui/assets/backgrounds "$stage/resources/assets/"
          case "${{ matrix.os }}" in
            linux) cp "$bin" "$stage/cap-gpui"; mkdir -p "$stage/libs" && cp -a target/native-deps/lib/. "$stage/libs/" ;;
            macos) cp "$bin" "$stage/cap-gpui"; mkdir -p "$stage/Frameworks"; cp -R target/Frameworks/Spacedrive.framework "$stage/Frameworks/" ;;
            windows)
              cp "$bin.exe" "$stage/cap-gpui.exe"
              mkdir -p "$stage/gpui-windows-shaders"
              cp ../zed-cap/crates/gpui_windows/src/*.hlsl "$stage/gpui-windows-shaders/"
              cp target/ffmpeg/bin/*.dll "$stage/" 2>/dev/null || true
              cp target/native-deps/dxc/*.dll "$stage/" 2>/dev/null || true
              printf '%s' "$GITHUB_WORKSPACE" > "$stage/build-workspace.txt"
              printf '%s' "$(cd ../zed-cap && pwd -W)" > "$stage/build-zed.txt"
              ;;
          esac
          git rev-parse HEAD > "$stage/sha.txt"
          cd "$RUNNER_TEMP/stage" && tar -cf "../old-${{ matrix.os }}-${{ matrix.ver }}.tar" "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: old-${{ matrix.os }}-${{ matrix.ver }}
          path: ${{ runner.temp }}/old-${{ matrix.os }}-${{ matrix.ver }}.tar
          retention-days: 3

  linux:
    name: Upgrade on Linux
    needs: [releases, build]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-desktop-deps
      - run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils xdotool imagemagick dbus \
            pulseaudio pulseaudio-utils ffmpeg python3-psutil openbox > /dev/null
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - name: Unpack and install
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apps"
          for t in base head; do tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/dl/app-linux-$t/app-linux-$t.tar"; done
          sudo apt-get install -y -qq "$RUNNER_TEMP/dl/releases/latest-linux.deb" > /dev/null
          dpkg -l | grep -i ' cap ' || true
          old=$(dpkg -L cap 2>/dev/null | grep -E '/bin/[^/]+$' | head -1)
          echo "OLD_BIN=$old" >> "$GITHUB_ENV"
          echo "old binary: $old"; ls -la "$old"
          cat "$RUNNER_TEMP"/apps/*/sha.txt
      - name: Run the upgrade flow
        run: |
          export DISPLAY=:79 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 >/dev/null 2>&1 &
          sleep 1
          openbox >/dev/null 2>&1 &
          pulse_dir=$(mktemp -d)
          export PULSE_SERVER=unix:$pulse_dir/native
          pulseaudio -n --daemonize=no --exit-idle-time=-1 \
            -L "module-native-protocol-unix socket=$pulse_dir/native auth-anonymous=1" \
            -L "module-null-sink sink_name=bm_out" \
            -L "module-remap-source master=bm_out.monitor source_name=bm_mic" >/dev/null 2>&1 &
          sleep 2
          pactl set-default-sink bm_out || true
          pactl set-default-source bm_mic || true
          A="$RUNNER_TEMP/apps"
          dbus-run-session -- python3 .bm/bm.py --old "$OLD_BIN" \
            --base "$A/base/cap-gpui" --base-libs "$A/base/libs" \
            --head "$A/head/cap-gpui" --head-libs "$A/head/libs" \
            --out "$RUNNER_TEMP/bm" --rounds 3 --idle 40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-linux
          path: |
            ${{ runner.temp }}/bm/summary.*
            ${{ runner.temp }}/bm/snap-old.json
            ${{ runner.temp }}/bm/runs/**/app.log
            ${{ runner.temp }}/bm/runs/**/result.json
            ${{ runner.temp }}/bm/runs/**/*.png
            ${{ runner.temp }}/bm/exports/**
          retention-days: 7

  windows:
    name: Upgrade on Windows
    needs: [releases, build]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - name: Unpack, put the build paths back, install the release
        shell: pwsh
        run: |
          $apps = "$env:RUNNER_TEMP\apps"
          New-Item -ItemType Directory -Force $apps | Out-Null
          foreach ($t in 'base','head') { tar -C $apps -xf "$env:RUNNER_TEMP\dl\app-windows-$t\app-windows-$t.tar" }
          foreach ($t in 'base','head') {
            $app = "$apps\$t"
            $workspace = (Get-Content "$app\build-workspace.txt" -Raw).Trim()
            if ($workspace -ne $env:GITHUB_WORKSPACE -and -not (Test-Path $workspace)) {
              New-Item -ItemType Directory -Force (Split-Path $workspace) | Out-Null
              cmd /c mklink /J "$workspace" "$env:GITHUB_WORKSPACE"
            }
            $shaders = Join-Path (Get-Content "$app\build-zed.txt" -Raw).Trim() "crates\gpui_windows\src"
            New-Item -ItemType Directory -Force $shaders | Out-Null
            Copy-Item "$app\gpui-windows-shaders\*.hlsl" $shaders -Force
            Get-Content "$app\sha.txt"
          }
          $b = Get-FileHash "$apps\base\gpui-windows-shaders\*.hlsl" | ForEach-Object Hash
          $h = Get-FileHash "$apps\head\gpui-windows-shaders\*.hlsl" | ForEach-Object Hash
          if (Compare-Object $b $h) { Write-Host "::warning::base and head shaders differ" } else { Write-Host "shaders identical" }
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\dl\releases\latest-win.exe" -ArgumentList '/S'
          $old = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'Cap.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "old: $($old.FullName) $($old.VersionInfo.ProductVersion)"
          "OLD_BIN=$($old.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          python -m pip install -q psutil
      - name: Run the upgrade flow
        shell: pwsh
        run: |
          $env:Path = "$env:ProgramData\chocolatey\bin;$env:Path"
          $a = "$env:RUNNER_TEMP\apps"
          python .bm/bm.py --old "$env:OLD_BIN" --base "$a\base\cap-gpui.exe" --head "$a\head\cap-gpui.exe" --out "$env:RUNNER_TEMP\bm" --rounds 3 --idle 40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-windows
          path: |
            ${{ runner.temp }}/bm/summary.*
            ${{ runner.temp }}/bm/snap-old.json
            ${{ runner.temp }}/bm/runs/**/app.log
            ${{ runner.temp }}/bm/runs/**/result.json
            ${{ runner.temp }}/bm/runs/**/*.png
            ${{ runner.temp }}/bm/exports/**
          retention-days: 7

  macos:
    name: Upgrade on macOS
    needs: [releases, build]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - name: Unpack and mount the release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apps" "$RUNNER_TEMP/old"
          for t in base head; do tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/dl/app-macos-$t/app-macos-$t.tar"; cat "$RUNNER_TEMP/apps/$t/sha.txt"; done
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/dl/releases/latest-mac.dmg"
          app=$(find "$RUNNER_TEMP/dmg" -maxdepth 1 -name '*.app' | head -1)
          cp -R "$app" "$RUNNER_TEMP/old/"
          hdiutil detach "$RUNNER_TEMP/dmg" || true
          name=$(basename "$app")
          bin=$(find "$RUNNER_TEMP/old/$name/Contents/MacOS" -type f -perm +111 | head -1)
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/old/$name/Contents/Info.plist"
          echo "OLD_BIN=$bin" >> "$GITHUB_ENV"
      - run: |
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q psutil
          command -v ffmpeg || HOMEBREW_NO_AUTO_UPDATE=1 brew install -q ffmpeg
      - name: Run the upgrade flow
        run: |
          A="$RUNNER_TEMP/apps"
          "$RUNNER_TEMP/venv/bin/python" .bm/bm.py --old "$OLD_BIN" --base "$A/base/cap-gpui" --head "$A/head/cap-gpui" \
            --out "$RUNNER_TEMP/bm" --rounds 3 --idle 40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-macos
          path: |
            ${{ runner.temp }}/bm/summary.*
            ${{ runner.temp }}/bm/snap-old.json
            ${{ runner.temp }}/bm/runs/**/app.log
            ${{ runner.temp }}/bm/runs/**/result.json
            ${{ runner.temp }}/bm/runs/**/*.png
            ${{ runner.temp }}/bm/exports/**
          retention-days: 7

  web:
    name: Server parity and real uploads (Linux)
    needs: [releases, build]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-desktop-deps
      - run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils dbus pulseaudio pulseaudio-utils ffmpeg \
            python3-psutil mysql-client > /dev/null
      - uses: ./.github/actions/setup-js
      - name: Base web checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base" && bun install --frozen-lockfile > /dev/null
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - name: Desktop apps
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          for t in base head; do tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/dl/app-linux-$t/app-linux-$t.tar"; done
          sudo apt-get install -y -qq "$RUNNER_TEMP/dl/releases/latest-linux.deb" > /dev/null
          echo "OLD_BIN=$(dpkg -L cap | grep -E '/bin/[^/]+$' | head -1)" >> "$GITHUB_ENV"
      - name: Server parity, deploy window and real desktop uploads
        run: bash .bm/web.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-web
          path: ${{ runner.temp }}/web
          retention-days: 7

  upgrade-old:
    name: Upgrade from ${{ matrix.ver }} on ${{ matrix.os }}
    needs: [build, build-old]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        ver: ["0.6.1", "0.6.2"]
        include:
          - { os: linux, runner: blacksmith-8vcpu-ubuntu-2404 }
          - { os: windows, runner: windows-2022 }
          - { os: macos, runner: blacksmith-6vcpu-macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-desktop-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: app-${{ matrix.os }}-*
          path: ${{ runner.temp }}/dl
      - uses: actions/download-artifact@v4
        with:
          name: old-${{ matrix.os }}-${{ matrix.ver }}
          path: ${{ runner.temp }}/dl
      - name: Unpack
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/apps"; mkdir -p "$A"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            find "$RUNNER_TEMP/dl" -name '*.tar' -exec tar --force-local -C "$A" -xf {} \;
          else
            find "$RUNNER_TEMP/dl" -name '*.tar' -exec tar -C "$A" -xf {} \;
          fi
          cat "$A"/*/sha.txt
      - if: matrix.os == 'windows'
        shell: pwsh
        run: |
          foreach ($t in 'old','base','head') {
            $app = "$env:RUNNER_TEMP\apps\$t"
            $workspace = (Get-Content "$app\build-workspace.txt" -Raw).Trim()
            if ($workspace -ne $env:GITHUB_WORKSPACE -and -not (Test-Path $workspace)) {
              New-Item -ItemType Directory -Force (Split-Path $workspace) | Out-Null
              cmd /c mklink /J "$workspace" "$env:GITHUB_WORKSPACE"
            }
            $shaders = Join-Path (Get-Content "$app\build-zed.txt" -Raw).Trim() "crates\gpui_windows\src"
            New-Item -ItemType Directory -Force $shaders | Out-Null
            Copy-Item "$app\gpui-windows-shaders\*.hlsl" $shaders -Force
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          python -m pip install -q psutil
          $env:Path = "$env:ProgramData\chocolatey\bin;$env:Path"
          $a = "$env:RUNNER_TEMP\apps"
          python .bm/bm.py --old "$a\old\cap-gpui.exe" --base "$a\base\cap-gpui.exe" --head "$a\head\cap-gpui.exe" --out "$env:RUNNER_TEMP\bm" --rounds 0
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils dbus pulseaudio pulseaudio-utils ffmpeg python3-psutil openbox > /dev/null
          export DISPLAY=:79 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          Xvfb "$DISPLAY" -screen 0 1920x1080x24 >/dev/null 2>&1 &
          sleep 1
          openbox >/dev/null 2>&1 &
          pulse_dir=$(mktemp -d)
          export PULSE_SERVER=unix:$pulse_dir/native
          pulseaudio -n --daemonize=no --exit-idle-time=-1 \
            -L "module-native-protocol-unix socket=$pulse_dir/native auth-anonymous=1" \
            -L "module-null-sink sink_name=bm_out" >/dev/null 2>&1 &
          sleep 2
          A="$RUNNER_TEMP/apps"
          dbus-run-session -- python3 .bm/bm.py --old "$A/old/cap-gpui" --old-libs "$A/old/libs" \
            --base "$A/base/cap-gpui" --base-libs "$A/base/libs" --head "$A/head/cap-gpui" --head-libs "$A/head/libs" \
            --out "$RUNNER_TEMP/bm" --rounds 0
      - if: matrix.os == 'macos'
        run: |
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q psutil
          command -v ffmpeg || HOMEBREW_NO_AUTO_UPDATE=1 brew install -q ffmpeg
          A="$RUNNER_TEMP/apps"
          "$RUNNER_TEMP/venv/bin/python" .bm/bm.py --old "$A/old/cap-gpui" --base "$A/base/cap-gpui" --head "$A/head/cap-gpui" \
            --out "$RUNNER_TEMP/bm" --rounds 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-${{ matrix.os }}-from-${{ matrix.ver }}
          path: |
            ${{ runner.temp }}/bm/summary.*
            ${{ runner.temp }}/bm/snap-old.json
            ${{ runner.temp }}/bm/runs/**/app.log
            ${{ runner.temp }}/bm/runs/**/result.json
            ${{ runner.temp }}/bm/runs/**/*.png
          retention-days: 7

  pixels:
    name: macOS text rendering, base vs head, light and dark
    needs: build
    if: ${{ !cancelled() }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: app-macos-*
          path: ${{ runner.temp }}/dl
      - run: |
          A="$RUNNER_TEMP/apps"; mkdir -p "$A"
          find "$RUNNER_TEMP/dl" -name '*.tar' -exec tar -C "$A" -xf {} \;
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q psutil pillow
          "$RUNNER_TEMP/venv/bin/python" .bm/bm.py --mode pixels --base "$A/base/cap-gpui" --head "$A/head/cap-gpui" --out "$RUNNER_TEMP/px"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-pixels
          path: |
            ${{ runner.temp }}/px/summary.*
            ${{ runner.temp }}/px/pixels/*.png
            ${{ runner.temp }}/px/runs/**/app.log
          retention-days: 7

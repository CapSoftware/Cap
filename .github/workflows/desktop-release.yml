name: desktop-release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      sha:
        required: true
        type: string
      auto_publish:
        required: false
        type: boolean
        default: false
      interactionId:
        required: false
        type: string
        default: ""

concurrency:
  group: desktop-release-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  SENTRY_ORG: cap-s2
  SENTRY_PROJECT: cap-desktop

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      staging_tag: ${{ steps.release.outputs.staging_tag }}
      staging_release_id: ${{ steps.release.outputs.staging_release_id }}
    permissions:
      contents: write
    steps:
      - name: Prepare immutable release staging draft
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const channel = process.env.RELEASE_CHANNEL;
            const sha = process.env.RELEASE_SHA;
            const version = process.env.RELEASE_VERSION;
            if (!/^[0-9a-f]{40}$/.test(sha))
              throw new Error(`Invalid release SHA '${sha}'`);
            const versionPattern = channel === "nightly"
              ? /^\d+\.\d+\.\d+-nightly\.\d{12}$/
              : channel === "stable"
                ? /^\d+\.\d+\.\d+$/
                : null;
            if (!versionPattern || !versionPattern.test(version))
              throw new Error(`Invalid ${channel} release version '${version}'`);

            const tag = channel === "nightly"
              ? `cap-nightly-v${version}`
              : `cap-v${version}`;
            const stagingTag = `${tag}-staging-${sha}`;
            const tagRef = `tags/${tag}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            try {
              const existingTag = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: tagRef,
              });
              if (existingTag.data.object.sha !== sha) {
                throw new Error(
                  `Tag '${tag}' already points to ${existingTag.data.object.sha}; refusing to move it to ${sha}`,
                );
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const existingRelease = releases.find(
              (release) => release.tag_name === tag,
            );
            if (existingRelease) {
              throw new Error(
                `Release '${tag}' already exists (${existingRelease.draft ? "draft" : "published"}): ${existingRelease.html_url}`,
              );
            }

            let stagingRelease = releases.find(
              (release) => release.tag_name === stagingTag,
            );

            if (stagingRelease) {
              if (!stagingRelease.draft) {
                throw new Error(
                  `Staging release '${stagingTag}' is published; refusing to mutate it`,
                );
              }
              if (stagingRelease.target_commitish !== sha) {
                throw new Error(
                  `Staging release '${stagingTag}' targets ${stagingRelease.target_commitish}; expected ${sha}`,
                );
              }
              for (const asset of await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: stagingRelease.id,
                  per_page: 100,
                },
              )) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
              stagingRelease = (await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: stagingRelease.id,
                target_commitish: sha,
                name: version,
                draft: true,
                prerelease: channel === "nightly",
              })).data;
            } else {
              stagingRelease = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: stagingTag,
                target_commitish: sha,
                name: version,
                draft: true,
                prerelease: channel === "nightly",
                generate_release_notes: true,
              })).data;
            }
            core.setOutput("tag_name", tag);
            core.setOutput("staging_tag", stagingTag);
            core.setOutput("staging_release_id", stagingRelease.id);

  build:
    needs: draft
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            runner: macos-latest-xlarge
            builder_args: --mac --x64
          - target: aarch64-apple-darwin
            runner: macos-latest-xlarge
            builder_args: --mac --arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            builder_args: --win --x64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            builder_args: --linux deb --x64
    runs-on: ${{ matrix.settings.runner }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Stamp Electron version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/package.json";
            const json = JSON.parse(fs.readFileSync(path, "utf8"));
            json.version = process.env.BUILD_VERSION;
            fs.writeFileSync(path, JSON.stringify(json, null, "\t") + "\n");
          '

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-desktop-deps

      - name: Import macOS signing certificate
        if: ${{ runner.os == 'macOS' }}
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write Apple notarization key
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY_FILE }}" > "$RUNNER_TEMP/AuthKey.p8"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.settings.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.settings.target }}

      - uses: ./.github/actions/setup-js

      - name: Create build environment
        shell: bash
        run: |
          {
            echo "appVersion=${{ inputs.version }}"
            echo "VITE_ENVIRONMENT=production"
            echo "CAP_DESKTOP_SENTRY_URL=https://6a3b6a09e6ae976c2ad6fff710e88748@o4506859771527168.ingest.us.sentry.io/4508330917101568"
            echo "NEXT_PUBLIC_WEB_URL=${{ secrets.NEXT_PUBLIC_WEB_URL }}"
            echo 'NEXTAUTH_URL=${{ secrets.NEXT_PUBLIC_WEB_URL }}'
            echo 'VITE_OPENPANEL_CLIENT_ID=${{ secrets.VITE_OPENPANEL_CLIENT_ID }}'
            echo 'VITE_OPENPANEL_API_URL=${{ secrets.VITE_OPENPANEL_API_URL }}'
            echo 'VITE_SERVER_URL=${{ secrets.NEXT_PUBLIC_WEB_URL }}'
            echo 'RUST_TARGET_TRIPLE=${{ matrix.settings.target }}'
          } >> .env

      - name: Prepare native dependencies
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.settings.target }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}

      - name: Increase Linux swap
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo fallocate -l 16G /mnt/electron-swapfile
          sudo chmod 600 /mnt/electron-swapfile
          sudo mkswap /mnt/electron-swapfile
          sudo swapon /mnt/electron-swapfile

      - name: Increase Windows pagefile
        if: ${{ runner.os == 'Windows' }}
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Build Rust backend and sidecars
        shell: bash
        run: ./scripts/build-desktop-binaries.sh ${{ matrix.settings.target }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Linux' && '0' || '' }}

      - name: Build renderer and Electron distributable
        working-directory: apps/desktop
        shell: bash
        run: |
          pnpm run preparescript
          pnpm build
          pnpm build:electron-main
          pnpm exec electron-builder ${{ matrix.settings.builder_args }} --publish never
        env:
          CI: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET_TRIPLE: ${{ matrix.settings.target }}
          CSC_NAME: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify packaged application
        shell: bash
        run: |
          test -s apps/desktop/.output/public/index.html
          test -n "$(find apps/desktop/dist-electron -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' \) -print -quit)"
          test -n "$(find apps/desktop/dist-electron -type f -name 'cap-desktop-*' -print -quit)"

      - name: Upload unsigned Windows installer
        if: ${{ runner.os == 'Windows' }}
        id: unsigned_windows
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: apps/desktop/dist-electron/*.exe
          if-no-files-found: error

      - name: Sign Windows installer with SignPath
        if: ${{ runner.os == 'Windows' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          service-unavailable-timeout-in-seconds: 14400
          output-artifact-directory: signed-windows-installer

      - name: Restore signed Windows installer
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-windows-installer -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $signed) { throw "No signed installer returned by SignPath" }
          $destination = Get-ChildItem apps/desktop/dist-electron -Filter *.exe | Select-Object -First 1
          Copy-Item $signed.FullName $destination.FullName -Force

      # SignPath mutates the installer after electron-builder has produced the
      # updater manifest. Recalculate the full-download metadata and remove the
      # now-stale differential blockmap before publishing the signed artifact.
      - name: Refresh Windows updater metadata
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $dist = Resolve-Path "apps/desktop/dist-electron"
          $installer = Get-ChildItem $dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "No signed installer found in $dist" }

          $sha512 = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::HashData(
              [IO.File]::ReadAllBytes($installer.FullName)
            )
          )
          $size = $installer.Length
          $manifests = Get-ChildItem $dist -Filter *.yml
          if (-not $manifests) { throw "No Electron updater manifest found in $dist" }

          foreach ($manifest in $manifests) {
            $contents = Get-Content $manifest.FullName -Raw
            $contents = $contents -replace '(?m)^(\s*)sha512:.*$', "`$1sha512: $sha512"
            $contents = $contents -replace '(?m)^(\s*)size:.*$', "`$1size: $size"
            $contents = $contents -replace '(?m)^\s*blockMapSize:.*\r?\n?', ''
            [IO.File]::WriteAllText($manifest.FullName, $contents)
          }

          Get-ChildItem $dist -Filter *.blockmap | Remove-Item -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.settings.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.yml

      - uses: matbour/setup-sentry-cli@8ef22a4ff03bcd1ebbcaa3a36a81482ca8e3872e

      - name: Upload Rust debug symbols to Sentry
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            dsymutil "target/${{ matrix.settings.target }}/release/cap-desktop" -o target/cap-desktop.dSYM
            sentry-cli debug-files upload -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" target/cap-desktop.dSYM
          else
            sentry-cli debug-files upload -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" "target/${{ matrix.settings.target }}/release/cap_desktop.pdb"
          fi

  done:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/setup-js

      - name: Download staged platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: staged-release-assets

      - name: Assemble release assets
        run: node scripts/prepare-electron-release-assets.mjs staged-release-assets release-assets

      - name: Upload complete staging release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.draft.outputs.staging_tag }}
          draft: true
          prerelease: ${{ inputs.channel == 'nightly' }}
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Promote complete staging release
        id: promote
        uses: actions/github-script@v7
        env:
          AUTO_PUBLISH: ${{ inputs.auto_publish }}
          FINAL_TAG: ${{ needs.draft.outputs.tag_name }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          STAGING_RELEASE_ID: ${{ needs.draft.outputs.staging_release_id }}
          STAGING_TAG: ${{ needs.draft.outputs.staging_tag }}
        with:
          script: |
            const path = require("node:path");
            const releaseId = Number(process.env.STAGING_RELEASE_ID);
            const requireUnpublishedStagingRelease = async () => {
              const release = (await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
              })).data;
              if (!release.draft || release.tag_name !== process.env.STAGING_TAG) {
                throw new Error(
                  `Staging release '${process.env.STAGING_TAG}' is no longer an unpublished draft`,
                );
              }
              return release;
            };
            await requireUnpublishedStagingRelease();

            const globber = await glob.create("release-assets/*");
            const expectedAssets = [];
            for await (const file of globber.globGenerator()) {
              expectedAssets.push(path.basename(file));
            }
            expectedAssets.sort();
            const uploadedAssetRecords = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100,
              },
            );
            const incompleteAsset = uploadedAssetRecords.find(
              (asset) => asset.state !== "uploaded" || asset.size <= 0,
            );
            if (incompleteAsset) {
              throw new Error(
                `Staging asset '${incompleteAsset.name}' is not completely uploaded`,
              );
            }
            const uploadedAssets = uploadedAssetRecords
              .map((asset) => asset.name)
              .sort();
            if (JSON.stringify(uploadedAssets) !== JSON.stringify(expectedAssets)) {
              throw new Error(
                `Staging release assets do not match the assembled set: expected ${expectedAssets.join(", ")}; got ${uploadedAssets.join(", ")}`,
              );
            }

            const existingRelease = (await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            )).find((release) => release.tag_name === process.env.FINAL_TAG);
            if (existingRelease) {
              throw new Error(
                `Final release '${process.env.FINAL_TAG}' already exists: ${existingRelease.html_url}`,
              );
            }

            try {
              const existingTag = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.FINAL_TAG}`,
              });
              if (existingTag.data.object.sha !== process.env.RELEASE_SHA) {
                throw new Error(
                  `Final tag '${process.env.FINAL_TAG}' points to ${existingTag.data.object.sha}; expected ${process.env.RELEASE_SHA}`,
                );
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Keep this guard adjacent to the mutation. The validations above may
            // take long enough for an operator to publish the staging release.
            await requireUnpublishedStagingRelease();
            const release = (await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              tag_name: process.env.FINAL_TAG,
              target_commitish: process.env.RELEASE_SHA,
              name: process.env.RELEASE_VERSION,
              draft: process.env.AUTO_PUBLISH !== "true",
              prerelease: process.env.RELEASE_CHANNEL === "nightly",
            })).data;
            const finalTag = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.FINAL_TAG}`,
            });
            if (finalTag.data.object.sha !== process.env.RELEASE_SHA) {
              throw new Error(
                `Promoted tag '${process.env.FINAL_TAG}' points to ${finalTag.data.object.sha}; expected ${process.env.RELEASE_SHA}`,
              );
            }
            core.setOutput("release_url", release.html_url);

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.STAGING_TAG}`,
              });
            } catch (error) {
              core.warning(
                `Final release is complete, but staging tag cleanup failed: ${error.message}`,
              );
            }

      - name: Notify Discord that the stable draft is ready
        if: ${{ inputs.channel == 'stable' && inputs.interactionId != '' }}
        uses: actions/github-script@v7
        env:
          INTERACTION_ID: ${{ inputs.interactionId }}
          RELEASE_URL: ${{ steps.promote.outputs.release_url }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const token = await core.getIDToken("cap-discord-bot");
            const response = await fetch("https://cap-discord-bot.brendonovich.workers.dev/github-workflow", {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({
                type: "release-done",
                interactionId: process.env.INTERACTION_ID,
                version: process.env.RELEASE_VERSION,
                releaseUrl: process.env.RELEASE_URL,
              }),
            });
            if (!response.ok) throw new Error(await response.text());

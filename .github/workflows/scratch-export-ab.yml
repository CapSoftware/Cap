name: Scratch export A/B

# Frame-identity A/B for a PR that touches rendering: build the `cap` CLI at
# the PR head and at its merge base, export every Engine verify export
# fixture with both at the same settings, and compare per-frame hashes.
# Runs only on pushes to this scratch branch.
on:
  push:
    branches: [ci/export-ab]

jobs:
  ab:
    name: export A/B (#${{ matrix.pr }})
    strategy:
      fail-fast: false
      matrix:
        pr: [2682]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    env:
      CAP_VERIFY_FIXTURE_DIR: ${{ github.workspace }}/fixtures
    steps:
      - name: Keep the session unlocked
        run: |
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          sudo mdutil -a -i off || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refs
        run: |
          git fetch -q origin "+refs/pull/${{ matrix.pr }}/head:refs/remotes/pr/head"
          base=$(git merge-base origin/main refs/remotes/pr/head)
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse refs/remotes/pr/head)" >> "$GITHUB_ENV"
          echo "base $base, head $(git rev-parse refs/remotes/pr/head)"
          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
          git worktree add -q --detach "$RUNNER_TEMP/head" refs/remotes/pr/head

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin
          prefix-key: v1-rust-export-ab
          save-cache: "true"

      - uses: ./.github/actions/install-desktop-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Native dependencies
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          node scripts/setup.js
          cat .cargo/config.toml
          for side in base head; do
            mkdir -p "$RUNNER_TEMP/$side/.cargo"
            cp .cargo/config.toml "$RUNNER_TEMP/$side/.cargo/config.toml"
          done

      - name: Build both sides
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for side in base head; do
            (cd "$RUNNER_TEMP/$side" && cargo build --locked -p cap --profile abperf \
              --config 'profile.abperf.inherits="release"' \
              --config 'profile.abperf.lto=false' \
              --config 'profile.abperf.codegen-units=16' \
              --config 'profile.abperf.debug=0')
            cp "$CARGO_TARGET_DIR/abperf/cap" "$RUNNER_TEMP/bin/cap-$side"
          done
          ls -la "$RUNNER_TEMP/bin"

      - name: Fixtures (generated by the base's export suite)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CAP_VERIFY_TIER: fast
          CAP_VERIFY_CASE: "export/*/fast/mp4*/ffmpeg"
        run: |
          set +e
          (cd "$RUNNER_TEMP/base" && cargo test --locked -p cap-verify --test export -- --nocapture) > fixtures.log 2>&1
          echo "export suite exit $?"
          tail -5 fixtures.log
          find "$CAP_VERIFY_FIXTURE_DIR" -maxdepth 1 -name "*.cap" | sort | tee fixtures.txt
          test -s fixtures.txt

      - name: Export with both and compare
        run: |
          set +e
          mkdir -p ab
          frameworks="$RUNNER_TEMP/Frameworks"
          ln -sfn "$GITHUB_WORKSPACE/target/native-deps" "$frameworks"
          same=0; diff=0; failed=0
          while read -r fx; do
            name=$(basename "$fx" .cap)
            for res in 1920x1080 1080x1920; do
              for side in base head; do
                rm -rf "$RUNNER_TEMP/work.cap"; cp -R "$fx" "$RUNNER_TEMP/work.cap"
                "$RUNNER_TEMP/bin/cap-$side" export "$RUNNER_TEMP/work.cap" --output "ab/$name-$res-$side.mp4" --resolution "$res" --fps 30 > "ab/$name-$res-$side.log" 2>&1
                ffmpeg -v error -i "ab/$name-$res-$side.mp4" -map 0:v -f framemd5 "ab/$name-$res-$side.md5" 2>/dev/null
                rm -f "ab/$name-$res-$side.mp4"
              done
              if [ ! -s "ab/$name-$res-base.md5" ] || [ ! -s "ab/$name-$res-head.md5" ]; then
                echo "FAILED $name $res (see logs)"; failed=$((failed+1)); continue
              fi
              if diff -q <(grep -v '^#' "ab/$name-$res-base.md5") <(grep -v '^#' "ab/$name-$res-head.md5") > /dev/null; then
                echo "same   $name $res ($(grep -vc '^#' "ab/$name-$res-base.md5") frames)"; same=$((same+1))
              else
                n=$(diff <(grep -v '^#' "ab/$name-$res-base.md5") <(grep -v '^#' "ab/$name-$res-head.md5") | grep -c '^<')
                echo "DIFF   $name $res ($n frames differ)"; diff=$((diff+1))
              fi
            done
          done < fixtures.txt
          echo "same=$same diff=$diff failed=$failed" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-ab-${{ matrix.pr }}
          path: |
            ab/*.md5
            ab/*.log
            fixtures.log
          if-no-files-found: ignore

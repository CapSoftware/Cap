name: winobs probe build

on:
  push:
    branches: ["ci/winobs-probe"]

permissions:
  contents: read

jobs:
  cli:
    name: cli ${{ matrix.os.slug }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - slug: windows
            runner: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 150
    env:
      TARGET: ${{ matrix.os.target }}
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.os.target }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.os.target }}
          prefix-key: v1-rust-release
          save-cache: "false"
          workspaces: ". -> target"
      - name: Native deps
        shell: bash
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.os.target }}
        run: env -u PSModulePath node scripts/setup.js
      - name: Build capture probe
        shell: bash
        run: |
          set -euo pipefail
          cd tools/wgcprobe
          cargo build --release --target "$TARGET"
          mkdir -p "$RUNNER_TEMP/pkg/bin"
          cp "target/$TARGET/release/wgcprobe.exe" "$RUNNER_TEMP/pkg/bin/"
      - name: Build release CLI and muxer (release profile, as desktop-release.yml)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build --release -p cap-muxer --target "$TARGET"
          cargo build --release -p cap --target "$TARGET"
          echo "build seconds $(( $(date +%s) - start ))"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg/bin"
          rel="target/$TARGET/release"
          git rev-parse HEAD > "$pkg/commit.txt"
          case "$RUNNER_OS" in
            macOS)
              cp "$rel/cap" "$rel/cap-muxer" "$pkg/bin/"
              mkdir -p "$pkg/Frameworks"
              cp -RL target/Frameworks/Spacedrive.framework "$pkg/Frameworks/Spacedrive.framework"
              otool -L "$pkg/bin/cap" > "$pkg/info.txt"
              ;;
            Windows)
              cp "$rel/cap.exe" "$rel/cap-muxer.exe" "$pkg/bin/"
              for d in target/ffmpeg/bin target/native-deps/dxc target/native-deps/onnxruntime/lib target/native-deps/vcruntime "$rel"; do
                if [ -d "$d" ]; then find "$d" -maxdepth 1 -iname '*.dll' -exec cp {} "$pkg/bin/" \; ; fi
              done
              ls -la "$pkg/bin" > "$pkg/info.txt"
              ;;
            Linux)
              cp "$rel/cap" "$rel/cap-muxer" "$pkg/bin/"
              mkdir -p "$pkg/lib"
              cp -a target/native-deps/lib/. "$pkg/lib/"
              LD_LIBRARY_PATH="$pkg/lib" ldd "$pkg/bin/cap" > "$pkg/info.txt" || true
              ;;
          esac
          cat "$pkg/info.txt" | head -60
          (cd "$pkg" && tar -czf "../cli-${{ matrix.os.slug }}.tgz" .)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os.slug }}
          path: ${{ runner.temp }}/cli-${{ matrix.os.slug }}.tgz
          retention-days: 5

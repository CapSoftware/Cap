name: CI
run-name: Recording failure and Linux launcher tests 290dafcbe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recording-component-290dafcbe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-oop:
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      REVIEWED_SOURCE_SHA: 290dafcbee05998bca4d825c054fb8ff3ea6c4af
      CARGO_TARGET_DIR: ${{ github.workspace }}/Cap/target
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 290dafcbee05998bca4d825c054fb8ff3ea6c4af
          path: Cap
          persist-credentials: false
      - name: Rust setup
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - name: Restore dependency cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: "false"
          shared-key: aarch64-apple-darwin
          workspaces: "Cap -> target"
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Prepare reviewed bounded helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve() / 'probe'
          root.mkdir(mode=0o700)
          files = json.loads('{"Cargo.toml":{"sha256":"2d7af13873c71e6dedf7f4da1cd6f6602d65c743936cb9f9678426dea84840b4","base64":""},"src/main.rs":{"sha256":"808ca34d86ee3416264f110c339d9f93f0c49f6a8d787b34c6726ca892da8ddc","base64":""},"run.py":{"sha256":"ac04bd68e034969c22d8c9e3732494f6f4f2bbc1978b22d1489e51f59a4e8a3f","base64":""},"README.md":{"sha256":"2d1b69ec9ba92e7ce56220f77d2f74d9e317fb4cc638b745488d57b671ebe783","base64":""},"workflow-run.py":{"sha256":"b124815f32e16c4a57b24a085dd1aeeb90204932cfb57928972fa0ce87b7c345","base64":""},"workflow-linux-tests.py":{"sha256":"6d608e7a6c60bb6cfabcf74acf365000810ca700f6dfc0cecccfd334afb910fa","base64":""}}')
          for name, entry in files.items():
              path = root / name
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              data = base64.b64decode(entry['base64'], validate=True)
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as output: output.write(data)
          PYTHON
      - name: Run scoped qualification
        shell: bash
        run: python3 -I -B "$GITHUB_WORKSPACE/probe/workflow-run.py"
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recording-component-290dafcbe-${{ github.run_id }}-${{ github.run_attempt }}-macos-oop
          path: ${{ github.workspace }}/probe/
          if-no-files-found: warn
          retention-days: 3
  linux-launchers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REVIEWED_SOURCE_SHA: 290dafcbee05998bca4d825c054fb8ff3ea6c4af
      CARGO_TARGET_DIR: ${{ github.workspace }}/Cap/target
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 290dafcbee05998bca4d825c054fb8ff3ea6c4af
          path: Cap
          persist-credentials: false
      - name: Rust setup
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - name: Restore dependency cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1-rust
          cache-bin: "false"
          save-if: "false"
          shared-key: x86_64-unknown-linux-gnu
          workspaces: "Cap -> target"
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Prepare reviewed bounded helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYTHON'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve() / 'probe'
          root.mkdir(mode=0o700)
          files = json.loads('{"Cargo.toml":{"sha256":"2d7af13873c71e6dedf7f4da1cd6f6602d65c743936cb9f9678426dea84840b4","base64":""},"src/main.rs":{"sha256":"808ca34d86ee3416264f110c339d9f93f0c49f6a8d787b34c6726ca892da8ddc","base64":""},"run.py":{"sha256":"ac04bd68e034969c22d8c9e3732494f6f4f2bbc1978b22d1489e51f59a4e8a3f","base64":""},"README.md":{"sha256":"2d1b69ec9ba92e7ce56220f77d2f74d9e317fb4cc638b745488d57b671ebe783","base64":""},"workflow-run.py":{"sha256":"b124815f32e16c4a57b24a085dd1aeeb90204932cfb57928972fa0ce87b7c345","base64":""},"workflow-linux-tests.py":{"sha256":"6d608e7a6c60bb6cfabcf74acf365000810ca700f6dfc0cecccfd334afb910fa","base64":""}}')
          for name, entry in files.items():
              path = root / name
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              data = base64.b64decode(entry['base64'], validate=True)
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as output: output.write(data)
          PYTHON
      - name: Run scoped qualification
        shell: bash
        run: python3 -I -B "$GITHUB_WORKSPACE/probe/workflow-linux-tests.py"
      - name: Retain synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recording-component-290dafcbe-${{ github.run_id }}-${{ github.run_attempt }}-linux-launchers
          path: ${{ github.workspace }}/probe/
          if-no-files-found: warn
          retention-days: 3

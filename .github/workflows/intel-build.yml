name: "Intel macOS build"

# Cap still ships an Intel build, and Blacksmith has no Intel Macs, so this
# runs on GitHub's macos-26-intel, where a build takes 16 to 42 minutes (p10
# to p90, at most 86). As a job in CI it kept main's CI run open long after
# its other jobs finished (about 7 minutes); later pushes waited in CI's
# concurrency group and were replaced by newer ones before they ran, so those
# commits got no CI result (253 of 558 main CI runs ended cancelled, Oct 31 to
# Nov 17). Here it builds main's newest commit on its own. It is not a merge
# gate.
on:
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/actions/install-desktop-deps/**'
      - '.github/actions/setup-rust-cache/**'
      - 'crates/**'
      - 'vendor/**'
      - 'scripts/diagnostic-build.rs'
      - 'scripts/setup*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'scripts/setup.js'
      - 'apps/desktop-gpui/**'
      - 'apps/media-server/src/__tests__/fixtures/**'
      - 'scripts/build-desktop-binaries*'
      - 'scripts/build-gpui-binary.sh'
      - 'scripts/build-linux-packages.mjs'
      - 'scripts/build-macos-packages*'
      - 'scripts/bundle-gpui*'
      - 'scripts/finalize-linux-*'
      - 'scripts/finalize-macos-*'
      - 'scripts/linux-bundle-config*'
      - 'scripts/prepare-gpui-dependency*'
      - 'scripts/sync-desktop-versions.mjs'
      - 'scripts/verify-windows-stack.mjs'
      - '.github/workflows/intel-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-build-${{ github.ref }}
  # An hour-long build cancelled by every push would never finish; GitHub
  # keeps one pending run, the newest push.
  cancel-in-progress: false

jobs:
  build:
    name: Build GPUI Desktop (x86_64-apple-darwin, macos-26-intel)
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test desktop build preparation
        run: node --test scripts/prepare-gpui-dependency.test.mjs scripts/build-macos-packages.test.mjs scripts/bundle-gpui.test.mjs scripts/finalize-macos-packages.test.mjs

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-apple-darwin

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-apple-darwin
          prefix-key: v1-rust-gpui
          save-cache: "true"
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-apple-darwin

      # The ONNX Runtime setup.js prepares must load through ort's C API and
      # run a real inference on every platform Cap ships. On macOS setup.js
      # also strips the dylib's local symbols, so check the API still resolves.
      - name: Test the prepared ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nm -gU target/native-deps/onnxruntime/lib/libonnxruntime.dylib | grep -q OrtGetApiBase
          fi
          cargo test --locked -p cap-camera-effects --lib segmentation::tests::inference_runs_from_a_caller_with_a_tiny_stack -- --ignored --exact

      # The test build compiles every line the binary build does (the app has
      # no cfg(not(test)) code), so a separate binary build only repeated the
      # app crate's compile and link. Release builds still produce the binary.
      - name: Prepare GPUI dependency
        shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh

      - name: Test GPUI desktop
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            debug_path="$(cygpath "$GITHUB_WORKSPACE/target/debug")"
            export PATH="$debug_path:$PATH"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            frameworks="$GITHUB_WORKSPACE/apps/desktop-gpui/target/x86_64-apple-darwin/debug/Frameworks"
            mkdir -p "$frameworks"
            ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$frameworks/Spacedrive.framework"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib:$GITHUB_WORKSPACE/target/debug:$GITHUB_WORKSPACE/target/x86_64-apple-darwin/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24 -noreset" \
              cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-apple-darwin --bin cap-gpui
          else
            cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-apple-darwin --bin cap-gpui
          fi
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-apple-darwin -p cap-gpui-kernels
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-apple-darwin -p cap-glass
          cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-apple-darwin -p cap-i18n-build

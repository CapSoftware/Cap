name: Streaming editor A/B

on:
  push:
    branches:
      - ci/streaming-editor-ab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Editor A/B fixture
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-unknown-linux-gnu
          tier: fast
      - name: Fixture
        run: cargo run --profile ci-verify -p cap-verify --example streaming-editor-fixture -- "$RUNNER_TEMP/streaming-editor.cap"
      - uses: actions/upload-artifact@v4
        with:
          name: streaming-editor-fixture
          path: ${{ runner.temp }}/streaming-editor.cap

  linux-ab:
    name: Editor A/B (Linux)
    needs: fixture
    if: ${{ !contains(github.event.head_commit.message, 'windows only') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streaming-editor-fixture
          path: ${{ runner.temp }}/streaming-editor.cap
      - name: Install Linux desktop dependencies
        uses: ./.github/actions/install-desktop-deps
      - name: Install software GPU drivers and audio
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 pulseaudio
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          workspaces: apps/desktop-gpui -> target
      - name: Run setup
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - name: Prepare GPUI dependency
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Build
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-unknown-linux-gnu --bin cap-gpui
      - name: A/B
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib:$GITHUB_WORKSPACE/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pulseaudio --start --exit-idle-time=-1 || true
          binary="apps/desktop-gpui/target/x86_64-unknown-linux-gnu/debug/cap-gpui"
          xvfb=(xvfb-run -a --server-args="-screen 0 1920x1080x24 -noreset")
          python3 .github/scripts/streaming-editor-ab.py "$binary" "$RUNNER_TEMP/streaming-editor.cap" 3 "Linux lavapipe (Vulkan)" "${xvfb[@]}"
          echo '{"file_format_version":"1.0.0","ICD":{"library_path":"/nonexistent","api_version":"1.0.0"}}' > "$RUNNER_TEMP/no-vulkan.json"
          VK_ICD_FILENAMES="$RUNNER_TEMP/no-vulkan.json" VK_DRIVER_FILES="$RUNNER_TEMP/no-vulkan.json" \
            python3 .github/scripts/streaming-editor-ab.py "$binary" "$RUNNER_TEMP/streaming-editor.cap" 3 "Linux llvmpipe (GL)" "${xvfb[@]}"

  windows-ab:
    name: Editor A/B (Windows hosted, WARP)
    needs: fixture
    if: ${{ !contains(github.event.head_commit.message, 'linux only') }}
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streaming-editor-fixture
          path: ${{ runner.temp }}/streaming-editor.cap
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-gpui-hosted
          save-cache: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Hide a D3D12 debug layer that does not match the runtime
        shell: pwsh
        run: |
          $sys = Join-Path $env:WINDIR 'System32'
          $layers = Join-Path $sys 'd3d12SDKLayers.dll'
          $core = Join-Path $sys 'D3D12Core.dll'
          if (-not (Test-Path $layers)) { Write-Host 'no D3D12 debug layer installed'; exit 0 }
          $lv = (Get-Item $layers).VersionInfo
          $cv = (Get-Item $core).VersionInfo
          $lver = "$($lv.FileMajorPart).$($lv.FileMinorPart).$($lv.FileBuildPart).$($lv.FilePrivatePart)"
          $cver = "$($cv.FileMajorPart).$($cv.FileMinorPart).$($cv.FileBuildPart).$($cv.FilePrivatePart)"
          Write-Host "D3D12 debug layer $lver, runtime $cver"
          if ($lver -eq $cver) { exit 0 }
          takeown /f $layers | Out-Null
          icacls $layers /grant "*S-1-5-32-544:F" | Out-Null
          Rename-Item $layers 'd3d12SDKLayers.dll.mismatched'
      - name: Prepare GPUI dependency
        shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Build
        shell: bash
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-pc-windows-msvc --bin cap-gpui
      - name: A/B
        shell: bash
        run: |
          df -h . || true
          export PATH="$(cygpath "$GITHUB_WORKSPACE/target/debug"):$(cygpath "$GITHUB_WORKSPACE/target/ffmpeg/bin"):$PATH"
          python .github/scripts/streaming-editor-ab.py "apps/desktop-gpui/target/x86_64-pc-windows-msvc/debug/cap-gpui.exe" "$(cygpath -w "$RUNNER_TEMP/streaming-editor.cap")" 3 "Windows hosted WARP (D3D11)"

name: Instant mixer full candidate proof
on:
  workflow_dispatch:
  push:
    branches: [ci/fixproof-instant-mixer]
    paths: [.github/workflows/fix-instant-mixer-full.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  engine:
    uses: ./.github/workflows/engine-verify.yml
    with:
      tier: full
      proof-all: true
  capture:
    needs: engine
    uses: ./.github/workflows/verify-recording.yml
    with:
      tier: full
      repeat: "3"
      runners: hosted
      proof-run: true

name: Arch package

on:
  merge_group:
  pull_request:
    paths:
      - "scripts/build-linux-arch-package*"
      - ".github/workflows/arch-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub ignores paths filters in the merge queue, so the queue run applies
  # this workflow's pull_request paths to the queued change itself.
  scope:
    name: Scope
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Merge queue scope
        id: queue
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/merge_queue.py scope --workflow .github/workflows/arch-package.yml --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  test:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    name: Arch package versions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Node.js
        run: pacman -Syu --noconfirm --needed nodejs
      - name: Test package ordering and payloads
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home cap-package-test
          runuser -u cap-package-test -- node --test --test-reporter=tap scripts/build-linux-arch-package.test.mjs | tee /tmp/arch-package-tests.tap
          grep -q '^# skipped 0$' /tmp/arch-package-tests.tap

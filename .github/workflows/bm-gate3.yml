name: Scratch caption fix gate (temporary)

on:
  push:
    branches: [ci/bm-gate3]

permissions:
  contents: read
  actions: read

concurrency:
  group: bm-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  ROUND1_RUN: "45167422846"

jobs:
  full-tests:
    name: Full desktop tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin }
          - { runner: blacksmith-8vcpu-windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: blacksmith-8vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.target }}
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
      - shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          M="--manifest-path apps/desktop-gpui/Cargo.toml --locked --target ${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$(cygpath "$GITHUB_WORKSPACE/target/debug"):$PATH"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            frameworks="$GITHUB_WORKSPACE/apps/desktop-gpui/target/${{ matrix.target }}/debug/Frameworks"
            mkdir -p "$frameworks"
            ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$frameworks/Spacedrive.framework"
          else
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib:$GITHUB_WORKSPACE/target/debug:$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24 -noreset" cargo +1.95.0 test $M --bin cap-gpui 2>&1 | tee tests.log
          else
            cargo +1.95.0 test $M --bin cap-gpui 2>&1 | tee tests.log
          fi
          grep -E "studio_captions_use_only_words_the_user_added|caption_words_follow|test result" tests.log | tail -5
          cargo +1.95.0 test $M -p cap-notes -p cap-calendar -p cap-meetings -p cap-meeting-platform -p cap-notes-ui -p cap-diarize 2>&1 | tee crates.log
          grep -E "user_entries_leave_out|test result" crates.log | tail -12
      - name: The caption test fails without the fix
        shell: bash
        run: |
          set +e
          git apply --verbose .bm/negative.patch || { echo "NEG patch did not apply"; exit 1; }
          M="--manifest-path apps/desktop-gpui/Cargo.toml --locked --target ${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$(cygpath "$GITHUB_WORKSPACE/target/debug"):$PATH"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/native-deps/lib:$GITHUB_WORKSPACE/target/debug:$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          n=studio_captions_use_only_words_the_user_added
          if [[ "$RUNNER_OS" == "Linux" ]]; then xvfb-run -a cargo +1.95.0 test $M --bin cap-gpui $n > neg.log 2>&1; else cargo +1.95.0 test $M --bin cap-gpui $n > neg.log 2>&1; fi
          grep -E "^test |test result|panicked|left:|right:" neg.log | tail -n 8
          if grep -q "test result: FAILED. 0 passed; 1 failed" neg.log; then echo "NEG OK $n fails without the fix"; else echo "NEG BAD"; tail -n 40 neg.log; exit 1; fi

  test-lint:
    name: test-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --cwd scripts/test-lint && node scripts/test-lint/run.mjs


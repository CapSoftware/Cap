name: Database Profile Reliability

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/database/**"
      - "scripts/loops/**"
      - "bun.lock"
      - ".github/actions/setup-js/**"
      - ".github/workflows/database-profile-reliability.yml"
  push:
    branches: [main]
    paths:
      - "packages/database/**"
      - "scripts/loops/**"
      - "bun.lock"
      - ".github/actions/setup-js/**"
      - ".github/workflows/database-profile-reliability.yml"

permissions:
  contents: read

concurrency:
  group: database-profile-reliability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # GitHub ignores paths filters in the merge queue, so the queue run applies
  # this workflow's pull_request paths to the queued change itself.
  scope:
    name: Scope
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Merge queue scope
        id: queue
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/merge_queue.py scope --workflow .github/workflows/database-profile-reliability.yml --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  profile-contract:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    name: Profile, activation, and consent compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: loops_profile_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Verify profile queries and lifecycle decisions without database writes
        env:
          LOOPS_ACTIVATION_READONLY_TEST_URL: mysql://root@127.0.0.1:3306/loops_profile_tests
        run: >-
          bun test
          scripts/loops/activation.test.ts
          scripts/loops/batch.test.ts
          scripts/loops/sources.test.ts
          scripts/loops/profile.test.ts
          scripts/loops/lifecycle.test.ts

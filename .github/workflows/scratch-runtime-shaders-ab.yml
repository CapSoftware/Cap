name: Scratch runtime_shaders A/B
on:
  push:
    branches: [ci/runtime-shaders-ab]
jobs:
  toolchain:
    if: ${{ contains(github.event.head_commit.message, 'toolchain') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Metal toolchain probe
        run: |
          set +e
          sw_vers; uname -m
          xcode-select -p
          xcodebuild -version
          ls /Applications | grep -i xcode
          printf '#include <metal_stdlib>\nusing namespace metal;\nvertex float4 v(uint i [[vertex_id]]) { return float4(0); }\n' > "$RUNNER_TEMP/probe.metal"
          xcrun -sdk macosx metal -mmacosx-version-min=10.15.7 -c "$RUNNER_TEMP/probe.metal" -o "$RUNNER_TEMP/probe.air"
          echo "metal_exit=$?"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/probe.air" -o "$RUNNER_TEMP/probe.metallib"
          echo "metallib_exit=$?"
          ls -l "$RUNNER_TEMP"/probe.*
          true
  ab:
    if: ${{ !contains(github.event.head_commit.message, 'toolchain') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-6vcpu-macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain report
        run: |
          set +e
          sw_vers
          xcode-select -p
          xcodebuild -version
          ls /Applications | grep -i xcode
          echo "--- metal compiler"
          xcrun -sdk macosx -f metal
          xcrun -sdk macosx metal --version
          echo "metal_exit=$?"
          xcrun -sdk macosx metallib --version
          echo "metallib_exit=$?"
          xcodebuild -showComponent MetalToolchain
          system_profiler SPDisplaysDataType | head -20
          true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Setup
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
      - name: Prepare and instrument gpui
        run: |
          set -euo pipefail
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
          python3 -I .github/scripts/runtime-shaders-instrument.py "$GITHUB_WORKSPACE/../zed-cap" apps/desktop-gpui/src/main.rs
      - name: Build runtime_shaders (current)
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --release --target aarch64-apple-darwin --bin cap-gpui
          echo "runtime build: $(( $(date +%s) - start ))s"
          cp apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui-runtime
      - name: Ensure Metal toolchain
        run: |
          set +e
          if xcrun -sdk macosx metal --version; then
            echo "metal toolchain already present"
          else
            start=$(date +%s)
            xcodebuild -downloadComponent MetalToolchain
            echo "download exit=$? took $(( $(date +%s) - start ))s"
            xcrun -sdk macosx metal --version
          fi
          true
      - name: Build precompiled metallib
        run: |
          set -euo pipefail
          sed -i '' '/^    "runtime_shaders",$/d' apps/desktop-gpui/Cargo.toml
          grep -n -A5 '^gpui_platform' apps/desktop-gpui/Cargo.toml
          start=$(date +%s)
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --release --target aarch64-apple-darwin --bin cap-gpui
          echo "precompiled rebuild: $(( $(date +%s) - start ))s"
          cp apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui-precompiled
          find apps/desktop-gpui/target/aarch64-apple-darwin/release/build -name 'shaders.metallib' -exec ls -l {} \;
          ls -l apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui-*
      - name: Measure
        run: |
          set -euo pipefail
          dir=apps/desktop-gpui/target/aarch64-apple-darwin/release
          ls "$GITHUB_WORKSPACE/target/Frameworks"
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks" apps/desktop-gpui/target/aarch64-apple-darwin/Frameworks
          otool -L "$dir/cap-gpui-runtime" | grep -i framework | head -3
          python3 -I .github/scripts/runtime-shaders-measure.py "$PWD/$dir/cap-gpui-runtime" "$PWD/$dir/cap-gpui-precompiled" 7 "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-shaders-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/results.json
            apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui-runtime
            apps/desktop-gpui/target/aarch64-apple-darwin/release/cap-gpui-precompiled
          retention-days: 3

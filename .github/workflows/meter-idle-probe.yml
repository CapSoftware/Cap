name: meter-idle-probe

# Scratch: idle cost of the main window's live mic meter. Not for main.

on:
  push:
    branches: [ci/meter-idle-probe]
  workflow_dispatch:
    inputs:
      variants:
        description: "Extra env per variant, ';'-separated variants of space-separated KEY=VALUE"
        default: ""

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, blacksmith-6vcpu-macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Keep the display awake
        run: |
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          caffeinate -u -t 2 || true
          nohup caffeinate -dimsu > /dev/null 2>&1 &
          defaults -currentHost write com.apple.screensaver idleTime 0 || true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin
          prefix-key: v1-rust-gpui
          save-cache: false
          workspaces: apps/desktop-gpui -> target

      - name: Setup
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin

      - name: Prepare GPUI dependency
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh

      - name: Build
        run: |
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target aarch64-apple-darwin --bin cap-gpui
          frameworks="$GITHUB_WORKSPACE/apps/desktop-gpui/target/aarch64-apple-darwin/Frameworks"
          mkdir -p "$frameworks"
          ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$frameworks/Spacedrive.framework"

      - name: Measure
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          BIN=apps/desktop-gpui/target/aarch64-apple-darwin/debug/cap-gpui
          sw_vers; system_profiler SPDisplaysDataType | grep -E "Chipset|Resolution|Metal" || true
          for round in 1 2; do
            scripts/probe/meter_probe.sh $BIN "no-meter-r$round" CAP_PERF_FAKE_MIC=1 CAP_PERF_FAKE_MIC_NO_NOTIFY=1
            scripts/probe/meter_probe.sh $BIN "meter-r$round" CAP_PERF_FAKE_MIC=1
            scripts/probe/meter_probe.sh $BIN "meter-nomaterial-r$round" CAP_PERF_FAKE_MIC=1 CAP_GPUI_MATERIAL=none
          done
          IFS=';' read -ra extra <<< "${VARIANTS:-}"
          i=0
          for v in "${extra[@]}"; do
            i=$((i+1)); [ -z "$v" ] && continue
            read -ra kv <<< "$v"
            scripts/probe/meter_probe.sh $BIN "extra$i" CAP_PERF_FAKE_MIC=1 "${kv[@]}"
          done
          cat "$RUNNER_TEMP/probe-summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/probe-*

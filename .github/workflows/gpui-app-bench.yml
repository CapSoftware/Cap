name: GPUI app benchmark

on:
  pull_request:
    paths:
      - "apps/desktop-gpui/patches/**"
      - "scripts/gpui-app-bench.py"
      - ".github/workflows/gpui-app-bench.yml"
  push:
    branches:
      - "gpui-perf/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Ref whose patch stack is the baseline (default: the merge base with main)"
        default: ""
      rounds:
        description: "Interleaved rounds per side"
        default: "5"

concurrency:
  group: gpui-app-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor:
    name: Editor draw benchmark (macOS)
    # Benchmarks build GPUI twice and run for up to two hours, so pull requests
    # from forks do not start them; maintainers can run them with workflow_dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the reference recording
        uses: actions/checkout@v4
        with:
          repository: CapSoftware/cap-performance-fixtures
          path: performance-fixtures
          persist-credentials: false

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Prepare head and base GPUI checkouts
        shell: bash
        env:
          BASE_INPUT: ${{ inputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
          base="${BASE_INPUT:-}"
          if [[ -z "$base" ]]; then
            base="$(git merge-base HEAD "${PR_BASE:-origin/main}")"
          fi
          echo "Head $(git rev-parse --short HEAD), base patch stack from $(git rev-parse --short "$base")" | tee -a "$GITHUB_STEP_SUMMARY"
          git worktree add --detach "$RUNNER_TEMP/base/cap" "$base"
          (cd "$RUNNER_TEMP/base/cap" && node scripts/sync-desktop-versions.mjs && ./scripts/prepare-gpui-dependency.sh)

      - name: Build head and base
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/debug"
          # Each side builds its own app source against its own patch stack
          # (the base worktree's ../zed-cap), so a head that calls a GPUI API
          # its patches add still has a base to compare with. One target dir
          # keeps the shared crates.io dependencies built once.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/apps/desktop-gpui/target"
          build() {
            cargo +1.95.0 build --manifest-path "$1/apps/desktop-gpui/Cargo.toml" --locked \
              --target "$TARGET" --bin cap-gpui
            cp "$bin_dir/cap-gpui" "$bin_dir/cap-gpui-$2"
          }
          build "$GITHUB_WORKSPACE" head
          build "$RUNNER_TEMP/base/cap" base
          for frameworks in "$bin_dir/Frameworks" "$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/Frameworks"; do
            mkdir -p "$frameworks"
            ln -sfn "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$frameworks/Spacedrive.framework"
          done
          if cmp -s "$bin_dir/cap-gpui-head" "$bin_dir/cap-gpui-base"; then
            echo "Head and base builds are identical (no GPUI change)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the display awake
        run: |
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -u -t 2

      - name: Measure
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          bin_dir="$GITHUB_WORKSPACE/apps/desktop-gpui/target/$TARGET/debug"
          python3 scripts/gpui-app-bench.py \
            --base "$bin_dir/cap-gpui-base" \
            --head "$bin_dir/cap-gpui-head" \
            --fixture "$GITHUB_WORKSPACE/performance-fixtures/reference-recording.cap" \
            --out "$RUNNER_TEMP/app-bench" \
            --rounds "$ROUNDS" \
            --label macOS \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gpui-app-bench-macos
          path: ${{ runner.temp }}/app-bench
          if-no-files-found: ignore

name: Recording Reliability

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/media-server/**"
      - "packages/database/**"
      - "packages/web-*/**"
      - "crates/recording/**"
      - "bun.lock"
      - ".github/workflows/recording-reliability.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/media-server/**"
      - "packages/database/**"
      - "packages/web-*/**"
      - "crates/recording/**"
      - "bun.lock"
      - ".github/workflows/recording-reliability.yml"

permissions:
  contents: read

concurrency:
  group: recording-reliability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # GitHub ignores paths filters in the merge queue, so the queue run applies
  # this workflow's pull_request paths to the queued change itself.
  scope:
    name: Scope
    if: github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run: ${{ steps.queue.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Merge queue scope
        id: queue
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/merge_queue.py scope --workflow .github/workflows/recording-reliability.yml --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  recording-contract:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    name: Recording ownership, preservation, and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Verify recording contracts
        working-directory: apps/web
        run: |
          bun run vitest run \
            __tests__/unit/audio-level-publication.test.ts \
            __tests__/unit/recording-output.test.ts \
            __tests__/unit/recording-storage-lifecycle.test.ts \
            __tests__/unit/desktop-recording-*.test.ts \
            __tests__/unit/desktop-segments-*.test.ts \
            __tests__/unit/segments-audio-download.test.ts \
            __tests__/unit/finalize-desktop-recording.test.ts \
            __tests__/unit/media-server-progress.test.ts \
            __tests__/unit/media-processing-budget.test.ts \
            __tests__/unit/playback-source.test.ts \
            __tests__/unit/share-page-loading.test.ts \
            __tests__/unit/media-player-store-refs.test.ts \
            __tests__/unit/video-edit-processing.test.ts \
            __tests__/unit/video-edit-published-output.test.ts \
            __tests__/unit/upload-progress-playback.test.ts \
            __tests__/unit/recording-prepare.test.ts \
            __tests__/unit/s3-bucket-connections.test.ts \
            __tests__/unit/media-processing-workflows.test.ts \
            __tests__/unit/new-media-comment-thumbnail.test.ts \
            __tests__/unit/comment-reply-parent.test.ts

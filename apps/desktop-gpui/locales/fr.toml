[onboarding.faq.storage]
answer = "Tous les enregistrements sont stockés localement sur votre ordinateur. En mode Instant, ils sont aussi mis en ligne sur le cloud de Cap pour faciliter le partage. Vous pouvez gérer le stockage dans les paramètres."
question = "Où sont stockés mes enregistrements ?"


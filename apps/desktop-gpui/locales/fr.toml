answer = "En mode Instant, vous obtenez automatiquement un lien de partage à l'arrêt de l'enregistrement. En mode Studio, exportez votre vidéo montée puis partagez-la via le cloud de Cap ou enregistrez-la localement."
question = "Comment fonctionne le partage ?"

[onboarding.faq.shortcuts]
answer = "Rendez-vous dans Paramètres → Raccourcis à tout moment pour personnaliser tous vos raccourcis clavier."
question = "Puis-je modifier mes raccourcis plus tard ?"

[onboarding.faq.storage]
answer = "Tous les enregistrements sont stockés localement sur votre ordinateur. En mode Instant, ils sont aussi mis en ligne sur le cloud de Cap pour faciliter le partage. Vous pouvez gérer le stockage dans les paramètres."

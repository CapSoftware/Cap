answer = "Der Instant-Modus lädt schon während der Aufnahme hoch: Stoppen Sie, und Ihr Link zum Teilen ist sofort da. Der Studio-Modus nimmt lokal in voller Qualität auf, sodass Sie vor dem Teilen Hintergründe, Effekte und mehr hinzufügen können."
question = "Was ist der Unterschied zwischen Instant und Studio?"

[onboarding.faq.sharing]
answer = "Im Instant-Modus erhalten Sie automatisch einen Link zum Teilen, sobald Sie die Aufnahme beenden. Im Studio-Modus exportieren Sie Ihr bearbeitetes Video und teilen es über die Cap Cloud oder speichern es lokal."

pricing_link = "View pricing plans ↗"
subtitle = "Everything you need to know to get started."
title = "Frequently Asked Questions"

[onboarding.faq.free]
answer = "Cap is free for personal use. For teams and commercial use, check out our pricing plans."
question = "Is Cap free to use?"

[onboarding.faq.instant_vs_studio]
answer = "Instant mode uploads as you record — stop recording and you'll have a shareable link immediately. Studio mode records locally in full quality, letting you edit with backgrounds, effects, and more before sharing."
question = "What's the difference between Instant and Studio?"

[onboarding.faq.sharing]
answer = "In Instant mode, you get a shareable link automatically when you stop recording. In Studio mode, export your edited video and share via Cap's cloud or save locally."
question = "How does sharing work?"

[onboarding.faq.shortcuts]
answer = "Head to Settings → Shortcuts at any time to customize all your keyboard shortcuts."
question = "Can I change my shortcuts later?"

[onboarding.faq.storage]
answer = "All recordings are stored locally on your computer. In Instant mode, they're also uploaded to Cap's cloud for easy sharing. You can manage storage in Settings."
question = "Where are my recordings stored?"


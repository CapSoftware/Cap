[onboarding.faq.free]
answer = "Capは個人利用なら無料です。チームや商用での利用については料金プランをご覧ください。"
question = "Capは無料で使えますか？"

[onboarding.faq.instant_vs_studio]
answer = "Instantモードは録画しながらアップロードするので、停止するとすぐに共有リンクが手に入ります。Studioモードはフル画質でローカルに録画し、共有前に背景やエフェクトなどを加えて編集できます。"
question = "InstantとStudioの違いは何ですか？"

[onboarding.faq.sharing]
answer = "Instantモードでは、録画を停止すると自動的に共有リンクが作成されます。Studioモードでは、編集した動画を書き出して、Capのクラウドで共有するかローカルに保存します。"
question = "共有はどのように行いますか？"

[onboarding.faq.shortcuts]
answer = "いつでも 設定 → ショートカット から、すべてのキーボードショートカットをカスタマイズできます。"
question = "ショートカットはあとで変更できますか？"

[onboarding.faq.storage]
answer = "録画はすべてコンピュータにローカル保存されます。Instantモードでは、簡単に共有できるようにCapのクラウドにもアップロードされます。保存先の管理は設定から行えます。"
question = "録画はどこに保存されますか？"


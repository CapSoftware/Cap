[onboarding.faq.free]
answer = "Cap es gratis para uso personal. Para equipos y uso comercial, consulta nuestros planes."
question = "¿Cap es gratis?"

[onboarding.faq.instant_vs_studio]
answer = "El modo Instant sube mientras grabas: detén la grabación y tendrás un enlace para compartir al momento. El modo Studio graba localmente con calidad completa para que puedas editar con fondos, efectos y más antes de compartir."
question = "¿Qué diferencia hay entre Instant y Studio?"

[onboarding.faq.sharing]
answer = "En el modo Instant obtienes un enlace para compartir automáticamente al detener la grabación. En el modo Studio, exporta tu vídeo editado y compártelo a través de la nube de Cap o guárdalo localmente."
question = "¿Cómo funciona el uso compartido?"

[onboarding.faq.shortcuts]
answer = "Ve a Ajustes → Atajos en cualquier momento para personalizar todos tus atajos de teclado."
question = "¿Puedo cambiar mis atajos más adelante?"

[onboarding.faq.storage]
answer = "Todas las grabaciones se guardan localmente en tu ordenador. En el modo Instant también se suben a la nube de Cap para compartirlas fácilmente. Puedes gestionar el almacenamiento en Ajustes."
question = "¿Dónde se guardan mis grabaciones?"


[package]
name = "cap-meetings"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
publish = false

[dependencies]
cap-diarize = { path = "../diarize", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

feature_2 = "Choose when to share"
feature_3 = "Your own sharing server"

[onboarding.faq.free]
question = "Is Cap free to use?"
answer = "Cap is open source under AGPLv3, including for personal and commercial work. Connected cloud services have their own terms and costs."

[onboarding.faq.instant_vs_studio]
question = "How do the recording modes differ?"
answer = "Instant records a ready-to-play local video. Studio records locally for editing. Screenshot captures a still image. UX Walk opens a fresh browser window and keeps its recording, notes, chapters and transcripts together."

[onboarding.faq.storage]
answer = "All recordings stay on your computer. Nothing uploads automatically. Choose a server in Settings → Sharing, then share individual videos or screenshots."

[onboarding.faq.sharing]
answer = "Choose your server and link expiry in Settings → Sharing. Use Share on a recording or screenshot to create an expiring link. You can also export files and use any sharing service you prefer."

[onboarding.overview]
subtitle = "Share a quick capture, edit a polished recording, or walk through your product with notes and chapters."


[package]
name = "tauri-plugin-store"
version = "2.4.0"
description = "Simple, persistent key-value store."
authors = ["Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/tauri-apps/plugins-workspace"
links = "tauri-plugin-store"

[build-dependencies]
tauri-plugin = { version = "2.4", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.2", default-features = false }
tracing = "0.1"
thiserror = "2"
dunce = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.8.2", default-features = false, features = ["wry"] }

[dev-dependencies]
tauri = { version = "2.8.2", default-features = false, features = ["test"] }
tempfile = "3"

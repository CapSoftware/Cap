<!doctype html>
<html>
<head><meta charset="utf-8"><title>Voice notes</title></head>
<body>
<p id="state">starting</p>
<script>
// A page that only takes the microphone (voice typing, a voice note): nothing marks it a meeting.
let mic = null;
(async () => {
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById("state").textContent = "listening";
    fetch("/started", { method: "POST" }).catch(() => {});
  } catch (e) {
    document.getElementById("state").textContent = "error " + e;
  }
})();
</script>
</body>
</html>
